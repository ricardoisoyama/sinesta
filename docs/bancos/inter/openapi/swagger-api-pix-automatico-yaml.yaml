          description: >-
            Trata-se de uma data, no formato `YYYY-MM-DD`, segundo ISO 8601.
            Data estimada de primeiro pagamento.
          example: '2023-04-01T00:00:00.000Z'
    RecNotification:
      type: object
      title: Recorrência Notificada
      required:
        - idRec
        - status
        - atualizacao
      description: Atributos de Notificação de Recorrência
      allOf:
        - type: object
          properties:
            idRec:
              $ref: '#/components/schemas/RecId'
        - $ref: '#/components/schemas/RecStatus'
        - $ref: '#/components/schemas/RecAtualizacao'
        - $ref: '#/components/schemas/RecEncerramento'
        - $ref: '#/components/schemas/RecAtivacao'
    RecAtivacao:
      type: object
      title: Dados relacionados à confirmação da ativação da recorrência.
      properties:
        ativacao:
          $ref: '#/components/schemas/RecAtivacaoConfirmacao'
    RecAtivacaoConfirmacao:
      type: object
      title: Dados relacionados à confirmação da ativação da recorrência.
      required:
        - tipoJornada
      description: Contendo `tipojornada`e `dadosJornada`
      properties:
        tipoJornada:
          type: string
          title: Jornada de ativação
          description: >
            Dado relacionado ao caminho percorrido pelo processo de adesão à
            recorrência pelo usuário pagador:

            - `JORNADA_1`: Usuário pagador aceitou a recorrência através de
            notificação externa.

            - `JORNADA_2`: Usuário pagador aceitou a recorrência através de
            leitura de QR Code de recorrência.

            - `JORNADA_3`: Usuário pagador iniciou a recorrência através de
            leitura de QR Code composto e pagamento de cobrança imediata.

            - `JORNADA_4`: Usuário pagador escolheu aderir à recorrência através
            de leitura de QR Code composto relacionado à cobrança com
            vencimento.

            - `AGUARDANDO_DEFINICAO`: Valor inicial posterior à criação e
            anterior à ativação da recorrência.
          enum:
            - JORNADA_1
            - JORNADA_2
            - JORNADA_3
            - JORNADA_4
            - AGUARDANDO_DEFINICAO
        dadosJornada:
          $ref: '#/components/schemas/RecAtivacaoJornada'
    RecAtivacaoSolicitada:
      type: object
      title: Dados relacionados à confirmação da ativação da recorrência.
      properties:
        ativacao:
          type: object
          title: Confirmação da ativação da recorrência
          description: Contendo `dadosJornada`
          properties:
            dadosJornada:
              $ref: '#/components/schemas/RecAtivacaoJornada'
    RecAtivacaoJornada:
      type: object
      required:
        - txid
      title: Dados de confirmação da jornada e início da recorrência
      description: Contendo `txid`
      properties:
        txid:
          $ref: '#/components/schemas/TxId'
    RecStatus:
      type: object
      title: Status da Recorrência
      required:
        - status
      properties:
        status:
          type: string
          title: Status do registro da recorrência
          description: |
            Status do registro da recorrência:
            - `CRIADA`: Recorrência criada, aguardando aprovação do pagador
            - `APROVADA`: Recorrência aprovada pelo pagador e ativa
            - `REJEITADA`: Recorrência rejeitada pelo pagador
            - `EXPIRADA`: Recorrência expirou sem aprovação
            - `CANCELADA`: Recorrência cancelada pelo recebedor ou pagador
          enum:
            - CRIADA
            - APROVADA
            - REJEITADA
            - EXPIRADA
            - CANCELADA
    RecConfiguracao:
      type: object
      title: Configuração da Recorrência
      required:
        - politicaRetentativa
      properties:
        politicaRetentativa:
          type: string
          title: Política de retentativa pós vencimento da recorrência
          description: >-
            NAO_PERMITE: Não permite retentativas.</br> PERMITE_3R_7D: Permite
            até 3 retentativas em dias diferentes no intervalo de até 7 dias
            corridos contados a partir da data de liquidação prevista na
            instrução de pagamento original.</br> As retentativas devem ser
            enviadas pelo recebedor. [Consulte a
            documentação](#tag/Cobranca-Recorrente/operation/cobrTxidRetentativaDataPost)
          enum:
            - NAO_PERMITE
            - PERMITE_3R_7D
    RecAtualizacao:
      type: object
      title: Histórico de atualização da recorrência.
      required:
        - atualizacao
      properties:
        atualizacao:
          type: array
          title: Histórico de Status
          description: Contendo `status`e `data`.
          items:
            type: object
            required:
              - status
              - data
            properties:
              status:
                type: string
                title: Status da recorrência
                description: >
                  Status da recorrência:

                  - `CRIADA`: Recorrência criada, aguardando aprovação do
                  pagador

                  - `APROVADA`: Recorrência aprovada pelo pagador e ativa

                  - `REJEITADA`: Recorrência rejeitada pelo pagador

                  - `EXPIRADA`: Recorrência expirou sem aprovação

                  - `CANCELADA`: Recorrência cancelada pelo recebedor ou pagador
                enum:
                  - CRIADA
                  - APROVADA
                  - REJEITADA
                  - EXPIRADA
                  - CANCELADA
              data:
                type: string
                format: date-time
                description: >-
                  Data e hora do registro de status atualizado. Respeita RFC
                  3339.
    RecEncerramento:
      type: object
      title: Detalhamento do encerramento da recorrência.
      properties:
        encerramento:
          type: object
          description: >-
            Detalha o encerramento da recorrência, seja por `rejeicao` ou
            `cancelamento`
          properties:
            rejeicao:
              $ref: '#/components/schemas/RecEncerramentoRejeicao'
            cancelamento:
              $ref: '#/components/schemas/RecEncerramentoCancelamento'
    RecEncerramentoRejeicao:
      type: object
      title: Informações sobre a rejeição da recorrência
      required:
        - codigo
        - descricao
      description: Contendo `codigo` e `descricao` da causa da rejeição.
      properties:
        codigo:
          type: string
          title: Código da rejeição
          description: >-
            Código da rejeição.</br>AC01: Conta não localizada ou não
            pertencente ao usuário pagador.</br>AC04: Conta transacional do
            usuário pagador encontra-se encerrada.</br>AC06: Conta transacional
            do usuário pagador encontra-se bloqueada.</br>AG12: Não é permitido
            o envio da solicitação de autorização de recorrência, de
            cancelamento de recorrência, de confirmação de recorrência ou de
            cancelamento de pain.009 para uma conta transacional na mesma
            instituição ou em participante que utilize o serviço de liquidação
            de um mesmo participante liquidante no SPI.</br>AM05: Solicitação de
            confirmação de recorrência para pagamentos periódicos já confirmada
            previamente ou com status 'PDNG'.</br>AP01: Divergência no campo de
            atualização dos dados da recorrência para os pagamentos periódicos e
            o status da recorrência para os pagamentos periódicos (ex.: falta de
            sincronização).</br>AP02: CPF/CNPJ do usuário pagador não localizado
            ou diferente do constante na pain.009 original. Ou, no caso de
            cancelamento, o CPF/CNPJ usuário pagador não coincide com o contido
            nos dados da recorrência para os pagamentos periódicos.</br>AP03:
            Agência do usuário pagador não localizada.</br>AP04: ID da
            recorrência inválido ou não corresponde ao original.</br>AP05:
            Status da recorrência para os pagamentos periódicos
            inconsistente.</br>AP06: CPF/CNPJ do usuário recebedor diferente do
            constante na pain.009 ou do payload. Ou, no caso de cancelamento, o
            CPF/CNPJ usuário recebedor não coincide com o contido nos dados da
            recorrência para os pagamentos periódicos.</br>AP07: Confirmação da
            recorrência pelo usuário pagador realizada após a expiração ou
            cancelamento da solicitação de confirmação (pain.009).</br>AP08:
            Primeiro pagamento imediato associado à recorrência não foi
            identificado. (Válido apenas para a Jornada 3 de
            autorização.).</br>AP09: Solicitação de confirmação de recorrência
            para pagamentos periódicos não foi identificada para viabilizar seu
            cancelamento.</br>AP10: CPF/CNPJ do solicitante do cancelamento não
            corresponde à identificação do usuário pagador/recebedor ou do PSP
            pagador/recebedor contidos na recorrência para os pagamentos
            periódicos.</br>AP11: ISPB do PSP pagador diverge da informação
            contida na recorrência para pagamentos periódicos.</br>AP12: ISPB do
            PSP recebedor diverge da informação contida na recorrência para
            pagamentos periódicos.</br>AP13: Solicitação de confirmação da
            recorrência para os pagamentos periódicos rejeitada pelo usuário
            pagador por não reconhecimento do usuário recebedor.</br>AP14:
            Solicitação de confirmação da recorrência para os pagamentos
            periódicos rejeitada pelo usuário pagador por não ter interesse no
            uso do Pix Automático para o usuário recebedor.</br>AP15:
            Solicitação de confirmação da recorrência para os pagamentos
            periódicos rejeitada pelo participante do usuário pagador que optou
            por não oferecer uso do Pix Automático para cliente pessoa
            jurídica.</br>CH16: Preenchimento do conteúdo da mensagem incorreto
            ou incompatível com as regras de negócio.</br>DS27: Participante não
            se encontra cadastrado ou ainda não iniciou a operação no
            SPI.</br>MD01: Recorrência objeto da solicitação de cancelamento não
            existe. Não deve ser utilizado para solicitações de cancelamento de
            pain.009 com status = 'PDNG'. Ou seja, uma recorrência com status =
            'PDNG' deve ser considerada como uma recorrência
            existente.</br>MD20: Recorrência objeto da solicitação de
            cancelamento já expirou.</br>RC09: ISPB do participante do usuário
            pagador inválido ou inexistente.</br>RC10: ISPB do participante do
            usuário recebedor inválido ou inexistente.
          enum:
            - AC01
            - AC04
            - AC06
            - AG12
            - AM05
            - AP01
            - AP02
            - AP03
            - AP04
            - AP05
            - AP06
            - AP07
            - AP08
            - AP09
            - AP10
            - AP11
            - AP12
            - AP13
            - AP14
            - AP15
            - CH16
            - DS27
            - MD01
            - MD20
            - RC09
            - RC10
          maxLength: 4
        descricao:
          type: string
          title: Descricao da rejeição
          description: Descricao da causa da rejeição
          maxLength: 105
    RecEncerramentoCancelamento:
      type: object
      title: Informações sobre o cancelamento da recorrência
      required:
        - solicitante
        - codigo
        - descricao
      description: Contendo `solicitante`, `codigo` e `descricao` do cancelamento.
      properties:
        solicitante:
          type: string
          title: Solicitante do cancelamento
          description: >
            Identifica quem solicitou o cancelamento:

            - `PSP_PAGADOR`: Cancelamento solicitado pelo PSP do pagador

            - `USUARIO_PAGADOR`: Cancelamento solicitado pelo usuário pagador

            - `PSP_RECEBEDOR`: Cancelamento solicitado pelo PSP do recebedor

            - `USUARIO_RECEBEDOR`: Cancelamento solicitado pelo usuário
            recebedor
          enum:
            - PSP_PAGADOR
            - USUARIO_PAGADOR
            - PSP_RECEBEDOR
            - USUARIO_RECEBEDOR
        codigo:
          type: string
          title: Código do cancelamento
          description: >
            Razão para a mudança de status. Valores possíveis:

            - **ACCL**: Cancelamento motivado por encerramento de conta

            - **CPCL**: Cancelamento motivado por encerramento de empresa

            - **DCSD**: Cancelamento motivado por falecimento

            - **ERSL**: Cancelamento solicitado pelo usuário recebedor ou pelo
            seu participante por erro na solicitação de confirmação

            - **FRUD**: Cancelamento motivado por fraude

            - **PCFD**: Cancelamento solicitado pelo PSP recebedor por ausência
            de resposta à pain.009 dentro do prazo regulamentar

            - **SLCR**: Cancelamento solicitado pelo participante do usuário
            recebedor porque a mesma recorrência foi confirmada por meio de
            outra jornada, por exemplo, via QR Code

            - **SLDB**: Cancelamento solicitado pelo usuário recebedor
          enum:
            - ACCL
            - CPCL
            - DCSD
            - ERSL
            - FRUD
            - PCFD
            - SLCR
            - SLDB
          maxLength: 4
        descricao:
          type: string
          title: Descricao do cancelamento
          description: Descricao do cancelamento.
          maxLength: 105
    RecId:
      type: string
      title: ID Recorrência
      description: >
        # Identificador da Recorrência


        Regra de formação:

          - RAxxxxxxxxyyyyMMddzzzzzzzzzzz (29 caracteres; "case sensitive", isso
        é, diferencia letras maiúsculas e minúsculas), sendo:
          - "R":  fixo (1 caractere). "R" para a recorrência criada dentro do
        Pix;
          - "A": identificação da possibilidade de novas tentativas, sendo
        possíveis os valores "R" ou "N" (1 caractere). "R" caso a recorrência
        permita novas tentativas de pagamento pós vencimento, ou "N" caso não
        permita novas tentativas.
          - "xxxxxxxx":  identificação do agente que presta serviço para o
        usuário recebedor que gerou o <Id>, podendo ser: o ISPB do participante
        direto, o ISPB do participante indireto ou os 8 primeiros dígitos do
        CNPJ do prestador de serviço de iniciação (8 caracteres numéricos
        [0-9]);
          - "yyyyMMdd":  data (8 caracteres) de criação da recorrência;
          - "zzzzzzzzzzz": sequencial criado pelo agente que gerou o <Id>
        (11 caracteres alfanuméricos [a-z|A-Z|0-9]). Deve ser único dentro de
        cada "yyyyMMdd".

        Dessa forma, o ID da recorrência deve ser formado de acordo com um dos
        tipos a seguir:

        - "RRxxxxxxxxyyyyMMddzzzzzzzzzzz"; para recorrência criada dentro do Pix
        e que permite novas tentativas de pagamento pós vencimento; ou

        - "RNxxxxxxxxyyyyMMddzzzzzzzzzzz"; para recorrência criada dentro do Pix
        e que não permite novas tentativas de pagamento pós vencimento.
      pattern: '[a-zA-Z0-9]{29}'
      minLength: 29
      maxLength: 29
      example: RR1234567820240115abcdefghijk
    RecBase:
      title: Recorrência Base
      type: object
      required:
        - calendario
        - vinculo
      description: Atributos de Configuração de Recorrência
      properties:
        vinculo:
          $ref: '#/components/schemas/RecBaseObjeto'
        calendario:
          $ref: '#/components/schemas/RecBaseCalendario'
        valor:
          type: object
          description: Contendo `valorRec`e `ValorMinimoRecebedor`
          properties:
            valorRec:
              type: string
              pattern: \d{1,10}\.\d{2}
              title: Valor da recorrência
              description: >-
                Campo opcional, deve ser preenchido apenas quando o valor dos
                pagamentos for fixo ou não for sujeito a alteração durante a
                vigência da autorização.
            valorMinimoRecebedor:
              type: string
              pattern: \d{1,10}\.\d{2}
              title: Valor mínimo da recorrência
              description: >-
                Campo opcional. Valor definido pelo usuário recebedor. Se o
                usuário pagador atribuir um valor máximo para os pagamentos
                daquela autorização, ele não poderá ser inferior ao piso
                definido pelo usuário recebedor. Não pode ser preenchido nas
                autorizações de valor fixo, ou seja, com campo valor preenchido.
    RecBaseObjeto:
      type: object
      title: Descrição do Objeto da Recorrência
      required:
        - contrato
        - devedor
      description: Contendo `objeto`, `devedor` e `contrato`.
      properties:
        objeto:
          type: string
          title: Identificador do objeto de vínculo
          description: >-
            Campo de texto livre para informações referentes ao contrato que
            permitam ao usuário pagador reconhecer o objeto dos pagamentos
            periódicos por meio do Pix Automático.
          maxLength: 35
          example:
            - Conta de energia Av. Paulista, 1804
            - Serviço de internet banda larga
            - Assinatura anual
        devedor:
          title: Informações sobre o devedor da recorrência
          description: Contendo `nome` e `cpf` ou `cnpj`
          required:
            - nome
            - cpf
            - cnpj
          oneOf:
            - type: object
              title: nome e CPF
              properties:
                nome:
                  type: string
                  title: Nome
                  description: Nome do devedor.
                  maxLength: 140
                cpf:
                  type: string
                  title: CPF
                  pattern: \d{11}
                  description: CPF do devedor.
            - type: object
              title: nome e CNPJ
              properties:
                nome:
                  type: string
                  title: Nome
                  description: Nome do devedor.
                  maxLength: 140
                cnpj:
                  type: string
                  title: CNPJ
                  pattern: \d{14}
                  description: CNPJ do devedor.
        contrato:
          type: string
          title: Objeto da autorização
          description: >-
            Número, identificador, ou código que representa o objeto da
            autorização (contrato, pedido etc.).
          maxLength: 35
    SolicRecId:
      type: object
      title: Id da Solicitação de recorrência
      required:
        - idSolicRec
      description: Dados criados ou alterados da cobrança recorrente via API Pix
      properties:
        idSolicRec:
          type: string
          title: ID Solicitação da Recorrência
          description: >
            # Identificador da Solicitação da Recorrência


            Regra de formação:

            - SCxxxxxxxxyyyyMMddzzzzzzzzzzz (29 caracteres; “case sensitive”,
            isso é, diferencia letras maiúsculas e minúsculas), sendo:
              - SC - fixo (2 caracteres);
              - xxxxxxxx – ISPB do agente que envia a mensagem pain.009 de
            solicitação de confirmação da recorrência;
              - yyyyMMdd – data (8 caracteres) de criação da mensagem pain.009
            de solicitação de confirmação da recorrência;
              - zzzzzzzzzzz – sequencial criado pelo agente que gerou a
            mensagem de solicitação de confirmação da recorrência (11 caracteres
            alfanuméricos [a-z|A-Z|0-9]). Deve ser único dentro de cada
            “yyyyMMdd”.
          pattern: '[a-zA-Z0-9]{29}'
          minLength: 29
          maxLength: 29
          example: SC1234567820240115abcdefghijk
    SolicRecBase:
      type: object
      title: Solicitação de Recorrência Base
      required:
        - calendario
        - idRec
        - destinatario
      description: Dados criados ou alterados da cobrança recorrente via API Pix
      properties:
        idRec:
          $ref: '#/components/schemas/RecId'
        calendario:
          $ref: '#/components/schemas/SolicrecBaseCalendario'
        destinatario:
          $ref: '#/components/schemas/DadosBancarios'
    SolicRecStatus:
      type: object
      title: Status da Solicitação de Recorrência
      required:
        - status
      properties:
        status:
          type: string
          title: Status do registro da solicitação de recorrência
          description: |
            Status da solicitação de recorrência:
            - `CRIADA`: Solicitação criada, aguardando envio
            - `ENVIADA`: Solicitação enviada ao pagador
            - `RECEBIDA`: Solicitação recebida pelo pagador
            - `REJEITADA`: Solicitação rejeitada pelo pagador
            - `ACEITA`: Solicitação aceita pelo pagador
            - `EXPIRADA`: Solicitação expirou sem resposta
            - `CANCELADA`: Solicitação cancelada
          enum:
            - CRIADA
            - ENVIADA
            - RECEBIDA
            - REJEITADA
            - ACEITA
            - EXPIRADA
            - CANCELADA
    SolicRecAtualizacao:
      type: object
      title: Histórico de Status da Solicitação de Recorrência
      required:
        - atualizacao
      properties:
        atualizacao:
          type: array
          title: Histórico de Status da Solicitação de Recorrência
          description: Contendo `status`e `data`
          items:
            type: object
            required:
              - status
              - data
            properties:
              status:
                type: string
                title: Status do registro da solicitação de recorrência
                description: |
                  Status da solicitação de recorrência:
                  - `CRIADA`: Solicitação criada, aguardando envio
                  - `ENVIADA`: Solicitação enviada ao pagador
                  - `RECEBIDA`: Solicitação recebida pelo pagador
                  - `REJEITADA`: Solicitação rejeitada pelo pagador
                  - `ACEITA`: Solicitação aceita pelo pagador
                  - `EXPIRADA`: Solicitação expirou sem resposta
                  - `CANCELADA`: Solicitação cancelada
                enum:
                  - CRIADA
                  - ENVIADA
                  - RECEBIDA
                  - REJEITADA
                  - ACEITA
                  - EXPIRADA
                  - CANCELADA
              data:
                type: string
                format: date-time
                description: >-
                  Data e hora do registro de status atualizado. Respeita RFC
                  3339.
    SolicRecSolicitada:
      type: object
      title: Solicitação de Recorrência
      description: Dados criados ou alterados da solicitação da recorrência
      allOf:
        - $ref: '#/components/schemas/SolicRecBase'
    SolicRecRevisada:
      type: object
      title: Solicitação de Recorrência
      description: Dados alterados da solicitação da recorrência
      required:
        - status
      properties:
        status:
          type: string
          title: Status do registro da solicitação de recorrência
          enum:
            - CANCELADA
    SolicRecCompleta:
      type: object
      title: Solicitação de Recorrência Completa
      required:
        - rec
      description: Dados criados ou alterados da solicitação da recorrência
      allOf:
        - $ref: '#/components/schemas/SolicRecBase'
        - $ref: '#/components/schemas/SolicRecId'
        - $ref: '#/components/schemas/SolicRecStatus'
        - $ref: '#/components/schemas/SolicRecAtualizacao'
        - type: object
          properties:
            recPayload:
              $ref: '#/components/schemas/RecPayload'
    CobRGerada:
      type: object
      title: Cobrança Recorrente Gerada
      required:
        - idRec
        - txid
        - status
        - valor
        - recebedor
        - calendario
      description: Dados criados ou alterados da cobrança recorrente via API Pix
      allOf:
        - type: object
          properties:
            idRec:
              $ref: '#/components/schemas/RecId'
        - type: object
          properties:
            txid:
              $ref: '#/components/schemas/TxId'
        - $ref: '#/components/schemas/CobRBase'
        - type: object
          properties:
            calendario:
              $ref: '#/components/schemas/CobrCalendario'
        - type: object
          properties:
            recebedor:
              $ref: '#/components/schemas/DadosBancariosRecebedorCompleto'
        - $ref: '#/components/schemas/CobRStatus'
        - $ref: '#/components/schemas/DadosDevedorRecorrencia'
    CobRCompleta:
      type: object
      title: Cobrança Recorrente Completa
      required:
        - idRec
        - txid
        - status
        - valor
        - recebedor
        - calendario
      description: Dados completos da cobrança recorrente via API Pix
      allOf:
        - type: object
          properties:
            idRec:
              $ref: '#/components/schemas/RecId'
        - type: object
          properties:
            txid:
              $ref: '#/components/schemas/TxId'
        - $ref: '#/components/schemas/CobRBase'
        - type: object
          properties:
            calendario:
              $ref: '#/components/schemas/CobrCalendario'
        - $ref: '#/components/schemas/CobRStatus'
        - $ref: '#/components/schemas/CobRConfiguracao'
        - $ref: '#/components/schemas/DadosDevedorRecorrencia'
        - type: object
          properties:
            pix:
              type: array
              title: Pix recebidos
              description: >-
                Contendo `endToEndId`, `txid`, `valor`, `horario`, `infoPagador`
                e `devolucoes`
              items:
                $ref: '#/components/schemas/PixAutomatico'
        - $ref: '#/components/schemas/CobRAtualizacao'
        - $ref: '#/components/schemas/CobRTentativas'
    CobRAtualizacao:
      type: object
      title: Histórico de Atualização da Cobrança Recorrente
      required:
        - atualizacao
      properties:
        atualizacao:
          type: array
          title: Histórico de Status
          description: Histórico das mudanças de status das cobranças recorrentes.
          items:
            type: object
            required:
              - status
              - data
            properties:
              status:
                type: string
                title: Status da cobrança
                description: >
                  Status da cobrança recorrente:

                  - `CRIADA`: A cobrança foi criada pelo usuário recebedor

                  - `ATIVA`: O PSP Pagador recebeu e aceitou a cobrança,
                  agendando o pagamento

                  - `CONCLUIDA`: A cobrança foi paga com sucesso

                  - `EXPIRADA`: A cobrança não foi liquidada após todas as
                  tentativas de pagamento permitidas

                  - `REJEITADA`: A cobrança foi rejeitada pelo PSP Pagador

                  - `CANCELADA`: A cobrança foi cancelada com sucesso
                enum:
                  - CRIADA
                  - ATIVA
                  - CONCLUIDA
                  - EXPIRADA
                  - REJEITADA
                  - CANCELADA
              data:
                type: string
                format: date-time
                description: >-
                  Data e hora do registro de status atualizado. Respeita RFC
                  3339.
        encerramento:
          $ref: '#/components/schemas/CobREncerramento'
    CobREncerramento:
      type: object
      title: Detalhamento do encerramento da cobrança.
      description: Contendo `cancelamento` ou `rejeicao`
      properties:
        cancelamento:
          $ref: '#/components/schemas/CobRCancelamento'
        rejeicao:
          $ref: '#/components/schemas/CobRRejeicao'
    CobRRejeicao:
      type: object
      title: Informações sobre a rejeição da cobrança
      required:
        - codigo
        - descricao
      description: Informações sobre a rejeição da cobrança
      properties:
        codigo:
          type: string
          title: Código da rejeição
          description: >-
            Código da rejeição:<br> - **AB10**: Transação interrompida devido a
            erro no participante do usuário pagador.<br> - **AC05**: Conta
            transacional do usuário pagador encerrada.<br> - **AC06**: Conta
            transacional do usuário pagador bloqueada.<br> - **AG12**: Não é
            permitida solicitação de agendamento (pain.013) cujos recursos sejam
            transferidos de uma  conta transacional para outra em uma mesma
            instituição participante ou entre participantes que utilizem o
            serviço de liquidação de um mesmo participante liquidante no
            SPI.<br> - **AM02**: Valor da cobrança ultrapassa o valor máximo
            estabelecido pelo usuário pagador.<br> - **AM09**: Valor da cobrança
            não corresponde ao valor estabelecido na recorrência.<br> -
            **DENC**: CPF/CNPJ do usuário pagador não corresponde ao dado
            contido na recorrência/autorização.<br> - **DS27**: Participante não
            se encontra cadastrado ou ainda não iniciou a operação no SPI.<br> -
            **DTED**: Divergência entre a data de vencimento informada e a
            periodicidade da recorrência e/ou as regras do produto.<br> -
            **DTNT**: Novas tentativas de agendamento pós vencimento em
            desacordo com o limite de dias definido na  regra de negócio (a
            partir de D+8, considerando D0, a data do vencimento).<br> -
            **FBRD**: Pain.013 recebida fora do prazo para cumprimento das
            regras do negócio.<br> - **IRNT**: Cobrança recorrente não permite
            novas tentativas de agendamento pós vencimento (idRecorrencia  com
            característica que não permite novas tentativas).<br> - **MIDI**:
            idRecorrencia inexistente ou incorreto.<br> - **MSUC**:
            statusRecorrencia diferente de (CFDB - confirmado pelo usuário
            pagador).<br> - **NIEC**: Nova instrução de pagamento inválida pois
            a mesma cobrança já possui ordem de pagamento agendada ainda
            pendente de envio ao SPI para liquidação.<br> - **NIPA**: Nova
            instrução de pagamento inválida, pagamento já foi efetivado.<br> -
            **NITX**: Nova instrução de pagamento não corresponde a uma cobrança
            recorrente gerada anteriormente.<br> (IdConciliacaoDoRecebedor
            diferentes). Utilizada somente para as finalidades de agendamento
            'NTAG' e 'RIFL'.<br> - **QUNT**: Quantidade de novas tentativas de
            agendamento pós vencimento excede o limite definido pela regra de
            negócio (mais de 3 tentativas em intervalo de 7 dias após o
            vencimento, considerando D0, a data do vencimento).<br> - **RC09**:
            ISPB do participante do usuário pagador inválido ou inexistente.<br>
            - **UDEI**: CPF/CNPJ do devedor incorreto.
          maxLength: 4
          enum:
            - AB10
            - AC05
            - AC06
            - AG12
            - AM02
            - AM09
            - DENC
            - DS27
            - DTED
            - DTNT
            - FBRD
            - IRNT
            - MIDI
            - MSUC
            - NIEC
            - NIPA
            - NITX
            - QUNT
            - RC09
            - UDEI
        descricao:
          type: string
          title: Descricao da rejeição
          description: Descricao da causa da rejeição
          maxLength: 105
    CobRCancelamento:
      type: object
      title: Informações sobre o cancelamento da cobrança
      required:
        - solicitante
        - codigo
        - descricao
      description: Informações sobre o cancelamento da cobrança
      properties:
        solicitante:
          type: string
          title: Solicitante do cancelamento
          description: >
            Identifica quem solicitou o cancelamento:

            - `PSP_PAGADOR`: Cancelamento solicitado pelo PSP do pagador

            - `USUARIO_PAGADOR`: Cancelamento solicitado pelo usuário pagador

            - `PSP_RECEBEDOR`: Cancelamento solicitado pelo PSP do recebedor

            - `USUARIO_RECEBEDOR`: Cancelamento solicitado pelo usuário
            recebedor
          enum:
            - PSP_PAGADOR
            - USUARIO_PAGADOR
            - PSP_RECEBEDOR
            - USUARIO_RECEBEDOR
        codigo:
          type: string
          title: Código do cancelamento
          description: >-
            Código do cancelamento. ACCT: Encerramento de uma conta
            transacional. BLCK: Bloqueio de uma conta transacional. CCLD:
            Cancelamento da autorização para pagamentos periódicos. FAIL:
            Cancelamento do agendamento por falha ou erro no fluxo de
            liquidação. OTHR: Cancelamento por outros motivos. SLBD: Solicitado
            pelo usuário pagador. SLCR: Solicitado pelo usuário destinatário.
          maxLength: 4
          enum:
            - ACCT
            - BLCK
            - CCLD
            - FAIL
            - OTHR
            - SLBD
            - SLCR
        descricao:
          type: string
          title: Descricao do cancelamento
          description: Descricao da causa do cancelamento
          maxLength: 105
    CobRTentativas:
      type: object
      title: Histórico de Tentativas da Cobrança Recorrente
      properties:
        tentativas:
          type: array
          title: Histórico de Tentativas de Cobrança
          description: Histórico de Tentativas de Cobrança
          items:
            type: object
            required:
              - dataLiquidacao
              - tipo
              - endToEndId
              - status
              - atualizacao
            properties:
              dataLiquidacao:
                type: string
                format: date
                description: >-
                  Data da liquidação da cobrança. Trata-se de uma data, no
                  formato `YYYY-MM-DD`, segundo ISO 8601.
                example: '2023-04-01T00:00:00.000Z'
              tipo:
                type: string
                title: Tipo da Tentativa
                description: >-
                  AGND - Agendamento do débito original.</br> NTAG - Agendamento
                  de nova tentativa após o vencimento.</br> RIFL - Reenvio da
                  instrução de pagamento devido a erro na liquidação.
                enum:
                  - AGND
                  - NTAG
                  - RIFL
              status:
                type: string
                title: Status da Tentativa
                description: >
                  Status da tentativa da cobrança:

                  - `SOLICITADA`: Cobrança agendada mas não paga até a data de
                  vencimento.

                  - `AGENDADA`: O PSP Pagador recebeu e aceitou a cobrança,
                  agendando o pagamento.

                  - `PAGA`: A cobrança foi paga com sucesso.

                  - `CANCELADA`: A cobrança foi cancelada com sucesso.

                  - `REJEITADA`: A cobrança foi rejeitada pelo PSP Pagador.

                  - `EXPIRADA`: A cobrança não foi liquidada após todas as
                  tentativas de pagamento permitidas.
                enum:
                  - SOLICITADA
                  - AGENDADA
                  - PAGA
                  - CANCELADA
                  - REJEITADA
                  - EXPIRADA
              endToEndId:
                $ref: '#/components/schemas/EndToEndId'
              atualizacao:
                type: array
                title: Histórico de Status da Tentativa
                description: Histórico das mudanças de status da tentativa de cobrança.
                items:
                  type: object
                  required:
                    - status
                    - data
                  properties:
                    status:
                      type: string
                      title: Status da Tentativa
                      description: >
                        Status da tentativa da cobrança:

                        - `SOLICITADA`: Cobrança agendada mas não paga até a
                        data de vencimento.

                        - `AGENDADA`: O PSP Pagador recebeu e aceitou a
                        cobrança, agendando o pagamento.

                        - `PAGA`: A cobrança foi paga com sucesso.

                        - `CANCELADA`: A cobrança foi cancelada com sucesso.

                        - `REJEITADA`: A cobrança foi rejeitada pelo PSP
                        Pagador.

                        - `EXPIRADA`: A cobrança não foi liquidada após todas as
                        tentativas de pagamento permitidas.
                      enum:
                        - SOLICITADA
                        - AGENDADA
                        - PAGA
                        - CANCELADA
                        - REJEITADA
                        - EXPIRADA
                    data:
                      type: string
                      format: date-time
                      description: >-
                        Data e hora do registro de status atualizado. Respeita
                        RFC 3339.
              rejeicao:
                type: object
                title: Informações sobre a rejeição da tentativa da cobrança
                required:
                  - codigo
                  - descricao
                description: Informações sobre a rejeição da tentativa da cobrança
                properties:
                  codigo:
                    type: string
                    title: Código da rejeição da tentativa
                    description: >-
                      Código da rejeição:<br> - **AB10**: Transação interrompida
                      devido a erro no participante do usuário pagador.<br> -
                      **AC05**: Conta transacional do usuário pagador
                      encerrada.<br> - **AC06**: Conta transacional do usuário
                      pagador bloqueada.<br> - **AM02**: Valor da cobrança
                      ultrapassa o valor máximo estabelecido pelo usuário
                      pagador.<br> - **AM09**: Valor da cobrança não corresponde
                      ao valor estabelecido na recorrência.<br> - **DENC**:
                      CPF/CNPJ do usuário pagador não corresponde ao dado
                      contido na recorrência/autorização.<br> - **DS27**:
                      Participante não se encontra cadastrado ou ainda não
                      iniciou a operação no SPI.<br> - **DTED**: Divergência
                      entre a data de vencimento informada e a periodicidade da
                      recorrência e/ou as regras do produto.<br> - **DTNT**:
                      Novas tentativas de agendamento pós vencimento em
                      desacordo com o limite de dias definido na  regra de
                      negócio (a partir de D+8, considerando D0, a data do
                      vencimento).<br> - **FBRD**: Pain.013 recebida fora do
                      prazo para cumprimento das regras do negócio.<br> -
                      **IRNT**: Cobrança recorrente não permite novas tentativas
                      de agendamento pós vencimento (idRecorrencia  com
                      característica que não permite novas tentativas).<br> -
                      **MIDI**: idRecorrencia inexistente ou incorreto.<br> -
                      **MSUC**: statusRecorrencia diferente de (CFDB -
                      confirmado pelo usuário pagador).<br> - **NIEC**: Nova
                      instrução de pagamento inválida pois a mesma cobrança já
                      possui ordem de pagamento agendada ainda pendente de envio
                      ao SPI para liquidação.<br> - **NIPA**: Nova instrução de
                      pagamento inválida, pagamento já foi efetivado.<br> -
                      **NITX**: Nova instrução de pagamento não corresponde a
                      uma cobrança recorrente gerada anteriormente.<br>
                      (IdConciliacaoDoRecebedor diferentes). Utilizada somente
                      para as finalidades de agendamento 'NTAG' e 'RIFL'.<br> -
                      **QUNT**: Quantidade de novas tentativas de agendamento
                      pós vencimento excede o limite definido pela regra de
                      negócio (mais de 3 tentativas em intervalo de 7 dias após
                      o vencimento, considerando D0, a data do vencimento).<br>
                      - **RC09**: ISPB do participante do usuário pagador
                      inválido ou inexistente.<br> - **UDEI**: CPF/CNPJ do
                      devedor incorreto.
                    maxLength: 4
                    enum:
                      - AB10
                      - AC05
                      - AC06
                      - AM02
                      - AM09
                      - DENC
                      - DS27
                      - DTED
                      - DTNT
                      - FBRD
                      - IRNT
                      - MIDI
                      - MSUC
                      - NIEC
                      - NIPA
                      - NITX
                      - QUNT
                      - RC09
                      - UDEI
                  descricao:
                    type: string
                    title: Descrição da rejeição
                    description: Descrição da causa da rejeição
                    maxLength: 105
    CobRRevisada:
      type: object
      title: Cobrança Recorrente Revisada
      description: Dados enviados para revisão da cobrança recorrente via API Pix
      allOf:
        - $ref: '#/components/schemas/CobRStatusRevisada'
    CobRSolicitada:
      type: object
      title: Cobrança Recorrente Solicitada
      required:
        - idRec
        - calendario
        - valor
        - recebedor
      description: Dados enviados para criação da cobrança recorrente via API Pix
      allOf:
        - type: object
          properties:
            idRec:
              $ref: '#/components/schemas/RecId'
        - $ref: '#/components/schemas/CobRBase'
        - $ref: '#/components/schemas/DadosDevedorRecorrencia'
        - type: object
          properties:
            devedor:
              title: Informações sobre o devedor da cobrança recorrente
              description: Contendo `email`, `logradouro`, `cidade`, `uf` e `cep`
    CobRNotification:
      type: object
      title: Cobrança Recorrente Notificada
      required:
        - idRec
        - txid
        - status
        - atualizacao
      description: Dados enviados para criação da cobrança recorrente via API Pix
      allOf:
        - type: object
          properties:
            idRec:
              $ref: '#/components/schemas/RecId'
        - type: object
          properties:
            txid:
              $ref: '#/components/schemas/TxId'
        - $ref: '#/components/schemas/CobRStatus'
        - $ref: '#/components/schemas/CobRAtualizacao'
        - $ref: '#/components/schemas/CobRTentativas'
        - type: object
          properties:
            pix:
              type: array
              title: Pix recebidos
              items:
                allOf:
                  - $ref: '#/components/schemas/PixAutomatico'
                  - type: object
                    properties:
                      txid:
                        allOf:
                          - $ref: '#/components/schemas/TxId'
                          - pattern: '[a-zA-Z0-9]{26,35}'
    CobRConfiguracao:
      type: object
      title: Configuração da Cobrança Recorrente
      required:
        - politicaRetentativa
      properties:
        politicaRetentativa:
          type: string
          title: Política de retentativa da cobrança recorrente
          description: >-
            NAO_PERMITE: Não permite retentativas.</br> PERMITE_3R_7D: Permite
            até 3 retentativas em dias diferentes no intervalo de até 7 dias
            corridos contados a partir da data de liquidação prevista na
            instrução de pagamento original.</br> As retentativas devem ser
            enviadas pelo recebedor. [Consulte a
            documentação](#tag/Cobranca-Recorrente/operation/cobrTxidRetentativaDataPost)
          enum:
            - NAO_PERMITE
            - PERMITE_3R_7D
    CobRStatus:
      type: object
      title: Status da Cobrança Recorrente
      properties:
        status:
          type: string
          title: Status do registro da cobrança
          description: >
            Status da cobrança recorrente:

            - `CRIADA`: A cobrança foi criada pelo usuário recebedor

            - `ATIVA`: O PSP Pagador recebeu e aceitou a cobrança, agendando o
            pagamento

            - `CONCLUIDA`: A cobrança foi paga com sucesso

            - `EXPIRADA`: A cobrança não foi liquidada após todas as tentativas
            de pagamento permitidas

            - `REJEITADA`: A cobrança foi rejeitada pelo PSP Pagador

            - `CANCELADA`: A cobrança foi cancelada com sucesso
          enum:
            - CRIADA
            - ATIVA
            - CONCLUIDA
            - EXPIRADA
            - REJEITADA
            - CANCELADA
    CobRStatusRevisada:
      type: object
      title: Status da Cobrança Recorrente
      properties:
        status:
          type: string
          title: Status do registro da cobrança
          enum:
            - CANCELADA
    CobRBase:
      type: object
      title: Cobrança Recorrente Base
      required:
        - ajusteDiaUtil
      description: Atributos de cobrança recorrente
      properties:
        infoAdicional:
          type: string
          title: Informações adicionais da fatura.
          description: Informações adicionais da fatura.
          maxLength: 140
        calendario:
          $ref: '#/components/schemas/CobRBaseCalendario'
        valor:
          $ref: '#/components/schemas/CobRBaseValor'
        ajusteDiaUtil:
          type: boolean
          title: Ajuste data vencimento para próximo dia útil
          default: true
          description: >-
            Campo de ativação do ajuste da data de vencimento para próximo dia
            útil caso o vencimento corrente seja um dia não útil. O PSP Pagador
            deverá considerar os feriados locais com base no código município do
            usuário pagador.
        recebedor:
          $ref: '#/components/schemas/DadosBancariosRecebedor'
    CobRBaseCalendario:
      type: object
      title: Informações sobre calendário da cobrança
      description: Contendo `dataDeVencimento`
      required:
        - dataDeVencimento
      properties:
        dataDeVencimento:
          type: string
          format: date
          title: Data de vencimento da cobrança
          description: >-
            Trata-se de uma data, no formato `YYYY-MM-DD`, segundo ISO 8601. É a
            data de expiração da cobrança.
          example: '2023-04-01T00:00:00.000Z'
    CobrCalendario:
      type: object
      required:
        - criacao
      allOf:
        - $ref: '#/components/schemas/CobRBaseCalendario'
      description: Contendo `dataDeVencimento` e `criacao`
      properties:
        criacao:
          type: string
          format: date
          title: Data de criação da cobrança
          description: >-
            Trata-se de uma data, no formato `YYYY-MM-DD`, segundo ISO 8601. É a
            data de criação da cobrança.
          example: '2023-04-01T00:00:00.000Z'
    CobRBaseValor:
      type: object
      title: Valor da cobrança recorrente
      required:
        - original
      description: Contendo `valorOriginal`
      properties:
        original:
          type: string
          title: Valor
          pattern: \d{1,10}\.\d{2}
          description: Valor original da cobrança.
    ParametrosConsultaWebhooks:
      type: object
      title: Parâmetros de Consulta de Webhooks
      description: Parâmetros utilizados para a realização de uma consulta de Webhooks.
      properties:
        inicio:
          type: string
          title: Data de Início
          description: Data inicial utilizada na consulta. Respeita RFC 3339.
          example: '2020-01-01T00:00:00Z'
        fim:
          type: string
          title: Data de Fim
          description: Data de fim utilizada na consulta. Respeita RFC 3339.
          example: '2020-12-01T17:00:00Z'
        paginacao:
          $ref: '#/components/schemas/Paginacao'
    WebhooksConsultados:
      type: object
      title: Webhooks Consultados
      required:
        - webhooks
      properties:
        parametros:
          $ref: '#/components/schemas/ParametrosConsultaWebhooks'
        webhooks:
          type: array
          title: Lista de Webhooks consultados
          items:
            allOf:
              - $ref: '#/components/schemas/WebhookCompleto'
    Devedor:
      title: devedor
      type: object
      description: >-
        Não é permitido que o campo devedor.cpf e campo devedor.cnpj estejam
        preenchidos ao mesmo tempo. Se o campo devedor.nome está preenchido,
        então deve existir ou um devedor.cpf ou um campo devedor.cnpj
        preenchido.


        Os campos aninhados sob o objeto devedor são opcionais e identificam a
        pessoa ou a instituição a quem a cobrança está endereçada. Não
        identifica, necessariamente, quem irá efetivamente realizar o pagamento.
      properties:
        pessoaJuridica:
          $ref: '#/components/schemas/PessoaJuridica'
        pessoaFisica:
          $ref: '#/components/schemas/PessoaFisica'
    Paginacao:
      type: object
      title: Paginação
      required:
        - paginaAtual
        - itensPorPagina
        - quantidadeDePaginas
        - quantidadeTotalDeItens
      properties:
        paginaAtual:
          type: integer
          title: Página atual
          description: Número da página recuperada.
          minimum: 0
        itensPorPagina:
          type: integer
          title: Itens por página
          description: Quantidade de registros retornado na página.
          minimum: 1
        quantidadeDePaginas:
          type: integer
          title: Quantidade de páginas
          description: Quantidade de páginas disponíveis para consulta.
          minimum: 1
        quantidadeTotalDeItens:
          type: integer
          title: Quantidade total de itens
          description: >-
            Quantidade total de itens disponíveis de acordo com os parâmetros
            informados.
          minimum: 0
    Violacao:
      type: object
      title: Violações
      properties:
        razao:
          type: string
          title: Descrição do erro
          description: Descrição do erro
          example: Valor da cobrança não pode ser 0.00
        propriedade:
          type: string
          title: Nome da propriedade
          description: Nome da propriedade
          example: cob.chave
        valor:
          type: string
          title: Valor da propriedade
          description: Valor da propriedade
          example: 61996671234
    Problema:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
          format: uri
          description: >-
            URI de referência que identifica o tipo de problema. De acordo com a
            RFC 7807.
          example: https://pix.bcb.gov.br/api/v2/error/NaoEncontrado
        title:
          type: string
          description: Descrição resumida do problema.
          example: Not found
        status:
          type: integer
          description: Código HTTP do status retornado.
          example: 404
        detail:
          type: string
          description: Descrição completa do problema.
        correlationId:
          type: string
          description: Identificador de correlação do problema para fins de suporte
        violacoes:
          type: array
          items:
            $ref: '#/components/schemas/Violacao'
    TermoModel:
      type: object
      properties:
        url:
          type: string
          example: https://bkt-uat-projetos.s3.amazonaws.com/sme/termos/CC038-1.pdf
        data:
          type: string
          format: date-time
          example: '2020-01-01 08:00:00'
    CallbackAttemptPage:
      type: object
      required:
        - data
      properties:
        totalElementos:
          type: integer
          format: int64
          description: >-
            Quantidade total de itens disponíveis de acordo com os parâmetros
            informados
        totalPaginas:
          type: integer
          description: Quantidade total de páginas disponíveis para consulta.
        primeiraPagina:
          description: Informa se é a primeira página
          type: boolean
        ultimaPagina:
          description: Informa se é a última página
          type: boolean
        data:
          description: Dados de cada notificação de callback.
          type: array
          items:
            $ref: '#/components/schemas/CallbackAttemptPageItem'
    CallbackAttemptPageItem:
      type: object
      required:
        - payload
        - numeroTentativa
        - dataEnvio
        - sucesso
      properties:
        webhookUrl:
          type: string
          description: URL do webhook no momento do disparo.
          format: uri
        payload:
          description: Corpo enviado na requisição.
          type: object
        numeroTentativa:
          description: Qual o índice da tentativa de disparo.
          type: integer
        dataHoraDisparo:
          description: Data/hora da tentativa de disparo do callback.
          type: string
          format: date-time
        sucesso:
          type: boolean
          description: Informa se obteve sucesso no disparo do callback.
        httpStatus:
          description: Resposta da chamada ao endpoint do webhook.
          type: integer
        mensagemErro:
          description: Mensagem de erro em caso de falha no disparo do callback.
          type: string
    PagarCobrancaPix:
      type: object
      required:
        - valor
      properties:
        valor:
          type: number
    PagarCobrancaPixResponse:
      type: object
      required:
        - e2e
      properties:
        e2e:
          type: string
    ChangeStatusRec:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - APROVADA
            - CANCELADA
        razao:
          type: string
          enum:
            - ACCL
            - CPCL
            - DCSD
            - ERSL
            - FRUD
            - PCFD
            - SLCR
            - SLDB
            - NRES
          description: >
            Razão para a mudança de status. Valores possíveis:

            - **ACCL**: Cancelamento motivado por encerramento de conta

            - **CPCL**: Cancelamento motivado por encerramento de empresa

            - **DCSD**: Cancelamento motivado por falecimento

            - **ERSL**: Cancelamento solicitado pelo usuário recebedor ou pelo
            seu participante por erro na solicitação de confirmação

            - **FRUD**: Cancelamento motivado por fraude

            - **PCFD**: Cancelamento solicitado pelo PSP recebedor por ausência
            de resposta à pain.009 dentro do prazo regulamentar

            - **SLCR**: Cancelamento solicitado pelo participante do usuário
            recebedor porque a mesma recorrência foi confirmada por meio de
            outra jornada, por exemplo, via QR Code

            - **SLDB**: Cancelamento solicitado pelo usuário recebedor

            - **NRES**: Cancelamento solicitado pelo usuário pagador
    ChangeStatusSolicRec:
      type: object
      required:
        - status
      properties:
        status:
          type: string
          enum:
            - ACEITA
            - REJEITADA
    ChangeStatusCobr:
      type: object
      required:
        - status
        - razao
      properties:
        status:
          type: string
          enum:
            - CANCELADA
        razao:
          type: string
          enum:
            - UNSPECIFIED
            - ACCOUNT_CANCELED
            - ACCOUNT_BLOCKED
            - RECURRENCE_CANCELED
            - SETTLEMENT_FAILED
            - OTHER
            - REQUESTED_BY_PAYER
            - REQUESTED_BY_RECEIVER
          description: |
            Razão para a mudança de status. Valores possíveis:
            - **UNSPECIFIED**: Sem motivo específico fornecido.
            - **ACCOUNT_CANCELED**: Conta cancelada.
            - **ACCOUNT_BLOCKED**: Conta bloqueada.
            - **RECURRENCE_CANCELED**: Recorrência cancelada.
            - **SETTLEMENT_FAILED**: Liquidação falhou.
            - **OTHER**: Outras razões não especificadas.
            - **REQUESTED_BY_PAYER**: Cancelamento solicitado pelo pagador.
            - **REQUESTED_BY_RECEIVER**: Cancelamento solicitado pelo recebedor.
    MakePaymentCobr:
      required:
        - valor
        - cpfCnpj
        - txId
        - chave
      properties:
        valor:
          type: number
          example: 100
        cpfCnpj:
          type: string
          example: 9008007006
        txId:
          type: string
          example: 33beb661beda44a8928fef47dbeb2dc5
        chave:
          type: string
          example: '12345678901'
    MakePaymentCobrResponse:
      required:
        - endToEnd
      properties:
        endToEnd:
          type: string
          example: E00416968202406141552CmNRIqASznP
    MakePaymentCobCobv:
      required:
        - qrCode
        - valor
      properties:
        qrCode:
          type: string
          description: URL do pixCopiaECola.
          example: >-
            000201010200661010014BR.GOV.BCB.PIX2009url-exemplo.qrcode.sandbox.co/pj-s/v2/cob/f5c23856e5694ed48607ab0bd0172496520400005309863540550.005802BR5901*6013BELO
            HORIZONT61089999999962070503***801000014BR.GOV.BCB.PIX2578cdpj-sandbox.partners.uatinter.co/pj-s/v2/rec/60eb10961d744397903cdc376c3ae8a56300288A
        valor:
          type: number
          description: Valor a ser pago.
          example: 100
    MakePaymentCobCobvResponse:
      required:
        - endToEnd
      properties:
        endToEnd:
          type: string
          example: E00416968202406141552CmNRIqASznP
  parameters:
    IdLote:
      name: id
      in: path
      required: true
      schema:
        type: string
        title: >-
          Identificador do lote de cobranças com vencimento, em formato de
          texto.
    xContaCorrente:
      name: x-conta-corrente
      in: header
      description: >-
        Conta corrente que será utilizada na operação. Necessário somente quando
        a aplicação estiver associada a mais de uma conta corrente. Enviar
        apenas números (incluindo o dígito), e não enviar zeros a esquerda.
      schema:
        type: string
        pattern: '[1-9][0-9]*'
    inicio:
      in: query
      name: inicio
      required: true
      x-arch-date-time-pattern: yyyy-MM-dd'T'HH:mm:ss[.SSS]XXX
      example: '2023-02-30T12:09:00Z'
      description: 'Formato: yyyy-MM-dd''T''HH:mm:ss[.SSS]XXX'
      schema:
        type: string
        format: date-time
        title: Data de início
        description: >-
          Filtra os registros cuja data de criação seja maior ou igual que a
          data de início.
    fim:
      in: query
      name: fim
      required: true
      x-arch-date-time-pattern: yyyy-MM-dd'T'HH:mm:ss[.SSS]XXX
      example: '2023-03-30T12:09:00Z'
      description: 'Formato: yyyy-MM-dd''T''HH:mm:ss[.SSS]XXX'
      schema:
        type: string
        format: date-time
        title: Data de fim
        description: >-
          Filtra os registros cuja data de criação seja menor ou igual que a
          data de fim.
    idRecQuery:
      name: idRec
      in: query
      schema:
        type: string
        title: ID Recorrência
        pattern: '[a-zA-Z0-9]{29}'
        minLength: 29
        maxLength: 29
        description: Filtro pelo Identificador da Recorrência.
    cpf:
      name: cpf
      in: query
      schema:
        type: string
        title: CPF
        description: >-
          Filtro pelo CPF do devedor. Não pode ser utilizado ao mesmo tempo que
          o CNPJ.
    cnpj:
      name: cnpj
      in: query
      schema:
        type: string
        title: CNPJ
        description: >-
          Filtro pelo CNPJ do devedor. Não pode ser utilizado ao mesmo tempo que
          o CPF.
    locationPresente:
      name: locationPresente
      in: query
      schema:
        type: boolean
    devolucaoPresente:
      name: devolucaoPresente
      in: query
      schema:
        type: boolean
    txId:
      name: txId
      in: query
      schema:
        type: string
        pattern: '[a-zA-Z0-9]{26,35}'
    txid:
      name: txid
      in: path
      required: true
      description: >-
        O campo txid determina o identificador da transação.


        O txid é criado exclusivamente pelo usuário recebedor e está sob sua
        responsabilidade. O txid, no contexto de representação de uma cobrança,
        é único por CPF/CNPJ do usuário recebedor.
      schema:
        type: string
        pattern: '[a-zA-Z0-9]{26,35}'
    txidQuery:
      name: txid
      in: query
      schema:
        $ref: '#/components/schemas/TxId'
    paginaAtual:
      in: query
      name: paginacao.paginaAtual
      required: false
      schema:
        type: integer
        format: int32
        title: Página atual
        default: 0
        description: >-
          Página a ser retornada pela consulta. Se não for informada, o PSP
          assumirá que será 0.
    itensPorPagina:
      in: query
      name: paginacao.itensPorPagina
      required: false
      schema:
        type: integer
        format: int32
        title: Itens por Página
        maximum: 1000
        default: 100
        description: >-
          Quantidade máxima de registros retornados em cada página. Apenas a
          última página pode conter uma quantidade menor de registros.
    statusRec:
      name: status
      in: query
      schema:
        type: string
        title: Status do registro da recorrência
        description: |
          Filtro pelo status da recorrência:
          - `CRIADA`: Recorrência criada, aguardando aprovação do pagador
          - `APROVADA`: Recorrência aprovada pelo pagador e ativa
          - `REJEITADA`: Recorrência rejeitada pelo pagador
          - `EXPIRADA`: Recorrência expirou sem aprovação
          - `CANCELADA`: Recorrência cancelada pelo recebedor ou pagador
        enum:
          - CRIADA
          - APROVADA
          - REJEITADA
          - EXPIRADA
          - CANCELADA
    statusCobr:
      name: status
      in: query
      schema:
        type: string
        title: Status da Cobrança recorrente
        description: |
          Filtro pelo status da cobrança recorrente
          - `CRIADA`: A cobrança foi criada pelo usuário recebedor
          - `ATIVA`: O PSP Pagador recebeu e aceitou a cobrança,
          agendando o pagamento
          - `CONCLUIDA`: A cobrança foi paga com sucesso
          - `EXPIRADA`: A cobrança não foi liquidada após todas as
          tentativas de pagamento permitidas
          - `REJEITADA`: A cobrança foi rejeitada pelo PSP Pagador
          - `CANCELADA`: A cobrança foi cancelada com sucesso
        enum:
          - CRIADA
          - ATIVA
          - CONCLUIDA
          - EXPIRADA
          - REJEITADA
          - CANCELADA
    idRec:
      name: idRec
      in: path
      required: true
      schema:
        type: string
        title: Id Recorrência
    idSolicRec:
      name: idSolicRec
      in: path
      required: true
      schema:
        type: string
        title: Id da solicitação da recorrência
    idLocRec:
      name: id
      in: path
      required: true
      schema:
        type: string
        title: Id da location cadastrada para servir um payload
    dataLiquidacaoCobr:
      name: data
      in: path
      required: true
      description: >-
        Data prevista para liquidação da ordem de pagamento correspondente.
        Trata-se de uma data, no formato `YYYY-MM-DD`, segundo ISO 8601.
      schema:
        type: string
        format: date
        example: '2023-04-01T00:00:00.000Z'
  responses:
    RequisicaoInvalida:
      description: Problemas na requisição.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Problema'
    NaoEncontrado:
      description: Recurso solicitado não foi encontrado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            exemplo1:
              $ref: '#/components/examples/NaoEncontradoExample1'
    AcessoNegado:
      description: >-
        Requisição de participante autenticado que viola alguma regra de
        autorização.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            exemplo1:
              $ref: '#/components/examples/AcessoNegadoExample1'
    ServicoIndisponivel:
      description: >-
        Serviço não está disponível no momento. Serviço solicitado pode estar em
        manutenção ou fora da janela de funcionamento.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
          examples:
            exemplo1:
              $ref: '#/components/examples/ServicoIndisponivelExample1'
    BadRequest:
      description: Requisição com formato inválido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    NotFound:
      description: Não encontrado.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    PreconditionFailed:
      description: Acesso não permitido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
    InternalError:
      description: Acesso não permitido.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problema'
