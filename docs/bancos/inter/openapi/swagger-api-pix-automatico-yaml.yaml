openapi: 3.0.3
info:
  title: API Pix Automático
  version: ''
  description: >
    A API Pix Automático é a solução que permite o pagamento de uma cobrança

    recorrente, de forma automática, mediante a concessão de uma permissão pelo

    usuário pagador ao usuário recebedor e de uma autorização ao PSP pagador,

    utilizando a infraestrutura do Pix.


    Uma vez concedida a permissão pelo usuário pagador, o usuário recebedor
    enviará

    periodicamente as informações das cobranças recorrentes ao seu PSP,
    utilizando-se

    para isso da API Pix.


    O PSP Recebedor então gerará a instrução de pagamento

    correspondente e a enviará ao PSP Pagador que, por sua vez, realizará o

    agendamento do débito e, posteriormente, sua liquidação na data prevista, de
    forma

    automática, sem a necessidade de qualquer ação do usuário pagador a cada
    nova

    transação.


    ---

    # Tratamento de erros


    A API Pix Automático retorna códigos de status HTTP para indicar sucesso ou
    falhas das requisições.


    Códigos `2xx` indicam sucesso.


    Códigos `4xx` indicam falhas causadas pelas informações enviadas pelo
    cliente ou pelo estado atual das entidades.


    Códigos `5xx` indicam problemas no serviço no lado da API Pix.


    As respostas de erro incluem no corpo detalhes do erro seguindo o _schema_
    da [RFC 7807](https://tools.ietf.org/html/rfc7807).


    O campo `type` identifica o tipo de erro e segue o padrão:
    `https://pix.bcb.gov.br/api/v2/error/<TipoErro>`


    O padrão acima listado, referente ao campo `type`, não consiste,
    necessariamente,

    em uma URL que apresentará uma página web válida, ou um endpoint válido,
    embora possa, futuramente,

    ser exatamente o caso.


    O objetivo primário é apenas e tão somente identificar o tipo de erro.



    ## Erros Gerais


    Esta seção lista os tipos de erro e possíveis violações que podem ser
    retornados pelos endpoints

    listados na API Pix Automático.



    ### `RequisicaoInvalida`

      * __Significado__: Requisição não atende aos requisitos esperados pelo servidor, seja por formatação, dados ausentes ou incorretos.
      * __HTTP Status Code__: [400 Bad Request](https://tools.ietf.org/html/rfc7231#section-6.5.1).

    ### `AcessoNegado`

      * __Significado__: Requisição de participante autenticado que viola alguma regra de autorização.
      * __HTTP Status Code__: [403 Forbidden](https://tools.ietf.org/html/rfc7231#section-6.5.3).

    ### `NaoEncontrado`

      * __Significado__: Entidade não encontrada.
      * __HTTP Status Code__: [404 Not Found](https://tools.ietf.org/html/rfc7231#section-6.5.4).

    ### `PermanentementeRemovido`

      * __Significado__: Indica que a entidade existia, mas foi permanentemente removida.
      * __HTTP Status Code__: [410 Gone](https://tools.ietf.org/html/rfc7231#section-6.5.9).

    ### `ErroInternoDoServidor`

      * __Significado__: Condição inesperada ao processar requisição.
      * __HTTP Status Code__: [500 Internal Server Error](https://tools.ietf.org/html/rfc7231#section-6.6.1).

    ### `ServicoIndisponivel`

      * __Significado__: Serviço não está disponível no momento. Serviço solicitado pode estar em manutenção ou fora da janela de funcionamento.
      * __HTTP Status Code__: [503 Service Unavailable](https://tools.ietf.org/html/rfc7231#section-6.6.4).

    ### `IndisponibilidadePorTempoEsgotado`

      * __Significado__: Indica que o serviço demorou além do esperado para retornar.
      * __HTTP Status Code__: [504 Gateway Timeout](https://tools.ietf.org/html/rfc7231#section-6.6.5).


    ## Tag Recorrência



    Esta seção reúne erros retornados pelos endpoints organizados sob a tag
    `Recorrência`.


    Esses erros indicam problemas no gerenciamento de uma recorrência.


    ### `RecNaoEncontrada`


    * __Significado__: Recorrência não encontrada para o idRec informado.

    * __HTTP Status Code__:
    [404](https://tools.ietf.org/html/rfc7231#section-6.5.4).

    * __endpoints__: `[GET|PATCH] /rec/{idRec}`.


    ### `RecOperacaoInvalida`


    * __Significado__: a requisição que busca alterar ou criar uma recorrência
    não respeita o _schema_ ou está semanticamente errada.

    * __HTTP Status Code__:
    [400](https://tools.ietf.org/html/rfc7231#section-6.5.1).

    * __endpoints__: `[POST] /rec` e `[PATCH] /rec/{idRec}`.


    __Violações__ específicas para o endpoint `POST /rec`:

    - O objeto `rec.vinculo` não respeita o _schema_.

    - O campo `rec.calendario.dataInicial` é anterior à data de criação da
    recorrência.

    - O campo `rec.calendario.dataFinal` é anterior ao campo
    `rec.calendario.dataInicial`.

    - O campo `rec.calendario.periodicidade` não respeita o _schema_.

    - O objeto `rec.valor` não respeita o _schema_.

    - O campo `rec.valor.valorRec` não respeita o _schema_.

    - O campo `rec.valor.valorMinimoRecebedor` não respeita o _schema_.

    - Ambos os campos `rec.valor.valorRec` e `rec.valor.valorMinimoRecebedor`
    estão preenchidos.

    - O objeto `rec.recebedor` não respeita o _schema_.

    - O campo `rec.politicaRetentativa` não respeita o _schema_.

    - O location referenciado por `rec.loc` inexiste.

    - O location referenciado por `rec.loc` já está sendo utilizado por outra
    recorrência.

    - O valor do campo `rec.recebedor.convenio` não é aceito pelo PSP Recebedor.


    __Violações__ específicas para o endpoint `PATCH /rec/{idRec}`:

    - O campo `rec.calendario.dataInicial` é anterior à data de criação da
    recorrência.

    - O location referenciado por `rec.loc` inexiste.

    - O location referenciado por `rec.loc` já está sendo utilizado por outra
    recorrência.

    - O campo `rec.status` não respeita o _schema_.

    - A recorrência encontra-se encerrada.

    - O campo `rec.loc` somente pode ser alterado quando a recorrência
    apresentar-se com o status CRIADA.

    - O campo `rec.calendario.dataInicial` somente pode ser alterado quando a
    recorrência apresentar-se com o status CRIADA.

    - O campo `rec.dadosJornada.txid` não pode ser alterado quando a recorrência
    apresentar-se com o status REJEITADA ou CANCELADA.


    ### `RecConsultaInvalida`


    * __Significado__: Os parâmetros de consulta à lista de recorrências que não
    respeitam o schema ou não fazem sentido semanticamente.

    * __HTTP Status Code__:
    [400](https://tools.ietf.org/html/rfc7231#section-6.5.1).

    * __endpoints__: `[GET] /rec` e `[GET] /rec/{idRec}`.


    __Violações__ específicas para o endpoint `GET /rec`:

    - Algum dos parâmetros informados para a consulta não respeita o _schema_.

    - O _timestamp_ representado pelo parâmetro `fim` é anterior ao timestamp
    representado pelo parâmetro `inicio`.

    - Ambos os parâmetros `cpf` e `cnpj` estão preenchidos.

    - O parâmetro `paginacao.paginaAtual` é negativo.

    - O parâmetro `paginacao.itensPorPagina` é negativo.


    __Violações__ específicas para o endpoint `GET /rec/{idRec}`:

    - O parâmetro `txid` não corresponde a uma cobrança compatível com o campo
    `ativacao.tipoJornada`. (_Exemplo: `txid` correspondente a uma CobV e
    `ativacao.tipoJornada` igual a JORNADA_3._)

    - O parâmetro `txid` corresponde a uma cobrança imediata diferente da
    informada no campo `ativacao.dadosJornada.txid`. Esta violação não ocorre
    caso o parâmetro txid corresponda a uma cobrança com vencimento.


    ## Tag Solicitar Recorrência


    Esta seção reúne erros retornados pelos endpoints organizados sob a tag
    SolicRec.


    Esses erros indicam problemas no gerenciamento de uma solicitação de
    confirmação de recorrência.


    ### `SolicRecNaoEncontrada`


    * __Significado__: Solicitação de recorrência não encontrada para o
    idSolicRec informado.

    * __HTTP Status Code__:
    [404](https://tools.ietf.org/html/rfc7231#section-6.5.4).

    * __Endpoints__: `[GET] /solicrec/{idSolicRec}`.


    ### `SolicRecOperacaoInvalida`


    * __Significado__: a requisição que busca criar ou alterar uma solicitação
    de confirmação de recorrência não respeita o schema ou está semanticamente
    errada.

    * __HTTP Status Code__:
    [400](https://tools.ietf.org/html/rfc7231#section-6.5.1).

    * __Endpoints__: `[POST] /solicrec` e `[PATCH] /solicrec/{idSolicRec}`.


    __Violações__ específicas para o endpoint `POST /solicrec`:

    - O objeto `solicrec.calendario` não respeita o schema.

    - O campo `solicrec.calendario.dataExpiracaoSolicitacao` é anterior à data
    de criação da solicitação da recorrência.

    - O objeto `solicrec.destinatario` não respeita o schema.

    - Existe uma solicitação ativa referente ao mesmo `solicrec.idRec`.


    __Violações__ específicas para o endpoint `PATCH /solicrec/{idSolicRec}`:

    - Não é possível cancelar uma solicitação de recorrência com o status
    diferente de CRIADA, ENVIADA ou RECEBIDA.


    ## Tag Cobrança Recorrente


    Esta seção reúne erros retornados pelos endpoints organizados sob a tag
    CobR.


    Esses erros indicam problemas no gerenciamento de uma cobrança recorrente.


    ### `CobRNaoEncontrado`


    * __Significado__: Cobrança não encontrada para o `txid` informado.

    * __HTTP Status Code__:
    [404](https://tools.ietf.org/html/rfc7231#section-6.5.4).

    * __Endpoints__: `[GET|PATCH] /cobr/{txid}` e `[POST]
    /cobr/{txid}/retentativa/{data}`.


    ### `CobROperacaoInvalida`


    * __Significado__: a requisição que busca alterar ou criar uma cobrança
    recorrente não respeita o schema ou está semanticamente errada.

    * __HTTP Status Code__:
    [400](https://tools.ietf.org/html/rfc7231#section-6.5.1).

    * __Endpoints__: `[POST|PUT|PATCH] /cobr/{txid}` e `[POST]
    /cobr/{txid}/retentativa/{data}`.


    __Violações__ específicas para o endpoint `PUT /cobr/{txid}`:

    - O campo `cobr.infoAdicional` não respeita o schema.

    - O campo `cobr.status` não respeita o schema.

    - O objeto `cobr.calendario` não respeita o schema.

    - O campo `cobr.calendario.dataDeVencimento` é anterior à data de criação da
    cobrança.

    - O campo `cobr.valor` não respeita o schema.

    - O objeto `cobr.recebedor` não respeita o schema.

    - Os campos `cobr.recebedor.conta` e cobr.recebedor.agencia correspondem a
    uma conta que não pertence a este usuário recebedor.

    - O objeto `cobr.devedor` não respeita o schema.

    - O campo `cobr.txid` encontra-se em uso.

    - Existe uma CobR com status diferente de REJEITADA e CANCELADA referente ao
    mesmo `cobr.idRec` com `calendario.dataDeVencimento` no mesmo ciclo.


    __Violações__ específicas para o endpoint `PATCH /cobr/{txid}`:

    - Não é possível cancelar uma cobrança em uma data igual ou maior que a data
    prevista da primeira tentativa de liquidação.


    __Violações__ específicas para o endpoint `POST
    /cobr/{txid}/retentativa/{data}`:

    - Existe uma tentativa com status SOLICITADA ou AGENDADA.

    - Existe uma tentativa em andamento.

    - Existe uma tentativa ativa.

    - Existe uma tentativa não finalizada.

    - Existe uma tentativa vigente para a data informada.

    - O parâmetro data não corresponde a uma data futura.

    - A política configurada na recorrência não permite retentativa de cobrança.


    ### `CobRConsultaInvalida`


    * __Significado__: os parâmetros de consulta à lista de cobranças que não
    respeitam o schema ou não fazem sentido semanticamente.

    * __HTTP Status Code__:
    [400](https://tools.ietf.org/html/rfc7231#section-6.5.1).

    * __endpoints__: `[GET] /cobr` e `[GET] /cobr/{txid}`.


    __Violações__ específicas para o endpoint `GET /cobr`:

    - Algum dos parâmetros informados para a consulta não respeita o schema.

    - O timestamp representado pelo parâmetro `fim` é anterior ao timestamp
    representado pelo parâmetro `inicio`.

    - ambos os parâmetros `cpf` e `cnpj` estão preenchidos.

    - O parâmetro `paginacao.paginaAtual` é negativo.

    - O parâmetro `paginacao.itensPorPagina` é negativo.



    ## Tag Location da Recorrência


    Esta seção reúne erros retornados pelos endpoints organizados sob a tag
    `RecPayload`.


    Estes erros indicam problemas na tentativa de recuperação, via _location_,
    do Payload JSON que representa a recorrência.


    ### `RecPayloadNaoEncontrado`


    * __Significado__: a recorrência em questão não foi encontrada para a
    location requisitada.

    * __HTTP Status Code__:
    [404](https://tools.ietf.org/html/rfc7231#section-6.5.4) ou
    [410](https://tools.ietf.org/html/rfc7231#section-6.5.9).

    * __endpoint__: `GET /rec/{recUrlAccessToken}`.


    Se a presente location exibia uma recorrência, mas não a exibirá mais de
    maneira permanentemente,

    pode-se aplicar o HTTP status code
    [410](https://tools.ietf.org/html/rfc7231#section-6.5.9). Se a presente
    location não

    está exibindo nenhuma recorrência, pode-se utilizar o HTTP status code
    [404](https://tools.ietf.org/html/rfc7231#section-6.5.4).


    Uma recorrência pode estar encerrada, cancelada ou rejeitada, nesses casos,
    é uma liberalidade

    do PSP recebedor retornar o presente código de erro ou optar por servir o
    payload de qualquer maneira,

    objetivando fornecer uma informação adicional ao usuário pagador final a
    respeito da recorrência.


    ### `RecPayloadOperacaoInvalida`


    * __Significado__: a recorrência em questão encontra-se em encerrada,
    rejeitada ou cancelada para a location requisitada.

    * __HTTP Status Code__:
    [400](https://tools.ietf.org/html/rfc7231#section-6.5.1).

    * __endpoint__: `GET /rec/{recUrlAccessToken}`.


    __Violações__ específicas para o endpoint `GET /rec/{recUrlAccessToken}`:

    - O campo `recUrlAccessToken` referencia uma recorrência encerrada,
    rejeitada ou cancelada.


    ## Tag Payload Location da Recorrência


    Esta seção reúne erros referentes a endpoints que tratam do gerenciamento de
    _locations_ de uma recorrência.


    ### `PayloadLocationRecNaoEncontrado`


    * __Significado__: _Location_ não encontrada para o `id` informado.

    * __HTTP Status Code__:
    [404](https://tools.ietf.org/html/rfc7231#section-6.5.4).

    * __endpoints__: `[GET] /locrec/{id}`, `DELETE /locrec/{id}/idRec`.


    ### `PayloadLocationRecConsultaInvalida`


    * __Significado__: os parâmetros de consulta à lista de _locations_ não
    respeitam o _schema_ ou não fazem sentido semanticamente.

    * __HTTP Status Code__:
    [400](https://tools.ietf.org/html/rfc7231#section-6.5.1).

    * __endpoints__: `GET /locrec` e `GET /locrec/{id}`.


    __Violações__ específicas para o endpoint `GET /locrec`:

    - algum dos parâmetros informados para a consulta não respeitam o _schema_.

    - O _timestamp_ representado pelo parâmetro `fim` é anterior ao timestamp
    representado pelo parâmetro `inicio`.

    - O parâmetro `paginacao.paginaAtual` é negativo.

    - O parâmetro `paginacao.itensPorPagina` é negativo.



    ## Tag Webhook de Recorrências


    Reúne erros dos endpoints que tratam do gerenciamento dos Webhooks de
    recorrências da API Pix.


    ### `WebhookRecOperacaoInvalida`


    * __Significado__: a presente requisição busca criar um webhook sem
    respeitar o _schema_ ou, ainda, apresenta semântica inválida.

    * __HTTP Status Code__:
    [400](https://tools.ietf.org/html/rfc7231#section-6.5.1).

    * __endpoints__: `PUT /webhookrec`.


    __Violações__ específicas para o endpoint `PUT /webhookrec`:

    - O campo `webhookUrl` não respeita o _schema_.


    ### `WebhookRecConsultaInvalida`


    * __Significado__: os parâmetros de consulta à lista de webhooks ativados
    não respeitam o schema ou não fazem sentido semanticamente.

    * __HTTP Status Code__:
    [400](https://tools.ietf.org/html/rfc7231#section-6.5.1).

    * __endpoints__: `GET /webhookrec`.


    __Violações__ específicas para o endpoint `GET /webhookrec`:

    - algum dos parâmetros informados para a consulta não respeita o _schema_.

    - O _timestamp_ representado pelo parâmetro `fim` é anterior ao timestamp
    representado pelo parâmetro `inicio`.

    - O parâmetro `paginacao.paginaAtual` é negativo.

    - O parâmetro `paginacao.itensPorPagina` é negativo.


    ## Tag Webhook de Cobranças Recorrentes


    Reúne erros dos endpoints que tratam do gerenciamento dos Webhooks de
    cobranças recorrentes da API Pix.


    ### `WebhookCobROperacaoInvalida`


    * __Significado__: a presente requisição busca criar um webhook sem
    respeitar o _schema_ ou, ainda, apresenta semântica inválida.

    * __HTTP Status Code__:
    [400](https://tools.ietf.org/html/rfc7231#section-6.5.1).

    * __endpoints__: `PUT /webhookcobr`.


    __Violações__ específicas para o endpoint `PUT /webhookcobr`:

    - O campo `webhookUrl` não respeita o _schema_.


    `WebhookCobRConsultaInvalida`


    * __Significado__: os parâmetros de consulta à lista de webhooks ativados
    não respeitam o schema ou não fazem sentido semanticamente.

    * __HTTP Status Code__:
    [400](https://tools.ietf.org/html/rfc7231#section-6.5.1).

    * __endpoints__: `GET /webhookcobr`.


    __Violações__ específicas para o endpoint `GET /webhookcobr`:

    - algum dos parâmetros informados para a consulta não respeita o _schema_.

    - O _timestamp_ representado pelo parâmetro `fim` é anterior ao timestamp
    representado pelo parâmetro `inicio`.

    - O parâmetro `paginacao.paginaAtual` é negativo.

    - O parâmetro `paginacao.itensPorPagina` é negativo.


