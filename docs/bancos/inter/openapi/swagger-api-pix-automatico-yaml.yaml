            vigência pré-definida, devendo ser compatível com os valores
            informados em tipoFrequencia e a dataInicialRecorrencia. Não deve
            ser preenchido para autorizações por tempo indeterminado. Trata-se
            de uma data, no formato `YYYY-MM-DD`, segundo ISO 8601.
          example: '2023-04-01T00:00:00.000Z'
        periodicidade:
          type: string
          title: Periodicidade das cobranças recorrentes.
          enum:
            - SEMANAL
            - MENSAL
            - TRIMESTRAL
            - SEMESTRAL
            - ANUAL
    SolicrecBaseCalendario:
      type: object
      title: Informações de calendário da solicitação da recorrência
      description: Contendo `dataExpiracaoSolicitacao` da solicitação de recorrência.
      required:
        - dataExpiracaoSolicitacao
      properties:
        dataExpiracaoSolicitacao:
          type: string
          format: date-time
          title: Data de expiração da solicitação
          description: Data de expiração da solicitação de recorrência. Respeita RFC 3339.
          example: '2023-04-01T00:00:00.000Z'
    RecCompleta:
      type: object
      title: Recorrência Completa
      required:
        - status
        - recebedor
      description: Atributos de Configuração de Recorrência
      allOf:
        - $ref: '#/components/schemas/RecBase'
        - type: object
          properties:
            idRec:
              $ref: '#/components/schemas/RecId'
        - type: object
          properties:
            recebedor:
              allOf:
                - $ref: '#/components/schemas/PessoaJuridicaRecorrencia'
                - type: object
                  properties:
                    convenio:
                      type: string
                      title: Convênio
                      maxLength: 60
                      description: Filtro pelo convênio associado.
        - $ref: '#/components/schemas/DadosPagadorRec'
        - $ref: '#/components/schemas/RecStatus'
        - $ref: '#/components/schemas/RecConfiguracao'
        - type: object
          properties:
            loc:
              $ref: '#/components/schemas/PayloadLocationRecCompleta'
        - $ref: '#/components/schemas/RecAtualizacao'
        - $ref: '#/components/schemas/RecEncerramento'
        - type: object
          properties:
            solicitacao:
              type: array
              title: Solicitações vinculadas
              description: Solicitações vinculadas às recorrências.
              items:
                $ref: '#/components/schemas/SolicRecCompleta'
        - $ref: '#/components/schemas/RecAtivacao'
        - type: object
          properties:
            dadosQR:
              $ref: '#/components/schemas/DadosQRCode'
    DadosQRCode:
      type: object
      title: Informações do QR Composto.
      description: >
        ##### Informações relacionadas aos parâmetros `idRec` e `txid`
        informados na requisição.

        Ao consultar uma recorrência via endpoint GET
        `/rec/{idRec}?txid={txid}`, o usuário recebedor pode optar pela consulta
        sem

        o `txid` ou por compor a requisição com um `txid` de uma cobrança
        imediata, ou cobrança com vencimento, de forma a obter o QR Composto

        para a jornada de interesse.


        Os `dadosQR` retornados variam de acordo com a jornada desejada,
        indicada pela presença dos parâmetros de interesse, conforme a tabela
        abaixo:

        <table  >

        <tr><td width="15%">idRec</td><td  width="15%">txid de Cob</td><td
        width="15%">txid de CobV</td><td width="100%">Conteúdo
        esperado</td></tr>

        <tr><td>X</td><td>-</td><td>-</td><td><pre>{ jornada: "JORNADA_2",
        pixCopiaECola: "QR Composto da recorrência" }</pre></td></tr>

        <tr><td>X</td><td>X</td><td>-</td><td><pre>{ jornada: "JORNADA_3",
        pixCopiaECola: "QR Composto da cobrança imediata + recorrência"
        }</pre></td></tr>

        <tr><td>X</td><td>-</td><td>X</td><td><pre>{ jornada: "JORNADA_4",
        pixCopiaECola: "QR Composto da cobrança com vencimento + recorrência"
        }</pre></td></tr>

        </table>


        Os campos `dadosQR.jornada` e `dadosQR.pixCopiaECola` só serão
        retornados se as respectivas locations necessárias para a construção do
        QR Composto

        estiverem preenchidas na recorrência e na eventual cobrança, a depender
        da jornada desejada.
      properties:
        jornada:
          type: string
          title: Jornada de ativação
          description: >
            Jornada de ativação da recorrência:

            - `JORNADA_2`: Usuário pagador aceitou a recorrência através de
            leitura de QR Code de recorrência

            - `JORNADA_3`: Usuário pagador iniciou a recorrência através de
            leitura de QR Code composto e pagamento de cobrança imediata

            - `JORNADA_4`: Usuário pagador escolheu aderir à recorrência através
            de leitura de QR Code composto relacionado à cobrança com vencimento
          enum:
            - JORNADA_2
            - JORNADA_3
            - JORNADA_4
        pixCopiaECola:
          type: string
          title: Pix Copia e Cola correspondente à Recorrência.
          description: >-
            Este campo retorna o valor do Pix Copia e Cola correspondente à
            recorrência. Trata-se da sequência de caracteres que representa o BR
            Code.
          maxLength: 512
    RecCompletaPesquisada:
