    # Glossário


    **Usuário pagador:**<br>

    Pessoa física ou jurídica que realiza o pagamento de uma cobrança.


    **Usuário recebedor:**<br>

    Pessoa jurídica que emite as cobranças para o usuário pagador e recebe os
    pagamentos dessas cobranças.


    **PSP Pagador:**<br>

    É o Provedor de Serviços de Pagamento no qual o usuário pagador possui uma
    conta corrente transacional para realizar

    pagamentos.


    **PSP Recebedor:**<br>

    É o Provedor de Serviços de Pagamento. Sua função é conectar uma empresa, um
    cliente e uma instituição financeira para

    validar uma transação no qual o usuário recebedor possui uma conta corrente
    transacional que será usada para realizar

    e/ou receber pagamentos do Pix Automático.


    **Recorrência - Rec:**<br>

    Conjunto de parâmetros com as informações sobre uma recorrência de
    cobranças, como periodicidade, data de início das

    cobranças, identificação do usuário recebedor, valor etc. Essas informações
    da recorrência serão utilizadas para validar

    e permitir o pagamento automático, após autorizado pelo usuário pagador.


    **Cobrança recorrente - Cobr:**<br>

    Conjunto de cobranças periódicas feitas pelo usuário recebedor a um devedor,
    que não precisa ser necessariamente o

    usuário pagador.


    **Solicitação de confirmação de recorrência - Solicrec:**<br>

    Solicitação encaminhada ao usuário pagador para que ele confirme se autoriza
    o seu PSP Pagador a realizar os pagamentos

    recorrentes via Pix Automático. Usada somente na Jornada 1.


    **Autorização:**<br>

    Permissão concedida pelo usuário pagador ao seu PSP Pagador para que este
    possa efetuar débitos em sua conta para pagar

    as cobranças recorrentes.


    **Instruções de pagamento:**<br>

    São informações enviadas pelo usuário recebedor por meio do seu PSP
    Recebedor para que o PSP Pagador possa agendar

    uma transação relativa ao Pix Automático. O envio da instrução de pagamento
    está condicionado a permissão concedida

    pelo usuário pagador.


    **Payload:**<br>

    Refere-se aos dados enviados no corpo de uma solicitação ou resposta HTTP.
    Esses dados são a parte central da comunicação,

    contendo as informações que um cliente envia ao servidor ou que o servidor
    retorna ao cliente.

    O payload pode ser enviado em diferentes formatos, como JSON, XML, ou
    form-data.


    **Location - Loc:**<br>

    É a URL que identifica um QR Code dinâmico ou um Pix Copia e Cola. É como se
    fosse um endereço onde as informações da

    cobrança são armazenadas e podem ser recuperadas.


    **Txid:**<br>

    Cada transação Pix possui um Identificador da Transação, chamado txid, que
    no contexto de representação de uma cobrança,

    é único por CPF/CNPJ da pessoa usuária recebedora. Um txid é uma string
    alfanumérica com comprimentos mínimo de 26 e

    máximo de 35 caracteres.


    ---

    # Jornadas Pix Automático


    Esta seção tem como objetivo auxiliar no entendimento para integração da API
    Pix Automático.<br>

    Para aderir ao Pix Automático, é possível realizar 4 jornadas para
    contratação. Segue abaixo os detalhes para emissão

    do Pix Automático em cada jornada:

       <img src="/media/jornadasPixAutomatico.png">

    ---

    ## Jornada 1

    Usada normalmente quando o usuário pagador aderir a um contrato de serviço
    junto a um estabelecimento físico

    escolhendo o Pix Automático como forma de pagamento.<br>

    Via API do Pix Automático, o usuário recebedor cria a recorrência e solicita
    confirmação da recorrência enviando

    uma notificação ao aplicativo do pagador.<br>


    Exemplos de uso: academias e escolas.<br>


    **Passos para emitir um Pix Automático pela Jornada 1:**<br>


    **1)** Criar a recorrência:


    **Endpoint:** [POST /rec](#tag/Recorrencia/operation/recPost)


    **2)** Criar a solicitação de confirmação da recorrência:<br> Usando o IdRec
    da recorrência gerada no passo 1.


    **Endpoint:** [POST /solicrec
    ](#tag/Solicitar-Recorrencia/operation/postSolicRec)


    **Após a recorrência ter sido autorizada pelo pagador**, você poderá criar e
    gerenciar as cobranças recorrentes associadas á recorrência criada.


    **3)** Criar cobrança recorrente:<br> Cria a cobrança recorrente referente à
    uma recorrência aceita.<br> Essa cobrança será debitada automaticamente na
    data prevista.


    **Endpoints:** [POST/ cobr](#tag/Cobranca-Recorrente/operation/cobrPost) ou
    [PUT/cobr/{txid}](#tag/Cobranca-Recorrente/operation/cobrTxidPut)


    ---

    ## Jornada 2

    Pode ser utilizada por empresas que desejam receber os pagamentos de forma
    recorrente e periódica a partir do mês

    seguinte.<br>

    Para isso, a empresa gera um QR Code ou código Pix Copia e Cola. O usuário
    pagador contrata o serviço ao escanear o QR Code, que contém os dados da
    recorrência, e assim adere ao Pix Automático como método de pagamento.<br>
    Exemplos de uso: Modelos de recorrência de assinatura, como streaming.


    **Passos para emitir um Pix Automático pela Jornada 2:**


    **1)** Criar a location:<br> A location será usada no passo 2 para criar uma
    recorrência com Qr Code.


    **Endpoint:** [POST /locrec
    ](#tag/Location-da-Recorrencia/operation/addLocrec)


    **2)** Criar a recorrência:<br> Incluindo no body de criação o parâmetro
    loc, a location criada no passo 1.


    **Endpoint:** [POST /rec](#tag/Recorrencia/operation/recPost)


    **3)** Consultar a recorrência para gerar o "QrCode":<br> Consultar o IdRec
    da recorrência gerada no passo 2, para obter o Qr Code/Copia e cola.


    **Endpoint:** [GET /rec](#tag/Recorrencia/operation/recIdRecGet)


    **Após o pagador autorizar o QR Code da recorrência**, você poderá criar e
    gerenciar as cobranças recorrentes associadas á recorrência criada.


    **4)** Criar cobrança recorrente:<br> Cria a cobrança recorrente referente à
    uma recorrência aceita.<br> Essa cobrança será debitada automaticamente na
    data prevista.


    **Endpoint:** [POST/ cobr](#tag/Cobranca-Recorrente/operation/cobrPost) ou
    [PUT/cobr/{txid}](#tag/Cobranca-Recorrente/operation/cobrTxidPut)


    ---

    ## Jornada 3


    Pode ser utilizada por empresas que desejam receber os pagamentos de forma
    recorrente e periódica a partir do mês seguinte quando o cliente já possui
    um serviço em andamento e deseja mudar a modalidade dos próximos pagamentos
    para o Pix Automático.


    Exemplos de uso: Contas mensais como conta de água, luz etc.


    A empresa gera um QR Code ou código Pix Copia e Cola, o usuário pagador paga
    a cobrança de forma imediata e também adere ao Pix Automático para  as
    próximas cobranças.


    **Passos para emitir um Pix Automático pela Jornada 3:**<br>


    **1)** Criar a location:<br> A location será usada no passo 3 para criar
    recorrência com Qr Code.<br>


    **Endpoint:** [POST /locrec
    ](#tag/Location-da-Recorrencia/operation/addLocrec)


    **2)** Criar uma cobrança imediata:<br> Cria uma cobrança imediata que será
    usada no passo 3 para criar a recorrência associada a uma cobrança.


    **Endpoint:** [POST
    /cob](https://developers.inter.co/references/pix#tag/Cobranca-Imediata/paths/~1cob/post)
    ou [PUT
    /cob](https://developers.inter.co/references/pix#tag/Cobranca-Imediata/paths/~1cob~1%7Btxid%7D/put)


    **3)** Criar a recorrência:<br> Incluindo no body de criação os parâmetros
    loc e txid, referenciando  a location e a cobrança criadas nos passos 1 e 2.


    **Endpoint:** [POST /rec](#tag/Recorrencia/operation/recPost)


    **4)** Consultar a recorrência para gerar o "QrCode":<br> Consultar a
    recorrência informando o idRec gerado no passo 3, e o txid  gerado no passo
    2. Só assim será gerado um QrCode de Jornada 3.


    **Endpoint:** [GET /rec](#tag/Recorrencia/operation/recIdRecGet)<br>


    **Após o pagador autorizar o QR Code da recorrência**, você poderá criar e
    gerenciar as cobranças recorrentes associadas á recorrência criada.


    **5)** Criar cobrança recorrente:<br> Cria a cobrança recorrente referente à
    uma recorrência aceita.<br> Essa cobrança será debitada automaticamente na
    data prevista.


    **Endpoint:** [POST/ cobr](#tag/Cobranca-Recorrente/operation/cobrPost) ou
        [PUT/cobr/{txid}](#tag/Cobranca-Recorrente/operation/cobrTxidPut)

    ---

    ## Jornada 4


    Pode ser utilizada para empresas que desejam receber os pagamentos de forma
    recorrente e periódica a partir do mês

    seguinte.<br>

    Para isso, a empresa gera um QR Code ou código Pix Copia e Cola. O usuário
    pagador recebe o código e paga ou agenda

    o pagamento da cobrança.

    Posteriormente o pagador poderá decidir se adere ou não ao Pix
    Automático.<br>


    Exemplo de uso: Ao realizar o pagamento de fatura mensal, o cliente poderá
    optar pela adesão ao Pix Automático nas

    próximas cobranças dessa fatura.<br>


    **Passos para emitir um Pix Automático pela Jornada 4:**


    **1)** Criar a location: A location será usada no passo 3 para criar
    recorrência com Qr Code.<br>


    **Endpoint:** [POST
    /locrec](#tag/Location-da-Recorrencia/operation/addLocrec)


    **2)** Criar uma cobrança com vencimento: Cria uma cobrança com vencimento
    que será usada no passo 4 para criar o Qr Code da recorrência.


    **Endpoint:** [PUT
    /cobv](https://developers.inter.co/references/pix#tag/Cobranca-com-Vencimento/paths/~1cobv~1%7Btxid%7D/put)


    **3)** Criar a recorrência:  Incluindo no body de criação o parâmetro loc, a
    location criada no passo 1.


    **Endpoint:** [POST /rec](#tag/Recorrencia/operation/recPost)


    **4)** Consultar a recorrência para gerar o "QrCode":  Consultar a
    recorrência informando o idRec gerado no passo 3, e o txid  gerado no passo
    2. Só assim será gerado um QrCode de Jornada 4.


    **Endpoint:** [GET /rec](#tag/Recorrencia/operation/recIdRecGet)<br>


    **Após o pagador autorizar o QR Code da recorrência**, você poderá criar e
    gerenciar as cobranças recorrentes associadas á recorrência criada.


    **5)** Criar cobrança recorrente:<br> Cria a cobrança recorrente referente à
    uma recorrência aceita.<br> Essa cobrança será debitada automaticamente na
    data prevista.


    **Endpoint:** [POST/ cobr](#tag/Cobranca-Recorrente/operation/cobrPost) ou
        [PUT/cobr/{txid}](#tag/Cobranca-Recorrente/operation/cobrTxidPut)

