    RecPayload:
      type: object
      title: Payload da Recorrência
      required:
        - idRec
        - atualizacao
        - recebedor
      description: >-
        Atributos de Configuração de Recorrência:


        `vinculo`, `calendario`, `valor`, `idRec`, `recebedor`,
