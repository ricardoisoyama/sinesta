  schemas:
    CalendarioCobSolicitada:
      type: object
      title: Expiração
      properties:
        expiracao:
          type: integer
          format: int32
          title: Tempo de vida da cobrança, especificado em segundos.
          description: >
            Tempo de vida da cobrança, especificado em segundos a partir da data
            de criação (Calendario.criacao)
          example: 3600
          default: 86400
          minimum: 1
    Inicio:
      type: string
      format: date-time
      title: Data de início
      description: >-
        Filtra os registros cuja data de criação seja maior ou igual que a data
        de início. Respeita RFC 3339.
    Fim:
      type: string
      format: date-time
      title: Data de fim
      description: >-
        Filtra os registros cuja data de criação seja menor ou igual que a data
        de fim. Respeita RFC 3339.
    TxId:
      type: string
      title: Id da Transação
      description: >
        # Identificador da transação


        O campo txid determina o identificador da transação.

        O objetivo desse campo é ser um elemento que possibilite ao PSP do
        recebedor apresentar ao usuário recebedor a funcionalidade de
        conciliação de pagamentos.


        O txid é criado exclusivamente pelo usuário recebedor e está sob sua
        responsabilidade.

        O txid, no contexto de representação de uma cobrança, é único por
        CPF/CNPJ do usuário recebedor.
      pattern: '[a-zA-Z0-9]{26,35}'
    EndToEndId:
      type: string
      title: Id fim a fim da transação
      description: Id único para identificação do Pix Cobrança.
      pattern: '[a-zA-Z0-9]{32}'
    DevolucaoId:
      type: string
      title: Id da Devolução
      description: Id gerado pelo cliente para representar unicamente uma devolução.
      pattern: '[a-zA-Z0-9]{1,35}'
    PayloadLocationId:
      type: integer
      format: int64
      title: Id da location
      description: Identificador da location a ser informado na criação da cobrança .
    PayloadLocationRecId:
      type: integer
      format: int64
      title: Id da location
      description: Identificador da location a ser informado na criação de uma recorrência.
    PessoaFisica:
      type: object
      required:
        - cpf
        - nome
      title: Pessoa Física
      properties:
        nome:
          type: string
          title: Nome
          description: Nome do usuário.
          maxLength: 200
        cpf:
          type: string
          title: CPF
          pattern: \d{11}
          description: CPF do usuário.
    PessoaJuridica:
      type: object
      required:
        - cnpj
        - nome
      title: Pessoa Jurídica
      properties:
        nome:
          type: string
          title: Nome
          description: Nome do usuário.
          maxLength: 200
        cnpj:
          type: string
          title: CNPJ
          pattern: \d{14}
          description: CNPJ do usuário.
    PessoaFisicaRecorrencia:
      type: object
      required:
        - nome
      title: Pessoa Física
      properties:
        cpf:
          type: string
          title: CPF
          pattern: \d{11}
          description: CPF do usuário.
        nome:
          type: string
          title: Nome
          description: Nome do usuário.
          maxLength: 140
    PessoaJuridicaRecorrencia:
      type: object
      description: Contendo `nome`, `CNPJ` e `convenio` do recebedor.
      required:
        - nome
        - cnpj
      title: Pessoa Jurídica
      properties:
        cnpj:
          type: string
          title: CNPJ
          pattern: \d{14}
          description: CNPJ do usuário.
        nome:
          type: string
          title: Nome
          description: Nome do usuário.
          maxLength: 140
    DevedorRecorrencia:
      type: object
      required:
        - nome
      title: Devedor Recorrencia
      description: O objeto devedor organiza as informações sobre o devedor da recorrência.
      properties:
        nome:
          type: string
          title: Nome
          description: Nome do devedor.
          maxLength: 140
        cpf:
          type: string
          title: CPF
          pattern: \d{11}
          description: CPF do devedor.
        cnpj:
          type: string
          title: CNPJ
          pattern: \d{14}
          description: CNPJ do devedor.
    CPF:
      type: string
      title: CPF
      pattern: \\d{11}
      description: CPF do usuário.
    CNPJ:
      type: string
      title: CNPJ
      pattern: \\d{14}
      description: CNPJ do usuário.
    DadosDevedorRecorrencia:
      type: object
      properties:
        devedor:
          title: Dados do devedor
          description: Contendo `email`, `logradouro`, `cidade`, `uf` e `cep`
          properties:
            email:
              type: string
              title: Email
              description: Email do usuário.
            logradouro:
              type: string
              title: Logradouro
              description: Logradouro do usuário.
              maxLength: 200
            cidade:
              type: string
              title: Cidade
              description: Cidade do usuário.
              maxLength: 200
            uf:
              type: string
              title: UF
              description: UF do usuário.
              maxLength: 2
            cep:
              type: string
              title: CEP
              description: CEP do usuário.
              pattern: '[0-9]{8}'
    DadosBancarios:
      type: object
      description: >-
        Contendo `conta`, `ìspbParticipante`, `agencia`  e `cpf` ou `cnpj` do
        pagador.
      required:
        - conta
        - ispbParticipante
        - cpf
        - cnpj
      properties:
        conta:
          type: string
          title: Conta do Usuário Pagador
          description: Número da conta do usuário pagador.
          maxLength: 20
        ispbParticipante:
          type: string
          title: ISPB do usuário pagador.
          description: ISPB do usuário pagador.
          pattern: \d{8}
        agencia:
          type: string
          title: Agência do Usuário Pagador
          description: Número da agência do usuário pagador.
          maxLength: 4
      oneOf:
        - type: object
          properties:
            cpf:
              $ref: '#/components/schemas/CPF'
        - type: object
          properties:
            cnpj:
              $ref: '#/components/schemas/CNPJ'
    DadosBancariosRecebedor:
      type: object
      title: Dados bancários do recebedor
      description: Contendo `nome`, `cnpj`, `conta`, `tipoConta` e `agencia`
      required:
        - conta
        - tipoConta
      properties:
        conta:
          type: string
          description: Número da conta do usuário recebedor.
          maxLength: 20
        tipoConta:
          type: string
          title: Tipo da conta do usuário recebedor
          description: Tipo da conta do usuário recebedor.
          enum:
            - CORRENTE
            - POUPANCA
            - PAGAMENTO
        agencia:
          type: string
          description: Número da agência do usuário recebedor.
          maxLength: 4
    DadosBancariosRecebedorCompleto:
      type: object
      description: >-
        O objeto recebedor organiza as informações sobre o recebedor da
        cobrança.
      required:
        - conta
        - tipoConta
      allOf:
        - $ref: '#/components/schemas/DadosBancariosRecebedor'
        - $ref: '#/components/schemas/PessoaJuridicaRecorrencia'
    DadosPagadorRec:
      type: object
      title: Dados do Pagador
      required:
        - ispbParticipante
      properties:
        pagador:
          allOf:
            - type: object
              properties:
                ispbParticipante:
                  type: string
                  title: ISPB do PSP pagador.
                  description: >-
                    Código de 8 dígitos que identifica os bancos no sistema do
                    Banco Central.
                  pattern: \d{8}
            - type: object
              properties:
                codMun:
                  title: Código do município
                  description: >
                    Código baseado na Tabela de Códigos de Municípios do
                    __[IBGE](https://www.ibge.gov.br/explica/codigos-dos-municipios.php)__

                    que apresenta a lista dos municípios brasileiros associados
                    a um código composto de 7 dígitos, sendo os dois primeiros
                    referentes ao código da Unidade da Federação.
                  type: string
                  pattern: /^\d{7}$/
          oneOf:
            - type: object
              title: CPF
              required:
                - cpf
              properties:
                cpf:
                  type: string
                  title: CPF
                  pattern: \d{11}
                  description: CPF do usuário.
            - type: object
              required:
                - cnpj
              title: CNPJ
              properties:
                cnpj:
                  type: string
                  title: CNPJ
                  pattern: \d{14}
                  description: CNPJ do usuário.
    PessoaJuridicaCobV:
      type: object
      required:
        - nome
        - cnpj
      title: Pessoa Jurídica
      properties:
        nome:
          type: string
          title: Nome
          description: Nome do usuário.
          maxLength: 200
        cnpj:
          type: string
          title: CNPJ
          pattern: \d{14}
          description: CNPJ do usuário.
        email:
          type: string
          title: Email
          description: Email do usuário.
        logradouro:
          type: string
          title: Logradouro
          description: Logradouro do usuário.
          maxLength: 200
        cidade:
          type: string
          title: Cidade
          description: Cidade do usuário.
          maxLength: 200
        uf:
          type: string
          title: UF
          description: UF do usuário.
          maxLength: 2
        cep:
          type: string
          title: CEP
          description: CEP do usuário.
          pattern: '[0-9]{1,8}'
    DadosComplementaresPessoa:
      type: object
      properties:
        logradouro:
          type: string
          title: Logradouro
          description: Logradouro do usuário.
          maxLength: 200
        cidade:
          type: string
          title: Cidade
          description: Cidade do usuário.
          maxLength: 200
        uf:
          type: string
          title: UF
          description: UF do usuário.
          maxLength: 2
        cep:
          type: string
          title: CEP
          description: CEP do usuário.
          maxLength: 8
    DadosDevedor:
      type: object
      properties:
        devedor:
          description: >-
            Não é permitido que o campo devedor.cpf e campo devedor.cnpj estejam
            preenchidos ao mesmo tempo. Se o campo devedor.nome está preenchido,
            então deve existir ou um devedor.cpf ou um campo devedor.cnpj
            preenchido.


            Os campos aninhados sob o objeto devedor são opcionais e identificam
            a pessoa ou a instituição a quem a cobrança está endereçada. Não
            identifica, necessariamente, quem irá efetivamente realizar o
            pagamento.
          oneOf:
            - $ref: '#/components/schemas/PessoaFisica'
            - $ref: '#/components/schemas/PessoaJuridica'
          allOf:
            - type: object
              properties:
                email:
                  type: string
                  title: email
                  description: email do usuário.
            - $ref: '#/components/schemas/DadosComplementaresPessoa'
    DevedorPixEntity:
      title: Dados do recebedor
      type: object
      properties:
        cpfOrCnpj:
          type: string
          title: 'CPF ou CNPJ '
          description: CPF ou CNPJ do devedor.
        nome:
          type: string
          title: Nome
          description: nome do devedor.
        uf:
          type: string
          title: UF
          description: UF do devedor.
        cep:
          type: string
          title: CEP
          description: CEP do devedor.
        logradouro:
          type: string
          title: Logradouro
          description: Logradouro do devedor.
        cidade:
          type: string
          title: Cidade
          description: Cidade do devedor.
        email:
          type: string
          title: Email
          description: Email do devedor.
    DadosRecebedor:
      type: object
      required:
        - logradouro
        - cidade
        - uf
        - cep
      properties:
        recebedor:
          description: >-
            O objeto recebedor organiza as informações sobre o credor da
            cobrança.
          oneOf:
            - $ref: '#/components/schemas/PessoaFisica'
            - $ref: '#/components/schemas/PessoaJuridica'
            - type: object
              allOf:
                - $ref: '#/components/schemas/PessoaJuridica'
                - type: object
                  properties:
                    nomeFantasia:
                      type: string
                      title: Nome fantasia
                      description: Nome fantasia.
                      maxLength: 200
          allOf:
            - required:
                - logradouro
                - cidade
