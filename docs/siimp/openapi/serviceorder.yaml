openapi: 3.0.3
info:
    version: '2.0'
    title: Ordens de Serviço
    description: |-
        Esta integração documenta todos os endpoints disponíveis para o módulo de **ORDENS DE SERVIÇO**.

        Você deve preencher o campo `subdominio` com o nome do domínio da transportadora providenciado pela equipe da Siimp

        Além disso, selecione o `ambiente` desejado para a API, onde:
        - `lannister` significa **PRODUÇÃO**
        - `dev-lannister` significa **HOMOLOGAÇÃO**

        Caso possua dúvidas sobre a configuração e parametrização de tokens e URLs da API,
        verifique a página principal da documentação em **[API REST](https://siimp.youtrack.cloud/articles/SUP-A-383)**

servers:
    - url: https://{subdominio}.{ambiente}.emitir.me
      variables:
          subdominio:
              default: subdominio_da_transportadora
          ambiente:
              default: lannister
              enum:
                  - 'lannister'
                  - 'dev-lannister'
tags:
    - name: service-orders
      description: Rota para cadastramento, atualização e inserção de ordens de serviço
security:
    - ApiKeyAuth: []
paths:
    # CRUD
    /service-orders/search:
        get:
            tags:
                - 'service-orders'
            description: 'Busca ordens de serviço com base nos filtros informados'
            operationId: 'search'
            parameters:
                - $ref: '#/components/parameters/idParam'
                - $ref: '#/components/parameters/idsParam'
                - $ref: '#/components/parameters/numberParam'
                - $ref: '#/components/parameters/typeParam'
                - $ref: '#/components/parameters/statusParam'
                - $ref: '#/components/parameters/categoryParam'
                - $ref: '#/components/parameters/serviceOrderClassificationNameParam'
                - $ref: '#/components/parameters/responsibleNameParam'
                - $ref: '#/components/parameters/supplierNameParam'
                - $ref: '#/components/parameters/requesterNameParam'
                - $ref: '#/components/parameters/startAtParam'
                - $ref: '#/components/parameters/startFromParam'
                - $ref: '#/components/parameters/startToParam'
                - $ref: '#/components/parameters/finishAtParam'
                - $ref: '#/components/parameters/finishFromParam'
                - $ref: '#/components/parameters/finishToParam'
                - $ref: '#/components/parameters/createdAtParam'
                - $ref: '#/components/parameters/createdFromParam'
                - $ref: '#/components/parameters/createdToParam'
                - $ref: '#/components/parameters/updatedAtParam'
                - $ref: '#/components/parameters/updatedFromParam'
                - $ref: '#/components/parameters/updatedToParam'
                - $ref: '#/components/parameters/pageParam'
            responses:
                '200':
                    $ref: '#/components/responses/SearchSuccess'
    /service-orders/create:
        post:
            tags:
                - 'service-orders'
            description: 'Cria uma ordem de serviço no sistema'
            operationId: 'create'
            requestBody:
                $ref: '#/components/requestBodies/CreateBody'
            responses:
                '200':
                    $ref: '#/components/responses/CreateSuccess'
    /service-orders/update:
        post:
            tags:
                - 'service-orders'
            description: 'Atualiza uma ordem de serviço no sistema'
            operationId: 'update'
            requestBody:
                $ref: '#/components/requestBodies/CreateBody'
            responses:
                '200':
                    $ref: '#/components/responses/UpdateSuccess'
components:
    # SEGURANCA
    securitySchemes:
        ApiKeyAuth:
            type: apiKey
            name: x-api-key
            in: header

    # PARAMETROS
    parameters:
        idParam:
            name: id
            in: query
            description: >
                Realiza a busca pelo **ID** de uma ordem de serviço.
                  *A existência deste parâmetro funciona como um `find` para retorno de um único registro no banco de dados*
            schema:
                type: integer
                minimum: 1
        idsParam:
            name: ids
            in: query
            description: >
                Realiza a busca pelos **IDS** de ordens de serviço, separados por vírgula
            style: form
            explode: false
            schema:
                type: array
                items:
                    type: integer
        numberParam:
            name: number
            in: query
            description: >
                Realiza a busca pelo **NÚMERO** da Ordem de Serviço.
            schema:
                type: integer
        typeParam:
            name: type
            in: query
            description: >
                Realiza a busca pelo **TIPO** da Ordem de Serviço.
                  - `0` = Interna
                  - `1` = Externa
            schema:
                type: integer
                enum:
                    - 0
                    - 1
        statusParam:
            name: status
            in: query
            description: >
                Realiza a busca pelo **STATUS** da Ordem de Serviço.
                  - `0` = Cadastrada
                  - `1` = Emitida
                  - `2` = Finalizado
                  - `3` = Cancelada
            schema:
                type: integer
                enum:
                    - 0
                    - 1
                    - 2
                    - 3
        categoryParam:
            name: category
            in: query
            description: >
                Realiza a busca pelo **CATEGORY** da Ordem de Serviço.
                  - `0` = Veicular
                  - `1` = Patrimonial
                  - `2` = Borracharia
                  - `3` = Outra
            schema:
                type: integer
                enum:
                    - 0
                    - 1
                    - 2
                    - 3
        serviceOrderClassificationNameParam:
            name: service_order_classification_name
            in: query
            description: >
                Realiza a busca pelo **NOME DA CLASSIFICAÇÃO** da Ordem de Serviço.
            schema:
                type: string
        responsibleNameParam:
            name: responsible_name
            in: query
            description: >
                Realiza a busca pelo nome do **RESPONSÁVEL** relacionado à Ordem de Serviço.
            schema:
                type: string
        supplierNameParam:
            name: supplier_name
            in: query
            description: >
                Realiza a busca pelo nome do **FORNECEDOR** relacionado à Ordem de Serviço.
            schema:
                type: string
        requesterNameParam:
            name: requester_name
            in: query
            description: >
                Realiza a busca pelo nome do **SOLICITANTE** relacionado à Ordem de Serviço.
            schema:
                type: string
        startAtParam:
            name: start_at
            in: query
            description: >
                Realiza a busca pela **DATA DE INICIALIZAÇÃO** da Ordem de Serviço.
                  Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        startFromParam:
            name: start_from
            in: query
            description: >
                Realiza a busca pela **DATA INICIAL DE INICIALIZAÇÃO** da Ordem de Serviço.
                  Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        startToParam:
            name: start_to
            in: query
            description: >
                Realiza a busca pela **DATA FINAL DE INICIALIZAÇÃO** da Ordem de Serviço.
                  Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        finishAtParam:
            name: finish_at
            in: query
            description: >
                Realiza a busca pela **DATA DE FINALIZAÇÃO** da Ordem de Serviço.
                  Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        finishFromParam:
            name: finish_from
            in: query
            description: >
                Realiza a busca pela **DATA INICIAL DE FINALIZAÇÃO** da Ordem de Serviço.
                  Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        finishToParam:
            name: finish_to
            in: query
            description: >
                Realiza a busca pela **DATA FINAL DE FINALIZAÇÃO** da Ordem de Serviço.
                  Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        createdAtParam:
            name: created_at
            in: query
            description: >
                Realiza a busca pela **DATA DE CRIAÇÃO** da Ordem de Serviço.
                  Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        createdFromParam:
            name: created_from
            in: query
            description: >
                Realiza a busca pela **DATA INICIAL DE CRIAÇÃO** da Ordem de Serviço.
                  Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        createdToParam:
            name: created_to
            in: query
            description: >
                Realiza a busca pela **DATA FINAL DE CRIAÇÃO** da Ordem de Serviço.
                  Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        updatedAtParam:
            name: updated_at
            in: query
            description: >
                Realiza a busca pela **DATA DE ATUALIZAÇÃO** da Ordem de Serviço.
                  Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        updatedFromParam:
            name: updated_from
            in: query
            description: >
                Realiza a busca pela **DATA INICIAL DE ATUALIZAÇÃO** da Ordem de Serviço.
                  Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        updatedToParam:
            name: updated_to
            in: query
            description: >
                Realiza a busca pela **DATA FINAL DE ATUALIZAÇÃO** da Ordem de Serviço.
                  Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        pageParam:
            name: page
            in: query
            description: >
                Paginação dos resultados
            schema:
                type: integer
                minimum: 1
                default: 1

    # CORPO DE REQUISICOES
    requestBodies:
        CreateBody:
            description: 'Este corpo será utilizado para criação ou atualização de uma Ordem de Serviço'
            required: true
            content:
              application/json:
                  schema:
                      $ref: '#/components/schemas/ServiceOrder'

    # RESPOSTAS
    responses:
        SearchSuccess:
            description: 'Resposta de sucesso, para consultas de Ordens de Serviço'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/SearchResponse'
        CreateSuccess:
            description: 'Resposta de sucesso, para criação de uma Ordem de Serviço'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CreateResponse'
        UpdateSuccess:
            description: 'Resposta de sucesso, para atualização de uma Ordem de Serviço'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/UpdateResponse'

    # OBJETOS
    schemas:
        # RESPONSES
        SearchResponse:
            type: object
            properties:
                data:
                    type: array
                    items:
                        oneOf:
                            - $ref: '#/components/schemas/ServiceOrderSimple'
                            - $ref: '#/components/schemas/ServiceOrderAll'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                total:
                    type: integer
                    example: 90
                    description: 'Quantidade total de resultados'
        CreateResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/ServiceOrderAll'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'Item criado com sucesso'
                    description: 'Mensagem de retorno'
        UpdateResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/ServiceOrder'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'Item editado com sucesso'
                    description: 'Mensagem de retorno'

        # MODELS
        ## MODEL BASE
        ServiceOrderBase:
            type: object
            properties:
                id:
                    type: integer
                    example: 2
                    description: 'ID *(somente informá-lo em caso de atualização de dados)*.'
                owner_id:
                    type: integer
                    example: 192734
                    description: 'Código da Empresa emissora da Ordem de Serviço.'
                number:
                    type: integer
                    readOnly: true
                    example: 123
                    description: 'Número da Ordem de Serviço, sequencial por empresa emissora.'
                type:
                    type: integer
                    example: 1
                    default: 0
                    description: >
                        Tipo da Ordem de Serviço:
                          - `0` = Interna
                          - `1` = Externa
                status:
                    type: integer
                    readOnly: true
                    example: 0
                    default: 0
                    description: >
                        Status da Ordem de Serviço:
                          - `0` = Interna
                          - `1` = Externa
                category:
                    type: integer
                    example: 3
                    description: >
                        Categoria da Ordem de Serviço:
                          - `0` = Veicular
                          - `1` = Patrimonial
                          - `2` = Borracharia
                          - `3` = Outra
                total:
                    type: number
                    readOnly: true
                    example: '800.00'
                    description: 'Soma dos valores de itens e produtos da Ordem de Serviço.'
                obs:
                    type: string
                    nullable: true
                    example: 'Observações Gerais'
                    description: 'Observações gerais da Ordem de Serviço.'
                created_at:
                    type: string
                    format: 'Y-m-d H:i:s'
                    readOnly: true
                    example: '2022-12-27 18:58:09'
                    description: 'Data de criação da Ordem de Serviço.'
                updated_at:
                    type: string
                    format: 'Y-m-d H:i:s'
                    readOnly: true
                    example: '2022-12-27 18:58:09'
                    description: 'Data de criação da Ordem de Serviço.'
                prevision_start_at:
                    type: string
                    format: 'Y-m-d H:i:s'
                    nullable: true
                    example: '2022-12-27 18:58:09'
                    description: 'Data de previsão para inicialização da Ordem de Serviço.'
                prevision_finish_at:
                    type: string
                    format: 'Y-m-d H:i:s'
                    nullable: true
                    example: '2022-12-27 18:58:09'
                    description: 'Data de previsão para finalização da Ordem de Serviço.'

        ## MODEL PARA CRIAÇÃO E ATUALIZAÇÃO
        ServiceOrder:
            allOf:
                - $ref: '#/components/schemas/ServiceOrderBase'
                - type: object
                  properties:
                      classification:
                          type: object
                          description: 'Classificação da Ordem de Serviço.'
                          properties:
                              id:
                                  type: integer
                                  example: 3
                                  description: 'ID da Classificação da Ordem de Serviço'
                              name:
                                  type: string
                                  example: 'MANUTENÇÃO PREVENTIVA'
                                  description: 'Nome da Classificação da Ordem de Serviço'
                      responsible:
                          type: object
                          nullable: true
                          description: 'Responsável da Ordem de Serviço.'
                          properties:
                              id:
                                  type: integer
                                  example: 4524
                                  description: 'ID do Responsável da Ordem de Serviço'
                              cpf:
                                  type: string
                                  example: '45612368514'
                                  description: 'CPF do Responsável da Ordem de Serviço'
                              cnpj:
                                  type: string
                                  example: '52148629000188'
                                  description: 'CNPJ do Responsável da Ordem de Serviço'
                      supplier:
                          type: object
                          nullable: true
                          description: 'Fornecedor da Ordem de Serviço.'
                          properties:
                              id:
                                  type: integer
                                  example: 3
                                  description: 'ID do Fornecedor da Ordem de Serviço'
                              cpf:
                                  type: string
                                  example: '45612368514'
                                  description: 'CPF do Fornecedor da Ordem de Serviço'
                              cnpj:
                                  type: string
                                  example: '52148629000188'
                                  description: 'CNPJ do Fornecedor da Ordem de Serviço'
                      requester:
                          type: object
                          nullable: true
                          description: 'Solicitante da Ordem de Serviço.'
                          properties:
                              id:
                                  type: integer
                                  example: 3
                                  description: 'ID do Solicitante da Ordem de Serviço'
                              cpf:
                                  type: string
                                  example: '45612368514'
                                  description: 'CPF do Solicitante da Ordem de Serviço'
                              cnpj:
                                  type: string
                                  example: '52148629000188'
                                  description: 'CNPJ do Solicitante da Ordem de Serviço'
                      object:
                          oneOf:
                              -   type: object
                                  nullable: true
                                  description: 'Veículo atrelado à Ordem de Serviço.'
                                  properties:
                                      vehicle:
                                          type: object
                                          properties:
                                              id:
                                                  type: integer
                                                  example: 8152
                                                  description: 'ID do veículo atrelado à Ordem de Serviço'
                                              license_plate:
                                                  type: string
                                                  example: AMD0X12
                                                  description: 'Placa do Veículo atrelado à Ordem de Serviço.'
                                              km:
                                                  type: integer
                                                  example: 8152
                                                  description: 'KM do Veículo, no momento da criação da Ordem de Serviço.'
                              -   type: object
                                  nullable: true
                                  description: 'Pneu atrelado à Ordem de Serviço.'
                                  properties:
                                      tire:
                                          type: object
                                          properties:
                                              id:
                                                  type: integer
                                                  example: 91783
                                                  description: 'ID do Pneu atrelado à Ordem de Serviço'
                                              fire_mark:
                                                  type: string
                                                  example: 'ABC3123'
                                                  description: 'Marca de Fogo do Pneu atrelado à Ordem de Serviço'

        ## MODEL RETORNADA NA PESQUISA DE VARIOS ITEMS
        ServiceOrderSimple:
            allOf:
                - $ref: '#/components/schemas/ServiceOrderBase'
                - type: object
                  properties:
                      release_date:
                          type: string
                          format: 'Y-m-d'
                          nullable: true
                          example: '2022-12-27'
                          default: 'Se não for informado, será a mesma data que `finish_at`.'
                          description: 'Data de Liberação da Ordem de Serviço.'
                      classification:
                          type: object
                          description: 'Classificação da Ordem de Serviço.'
                          properties:
                              id:
                                  type: integer
                                  example: 3
                                  description: 'ID da Classificação da Ordem de Serviço'
                              name:
                                  type: string
                                  example: 'MANUTENÇÃO PREVENTIVA'
                                  description: 'Nome da Classificação da Ordem de Serviço'
                      responsible:
                          type: object
                          nullable: true
                          description: 'Responsável da Ordem de Serviço.'
                          properties:
                              id:
                                  type: integer
                                  example: 3
                                  description: 'ID do Responsável da Ordem de Serviço'
                              name:
                                  type: string
                                  example: 'MANUTENÇÃO PREVENTIVA'
                                  description: 'Nome do Responsável da Ordem de Serviço'
                      supplier:
                          type: object
                          nullable: true
                          description: 'Fornecedor da Ordem de Serviço.'
                          properties:
                              id:
                                  type: integer
                                  example: 3
                                  description: 'ID do Fornecedor da Ordem de Serviço'
                              name:
                                  type: string
                                  example: 'MANUTENÇÃO PREVENTIVA'
                                  description: 'Nome do Fornecedor da Ordem de Serviço'
                      requester:
                          type: object
                          nullable: true
                          description: 'Solicitante da Ordem de Serviço.'
                          properties:
                              id:
                                  type: integer
                                  example: 3
                                  description: 'ID do Solicitante da Ordem de Serviço'
                              name:
                                  type: string
                                  example: 'MANUTENÇÃO PREVENTIVA'
                                  description: 'Nome do Solicitante da Ordem de Serviço'
                      object:
                          oneOf:
                              -   type: object
                                  nullable: true
                                  description: 'Veículo atrelado à Ordem de Serviço.'
                                  properties:
                                      vehicle:
                                          type: object
                                          properties:
                                              id:
                                                  type: integer
                                                  example: 8152
                                                  description: 'ID do veículo atrelado à Ordem de Serviço'
                                              license_plate:
                                                  type: string
                                                  example: AMD0X12
                                                  description: 'Placa do Veículo atrelado à Ordem de Serviço.'
                                              km:
                                                  type: integer
                                                  example: 8152
                                                  description: 'KM do Veículo, no momento da criação da Ordem de Serviço.'
                              -   type: object
                                  nullable: true
                                  description: 'Pneu atrelado à Ordem de Serviço.'
                                  properties:
                                      tire:
                                          type: object
                                          properties:
                                              id:
                                                  type: integer
                                                  example: 91783
                                                  description: 'ID do Pneu atrelado à Ordem de Serviço'
                                              fire_mark:
                                                  type: string
                                                  example: 'ABC3123'
                                                  description: 'Marca de Fogo do Pneu atrelado à Ordem de Serviço'

        ## MODEL RETORNADA NA PESQUISA DE SOMENTE 1 ITEMS
        ServiceOrderAll:
            allOf:
                - $ref: '#/components/schemas/ServiceOrder'
                - type: object
                  properties:
                      histories:
                          type: array
                          description: 'Histórico da Ordem de Serviço.'
                          readOnly: true
                          items:
                              type: object
                              properties:
                                  id:
                                      type: integer
                                      example: 1
                                      description: 'ID do vinculo do histórico.'
                                  message:
                                      type: string
                                      example: 'Ordem de Serviço EMITIDA'
                                      description: 'Mensagem do Histórico da Ordem de Serviço'
                      services:
                          type: array
                          description: 'Serviços da Ordem de Serviço.'
                          readOnly: true
                          items:
                              type: object
                              description: 'Serviço associado à Ordem de Serviço.'
                              properties:
                                  id:
                                      type: integer
                                      example: 8546
                                      description: 'ID do vinculo do serviço.'
                                  quantity:
                                      type: number
                                      example: 1
                                      description: 'Quantidade do Serviço da Ordem de Serviço.'
                                  value:
                                      type: number
                                      example: '30.00'
                                      description: 'Valor Unitário do Serviço da Ordem de Serviço.'
                                  total:
                                      type: number
                                      example: '30.00'
                                      description: 'Total do Serviço da Ordem de Serviço.'
                                  obs:
                                      type: string
                                      example: 'INSTALACAO DE CAMERA DE AR'
                                      description: 'Observação do Serviço da Ordem de Serviço.'
                                  service:
                                    type: object
                                    description: 'Informaçoes do Serviço relacionado à ordem de Serviço'
                                    properties:
                                        id:
                                            type: integer
                                            example: 89
                                            description: 'ID do Serviço.'
                                        name:
                                            type: string
                                            example: 'INSTALACAO DE CAMERA DE AR'
                                            description: 'Nome do Serviço.'
                      products:
                          type: array
                          description: 'Produtos da Ordem de Serviço.'
                          readOnly: true
                          items:
                              type: object
                              description: 'Produto associado à Ordem de Serviço.'
                              properties:
                                  id:
                                      type: integer
                                      example: 9546
                                      description: 'ID do vinculo do produto.'
                                  quantity:
                                      type: number
                                      example: 2
