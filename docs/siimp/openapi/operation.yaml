openapi: 3.0.3
info:
    version: '2.0'
    title: Operações
    description: |-
        Esta integração documenta todos os endpoints disponíveis para o módulo de **OPERAÇÕES**.

        Você deve preencher o campo `subdominio` com o nome do domínio da transportadora providenciado pela equipe da Siimp

        Além disso, selecione o `ambiente` desejado para a API, onde:
        - `lannister` significa **PRODUÇÃO**
        - `dev-lannister` significa **HOMOLOGAÇÃO**

        Caso possua dúvidas sobre a configuração e parametrização de tokens e URLs da API,
        verifique a página principal da documentação em **[API REST](https://siimp.youtrack.cloud/articles/SUP-A-383)**
servers:
    - url: https://{subdominio}.{ambiente}.emitir.me
      variables:
          subdominio:
              default: subdominio_da_transportadora
          ambiente:
              default: lannister
              enum:
                  - 'lannister'
                  - 'dev-lannister'
tags:
    - name: operations
      description: Rota para cadastramento, atualização e inserção de operações de transporte
paths:
    /operations/search:
        get:
            tags:
                - operations
            description: Busca operações com base nos filtros informados
            operationId: search
            parameters:
                - name: id
                  in: query
                  description: >
                      Realiza a busca pelo **ID** de uma operação.

                      *A existência deste parâmetro funciona como um `find` para retorno de um único registro no banco de dados. Algumas informações de listagem somente serão exibidas se este parâmetro estiver preenchido*
                  required: false
                  schema:
                      type: integer
                      minimum: 1

                - name: ids
                  in: query
                  description: Realiza a busca pelos **IDS** de operações, separados por vírgula
                  required: false
                  style: form
                  explode: false
                  schema:
                      type: array
                      items:
                          type: integer

                - name: name
                  in: query
                  description: Realiza a busca pelo **NOME** da operação, podendo ser parcial.
                  required: false
                  schema:
                      type: string

                - name: created_at
                  in: query
                  description: Data de criação. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
                  schema:
                      type: string
                      format: 'Y-m-d|relative'

                - name: created_from
                  in: query
                  description: Data de criação inicial. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
                  schema:
                      type: string
                      format: 'Y-m-d|relative'

                - name: created_to
                  in: query
                  description: Data de criação final. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
                  schema:
                      type: string
                      format: 'Y-m-d|relative'

                - name: updated_at
                  in: query
                  description: Data da última atualização. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
                  schema:
                      type: string
                      format: 'Y-m-d|relative'

                - name: updated_from
                  in: query
                  description: Data da última atualização inicial. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
                  schema:
                      type: string
                      format: 'Y-m-d|relative'

                - name: updated_to
                  in: query
                  description: Data da última atualização final. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
                  schema:
                      type: string
                      format: 'Y-m-d|relative'

                - name: page
                  in: query
                  description: Paginação dos resultados
                  required: false
                  schema:
                      type: integer
                      minimum: 1
                      default: 1

            responses:
                '200':
                    description: Sucesso
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SearchResponse'
    /operations/create:
        post:
            tags:
                - operations
            description: Cria uma operação no sistema
            operationId: create
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OperationModel'
                required: true
            responses:
                '200':
                    description: Sucesso
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateResponse'
    /operations/update:
        post:
            tags:
                - operations
            description: Atualiza uma operação no sistema
            operationId: update
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/OperationModel'
                required: true
            responses:
                '200':
                    description: Sucesso
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateResponse'
    /operations/delete:
        post:
            tags:
                - operations
            description: Remove uma operação
            operationId: delete
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DeleteRequest'
                required: true
            responses:
                '200':
                    description: Sucesso
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteResponse'
components:
    securitySchemes:
        x-api-key:
            type: apiKey
            name: x-api-key
            in: header
    schemas:

        # REQUESTS
        DeleteRequest:
            type: object
            properties:
                id:
                    type: integer
                    example: '123456'
                    description: 'ID da operação'

        # RESPONSES
        SearchResponse:
            type: object
            properties:
                data:
                    type: array
                    items:
                        oneOf:
                            - $ref: '#/components/schemas/SimpleOperationModel'
                            - $ref: '#/components/schemas/OperationModel'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                total:
                    type: integer
                    example: 90
                    description: 'Quantidade total de resultados'
        CreateResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/OperationModel'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'Item criado com sucesso'
                    description: 'Mensagem de retorno'
        UpdateResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/OperationModel'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'Item editado com sucesso'
                    description: 'Mensagem de retorno'
        DeleteResponse:
            type: object
            properties:
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'Item removido com sucesso'
                    description: 'Mensagem de retorno'

        # MODELS
        SimpleOperationModel:
            type: object
            properties:
                id:
                    type: integer
                    example: 2
                    description: 'ID *(somente informá-lo em caso de atualização de dados)*'
                owner_id:
                    type: integer
                    example: 192734
                    nullable: true
                    description: 'Código da empresa transportadora da operação. Para que a operação possa ser utilizada por todas as transportadoras do grupo, informar `null`.'
                name:
                    type: string
                    maxLength: 200
                    example: 'CARGA EXPRESSA'
                    description: 'Nome da operação'
                xml_feature:
                    type: string
                    nullable: true
                    example: 'op'
                    maxLength: 15
                    description: 'Descrição fiscal da operação, impressa na tag `xCaracAd` do CT-e'
                conemb_code:
                    type: string
                    nullable: true
                    example: 'C'
                    maxLength: 1
                    minLength: 1
                    description: 'Código da operação, impressa na exportação do arquivo CONEMB'
        OperationModel:
            allOf:
                - $ref: '#/components/schemas/SimpleOperationModel'
                - type: object
                  properties:
                      ncms:
                          type: array
                          description: >
                              Lista de NCMs utilizados em notas fiscais que mapeiam para esta operação.


                              Somente será exibida no `/search` se o parâmetro `id` for informado.


                              Esta array é **[TOGGLEABLE](https://siimp.youtrack.cloud/articles/SUP-A-383#toggleable-arrays)**. Veja mais detalhes na documentação para entender o seu funcionamento.
                          items:
                              type: object
                              properties:
                                  from:
                                      type: integer
                                      example: 1111111
                                      description: 'NCM Inicial'
                                  to:
                                      type: integer
                                      example: 222222
                                      description: 'NCM Final'
                                  description:
                                      type: string
                                      maxLength: 255
                                      example: 'Intervalo de NCMs'
                                      description: 'Descrição do intervalo de NCMs'
                      cfops:
                          type: array
                          description: >
                              Lista de CFOPs utilizados em notas fiscais que mapeiam para esta operação.


                              Somente será exibida no `/search` se o parâmetro `id` for informado.


                              Esta array é **[TOGGLEABLE](https://siimp.youtrack.cloud/articles/SUP-A-383#toggleable-arrays)**. Veja mais detalhes na documentação para entender o seu funcionamento.
                          items:
                              type: object
                              properties:
                                  from:
                                      type: integer
                                      example: 5352
                                      description: 'CFOP Inicial'
                                  to:
                                      type: integer
                                      example: 5360
                                      description: 'CFOP Final'
                                  description:
                                      type: string
                                      maxLength: 255
                                      example: 'Intervalo de CFOPs'
                                      description: 'Descrição do intervalo de CFOPs'
