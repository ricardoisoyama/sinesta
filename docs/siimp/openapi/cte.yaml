                                        type: string
                                        minLength: 44
                                        maxLength: 44
                                        pattern: '[A-Z0-9]'
                                        example: '35221243256171000199550010002713451756413099'
                                        description: 'Chave da Nota Fiscal *(informar este ou o campo ID)*'
