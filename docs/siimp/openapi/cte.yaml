                            type: object
                            nullable: true
                            description: 'Veículos atrelados ao CT-e.'
                            properties:
                                traction:
                                    type: object
                                    description: 'Veículo de tração atrelada ao CT-e. *(informar este ou o campo ID)*'
                                    properties:
                                        license_plate:
                                            type: string
                                            example: 'AMD0X12'
                                            minLength: 7
                                            maxLength: 7
                                            description: 'Placa do Veículo de tração atrelado ao CT-e.'
                                trailer1:
                                    type: object
                                    description: 'Reboque 1 do Veículo atrelado ao CT-e. *(informar este ou o campo ID)*'
                                    properties:
                                        license_plate:
                                            type: string
                                            example: 'BMD0X12'
                                            minLength: 7
                                            maxLength: 7
                                            description: 'Placa do Reboque 1 do Veículo atrelado ao CT-e.'
                                trailer2:
                                    type: object
                                    description: 'Reboque 2 do Veículo atrelado ao CT-e. *(informar este ou o campo ID)*'
                                    properties:
                                        license_plate:
                                            type: string
                                            example: 'CMD0X12'
                                            minLength: 7
                                            maxLength: 7
                                            description: 'Placa do Reboque 2 do Veículo atrelado ao CT-e.'
                                trailer3:
                                    type: object
                                    description: 'Reboque 3 do Veículo atrelado ao CT-e. *(informar este ou o campo ID)*'
                                    properties:
                                        license_plate:
                                            type: string
