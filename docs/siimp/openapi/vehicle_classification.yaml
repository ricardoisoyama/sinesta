openapi: 3.0.3
info:
    version: '2.0'
    title: 'Classificações de Veículos'
    description: |-
        Esta integração documenta todos os endpoints disponíveis para o módulo de **Classificações de Veículos**.

        Você deve preencher o campo `subdominio` com o nome do domínio da transportadora providenciado pela equipe da Siimp.

        Além disso, selecione o `ambiente` desejado para a API, onde:
        - `lannister` significa **PRODUÇÃO**
        - `dev-lannister` significa **HOMOLOGAÇÃO**

        Caso possua dúvidas sobre a configuração e parametrização de tokens e URLs da API, verifique a página principal da documentação em **[API REST](https://siimp.youtrack.cloud/articles/SUP-A-383)**
servers:
    - url: https://{subdominio}.{ambiente}.emitir.me
      variables:
          subdominio:
              default: subdominio_da_transportadora
          ambiente:
              default: lannister
              enum:
                  - 'lannister'
                  - 'dev-lannister'
tags:
    - name: vehicle-classifications
      description: Rota para gerenciamento das classificações de veículos.
security:
    - x-api-key: []
paths:
    /vehicle-classifications/search:
        get:
            tags:
                - vehicle-classifications
            description: Busca as classificações de veículos com base nos filtros informados
            operationId: search
            parameters:
                - name: id
                  in: query
                  description: >
                      Realiza a busca pelo **ID** de uma classificação. *A existência deste parâmetro funciona como um `find` para retorno de um único registro no banco de dados*
                  required: false
                  schema:
                      type: integer
                      minimum: 1

                - name: ids
                  in: query
                  description: Realiza a busca pelos **IDS** das classificações, separados por vírgula
                  required: false
                  style: form
                  explode: false
                  schema:
                      type: array
                      items:
                          type: integer

                - name: name
                  in: query
                  description: Realiza a busca pelo **NOME** da classificação.
                  required: false
                  schema:
                      type: string

                - name: license_plate
                  in: query
                  description: Realiza a busca pela **PLACA DO VEÍCULO** vinculado à classificação.
                  required: false
                  schema:
                      type: string

            responses:
                '200':
                    description: Sucesso
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SearchResponse'
    /vehicle-classifications/create:
        post:
            tags:
                - vehicle-classifications
            description: Cria uma classificação de veículo em **Classificações**
            operationId: create
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/VehicleClassificationModel'
                required: true
            responses:
                '200':
                    description: Sucesso
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateResponse'
    /vehicle-classifications/update:
        post:
            tags:
                - vehicle-classifications
            description: Atualiza uma classificação de veículo em **Classificações**
            operationId: update
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/VehicleClassificationModel'
                required: true
            responses:
                '200':
                    description: Sucesso
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateResponse'
    /vehicle-classifications/delete:
        post:
            tags:
                - vehicle-classifications
            description: Remove uma classificação de veículo em **Classificações**
            operationId: delete
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DeleteRequest'
                required: true
            responses:
                '200':
                    description: Sucesso
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteResponse'

components:
    securitySchemes:
        x-api-key:
            type: apiKey
            name: x-api-key
            in: header
    schemas:

        # REQUESTS
        DeleteRequest:
            type: object
            properties:
                id:
                    type: integer
                    example: '123456'
                    description: 'ID da classificação'

        # RESPONSES
        SearchResponse:
            type: object
            properties:
                data:
                    type: array
                    items:
                        $ref: '#/components/schemas/VehicleClassificationModel'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                total:
                    type: integer
                    example: 1
                    description: 'Quantidade total de resultados'
        CreateResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/VehicleClassificationModel'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'Item criado com sucesso'
                    description: 'Mensagem de retorno'
        UpdateResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/VehicleClassificationModel'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'Item editado com sucesso'
                    description: 'Mensagem de retorno'
        DeleteResponse:
            type: object
            properties:
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'Item removido com sucesso'
                    description: 'Mensagem de retorno'

        # MODELS
        VehicleClassificationModel:
            type: object
            properties:
                id:
                    type: integer
                    example: 2
                    nullable: false
                    description: 'ID *(somente informá-lo em caso de atualização de dados)*'
                name:
                    type: string
                    example: 'TOCO REFRIGERADO'
                    nullable: false
                    description: 'Nome da classificação'
                created_at:
                    type: string
                    format: 'Y-m-d H:i:s'
                    readOnly: true
                    example: '2022-11-30 10:45:31'
                    description: 'Data de criação da classificação'
                updated_at:
                    type: string
                    format: 'Y-m-d H:i:s'
                    readOnly: true
                    example: '2022-11-30 10:45:31'
                    description: 'Data de atualização da classificação.'
                vehicles:
                    type: array
                    description: 'Armazena os veículos que serão vinculados com a classificação, podendo ser informado **ID** ou **PLACA DO VEÍCULO**'
                    items:
                        type: object
                        properties:
                            id:
                                type: integer
                                example: 23123
                                description: 'ID do veículo'
                            license_plate:
                                type: string
                                minLength: 7
                                maxLength: 7
                                example: 'ABC1234'
                                description: 'Placa do veículo'
