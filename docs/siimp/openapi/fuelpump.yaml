openapi: 3.0.3
info:
    version: '2.0'
    title: Bombas
    description: |-
        Esta integração documenta todos os endpoints disponíveis para o módulo de **Bombas**.

        Você deve preencher o campo `subdominio` com o nome do domínio da transportadora providenciado pela equipe da Siimp

        Além disso, selecione o `ambiente` desejado para a API, onde:
        - `lannister` significa **PRODUÇÃO**
        - `dev-lannister` significa **HOMOLOGAÇÃO**

        Caso possua dúvidas sobre a configuração e parametrização de tokens e URLs da API,
        verifique a página principal da documentação em **[API REST](https://siimp.youtrack.cloud/articles/SUP-A-383)**

servers:
    - url: https://{subdominio}.{ambiente}.emitir.me
      variables:
          subdominio:
              default: subdominio_da_transportadora
          ambiente:
              default: lannister
              enum:
                  - 'lannister'
                  - 'dev-lannister'
tags:
    - name: fuel-pumps
      description: Rota para gerenciamento de Bomba de combustível
security:
    - ApiKeyAuth: []
paths:

    # GET
    /fuel-pumps/search:
        get:
            tags:
                - 'fuel-pumps'
            description: Busca bombas com base nos filtros informados
            operationId: 'search'
            parameters:
                -   $ref: '#/components/parameters/idParam'
                -   $ref: '#/components/parameters/idsParam'
                -   $ref: '#/components/parameters/ownerIdParam'
                -   $ref: '#/components/parameters/fuelTankParam'
                -   $ref: '#/components/parameters/descriptionParam'
            responses:
                '200':
                    $ref: '#/components/responses/SearchSuccess'

    # GET
    /fuel-pumps/get-histories:
        get:
            tags:
                - 'fuel-pumps'
            description: Busca os lançamentos de encerrantes/históricos das bombas com base na bomba e no tipo de histórico informado
            operationId: 'get-histories'
            parameters:
                -   $ref: '#/components/parameters/idGetHistoriesParam'
                -   $ref: '#/components/parameters/typeGetHistoriesParam'
            responses:
                '200':
                    $ref: '#/components/responses/GetHistorieSuccess'

    # POST
    /fuel-pumps/create:
        post:
            tags:
                - 'fuel-pumps'
            description: 'Cria uma bomba no sistema'
            operationId: 'create'
            requestBody:
                $ref: '#/components/requestBodies/CreateBody'
            responses:
                '200':
                    $ref: '#/components/responses/CreateSuccess'

    # POST
    /fuel-pumps/update:
        post:
            tags:
                - 'fuel-pumps'
            description: 'Atualiza uma bomba no sistema'
            operationId: 'update'
            requestBody:
                $ref: '#/components/requestBodies/CreateBody'
            responses:
                '200':
                    $ref: '#/components/responses/UpdateSuccess'

    # POST
    /fuel-pumps/delete:
        post:
            tags:
                - 'fuel-pumps'
            description: 'Deleta uma bomba no sistema'
            operationId: 'delete'
            requestBody:
                $ref: '#/components/requestBodies/DeleteBody'
            responses:
                '200':
                    $ref: '#/components/responses/DeleteSuccess'

    # POST
    /fuel-pumps/create-fuel-pump-stock-output:
        post:
            tags:
                - 'fuel-pumps'
            description: 'Cria um encerrante na bomba'
            operationId: 'create-stock-output'
            requestBody:
                $ref: '#/components/requestBodies/CreateStockOutputBody'
            responses:
                '200':
                    $ref: '#/components/responses/CreateStockOutputSuccess'

    # POST
    /fuel-pumps/remove-fuel-pump-stock-output:
        post:
            tags:
                - 'fuel-pumps'
            description: 'Remove um encerrante da bomba'
            operationId: 'remove-stock-output'
            requestBody:
                $ref: '#/components/requestBodies/RemoveStockOutputBody'
            responses:
                '200':
                    $ref: '#/components/responses/RemoveStockOutputSuccess'

components:

    # SEGURANCA
    securitySchemes:
        ApiKeyAuth:
            type: apiKey
            name: x-api-key
            in: header

    # PARAMETROS
    parameters:
        idParam:
            name: id
            in: query
            description: >
                Realiza a busca pelo **ID** de uma bomba
                  *A existência deste parâmetro funciona como um `find` para retorno de um único registro no banco de dados*
            schema:
                type: integer
                minimum: 1
        idsParam:
            name: ids
            in: query
            description: >
                Realiza a busca pelos **IDS** de bombas, separados por vírgula
            style: form
            explode: false
            schema:
                type: array
                items:
                    type: integer
        ownerIdParam:
            name: owner_id
            in: query
            description: >
                Realiza a busca pelo **CÓDIGO DA EMPRESA**
            schema:
                type: integer
        fuelTankParam:
            name: fuel_tank
            in: query
            description: >
                Realiza a busca da bomba pelo **ID DO TANQUE VINCULADO**
            schema:
                type: integer
        descriptionParam:
            name: description
            in: query
            description: >
                Realiza a busca pela **DESCRIÇÃO DA BOMBA**
            schema:
                type: string
        idGetHistoriesParam:
            name: id
            in: query
            description: >
                Informe o **ID** de uma bomba para buscar seu histórico
            schema:
                type: integer
                minimum: 1
        typeGetHistoriesParam:
            name: type
            in: query
            description: >
                Realiza a busca pelo **HISTÓRICO** desejado
                 - `fuel_stock_outputs` = Lançamento de Encerrantes
                 - `histories` = Histórico Geral
            schema:
                type: string
                enum:
                    - fuel_stock_outputs
                    - histories

    # CORPO DE REQUISICOES
    requestBodies:
        CreateBody:
            description: 'Este corpo será utilizado para criação ou atualização de uma bomba'
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/FuelPumpBase'
        DeleteBody:
            description: 'Este corpo será utilizado para exclusão de uma bomba'
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/DeleteRequest'
        CreateStockOutputBody:
            description: 'Este corpo será utilizado para a criação de um encerrante na bomba'
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CreateStockOutputRequest'
        RemoveStockOutputBody:
            description: 'Este corpo será utilizado para a remoção de um encerrante na bomba'
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/RemoveStockOutputRequest'

    # RESPOSTAS
    responses:
        SearchSuccess:
            description: 'Resposta de sucesso, para consultas das bombas'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/SearchResponse'
        GetHistorieSuccess:
            description: 'Resposta de sucesso, para consultas dos históricos da bomba'
            content:
                application/json:
                    schema:
                        oneOf:
                            -   $ref: '#/components/schemas/GetFuelStockOutputResponse'
                            -   $ref: '#/components/schemas/GetHistorieResponse'
        CreateSuccess:
            description: 'Resposta de sucesso, para criação de uma bomba'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CreateResponse'
        UpdateSuccess:
            description: 'Resposta de sucesso, para atualização de uma bomba'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/UpdateResponse'
        DeleteSuccess:
            description: 'Resposta de sucesso, para exclusão de uma bomba'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/DeleteResponse'
        CreateStockOutputSuccess:
            description: 'Resposta de sucesso, para criação de um encerrante na bomba'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CreateStockOutputResponse'
        RemoveStockOutputSuccess:
            description: 'Resposta de sucesso, para remoção de um encerrante na bomba'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/RemoveStockOutputResponse'

    # OBJETOS
    schemas:

        # REQUESTS
        DeleteRequest:
            type: object
            properties:
                id:
                    type: integer
                    example: 4
                    description: 'ID da bomba'
        CreateStockOutputRequest:
            type: object
            properties:
                id:
                    type: integer
                    example: 4
                    description: 'ID da bomba'
                current_value:
                    type: number
                    example: '1000.222'
                    description: 'Encerrante atual'
        RemoveStockOutputRequest:
            type: object
            properties:
                id:
                    type: integer
                    example: 4
                    description: 'ID da bomba'
                fuel_stock_output_id:
                    type: integer
                    example: 30
                    description: 'ID do encerrante'

        # RESPONSES
        SearchResponse:
            type: object
            properties:
                data:
                    type: array
                    items:
                        oneOf:
                            -   $ref: '#/components/schemas/FuelPumpBase'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                total:
                    type: integer
                    example: 90
                    description: 'Quantidade total de resultados'
        GetFuelStockOutputResponse:
            type: object
            properties:
                data:
                    type: array
                    items:
                        oneOf:
                            -   $ref: '#/components/schemas/FuelStockOutputModel'
                message:
                    type: string
                    example: 'Histórico carregado com sucesso!'
                    description: 'Mensagem de retorno'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                total:
                    type: integer
                    example: 1
                    description: 'Quantidade total de resultados'
        GetHistorieResponse:
            type: object
            properties:
                data:
                    type: array
                    items:
                        oneOf:
                            -   $ref: '#/components/schemas/HistorieModel'
                message:
                    type: string
                    example: 'Histórico carregado com sucesso!'
                    description: 'Mensagem de retorno'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                total:
                    type: integer
                    example: 1
                    description: 'Quantidade total de resultados'
        CreateResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/FuelPumpBase'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação.'
                message:
                    type: string
                    example: 'Item criado com sucesso'
                    description: 'Mensagem de retorno'
        UpdateResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/FuelPumpBase'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'Item editado com sucesso'
                    description: 'Mensagem de retorno'
        DeleteResponse:
            type: object
            properties:
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'Item excluído com sucesso!'
                    description: 'Mensagem de retorno'
        CreateStockOutputResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/FuelPumpBase'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'Lançamento de encerrante criado com sucesso!'
                    description: 'Mensagem de retorno'
        RemoveStockOutputResponse:
            type: object
            properties:
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'Lançamento de encerrante removido com sucesso!'
                    description: 'Mensagem de retorno'

        # MODELS
        ## MODEL BASE
        FuelPumpBase:
            type: object
            properties:
                id:
                    type: integer
                    example: 4
                    description: 'ID. *(somente informá-lo em caso de atualização de dados)*'
                owner_id:
                    type: integer
                    example: 23123
                    description: 'Empresa da bomba'
                description:
                    type: string
                    example: 'Bomba 1'
                    description: 'Nome de identificação da bomba'
                created_at:
                    type: string
                    format: 'Y-m-d H:i:s'
                    example: '2023-09-15 08:17:53'
                    description: 'Data de criação'
                    readOnly: true
                updated_at:
                    type: string
                    format: 'Y-m-d H:i:s'
                    example: '2023-09-15 08:17:53'
                    description: 'Data de atualização'
                    readOnly: true
                unit_value:
                    type: number
                    example: 2
                    description: 'Valor unitário do combustível'
                type:
                    type: integer
                    example: 3
                    description: 'Tipo do combustível'
                    readOnly: true
                fuel_tank_id:
                    type: integer
                    example: 2
                    description: 'Tanque vinculado a bomba'
                initial_fuel_dispenser_meter:
                    type: number
                    example: '0.000'
                    nullable: true
                    description: 'Encerrante inicial da bomba'
                integration:
                    nullable: true
                    description: 'Integração da bomba'
                    type: object
                    properties:
                        id:
                            type: integer
                            example: 6
                            nullable: true
                            description: 'ID da integração'
                        code:
                            type: string
                            example: '23123'
                            nullable: true
                            description: 'Código da bomba na integração'
        FuelStockOutputModel:
            properties:
                id:
                    type: integer
                    example: 30
                    description: 'ID do lançamento de encerrante'
                    readOnly: true
                fuel_pump_id:
                    type: integer
                    example: 4
                    description: 'ID da bomba'
                    readOnly: true
                fuel_tank_id:
                    type: integer
                    example: 2
                    description: 'ID do tanque'
                    readOnly: true
                current_value:
                    type: number
                    example: '1000.222'
                    description: 'Valor do encerrante atual'
                    readOnly: true
                previous_value:
                    type: number
                    example: '0.000'
                    description: 'Valor do encerrante anterior'
                    readOnly: true
                total:
                    type: number
                    example: '1000.222'
                    description: 'Valor total da saída'
                    readOnly: true
                username:
                    type: string
                    example: 'gilbertoreais'
                    description: 'Usuário que realizou a criação'
                    readOnly: true
                created_at:
                    type: string
                    format: 'Y-m-d H:i:s'
                    example: '2023-09-15 08:17:53'
                    description: 'Data de criação'
                    readOnly: true
                updated_at:
                    type: string
                    format: 'Y-m-d H:i:s'
                    example: '2023-09-15 08:17:53'
                    description: 'Data de atualização'
                    readOnly: true
        HistorieModel:
            type: object
            properties:
                id:
                    type: integer
                    example: 22
                    description: 'ID do histórico'
                    readOnly: true
                fuel_pump_id:
                    type: integer
                    example: 4
                    description: 'ID da bomba'
                    readOnly: true
                username:
                    type: string
                    example: 'gilbertoreais'
                    description: 'Usuário que realizou a ação'
                    readOnly: true
                message:
                    type: string
                    example: 'O lançamento de encerrante com o valor de 1.000,222 foi removido com sucesso!'
                    description: 'Mensagem do histórico'
                    readOnly: true
                created_at:
                    type: string
                    format: 'Y-m-d H:i:s'
                    example: '2023-09-15 08:17:53'
                    description: 'Data de criação'
                    readOnly: true
                updated_at:
                    type: string
                    format: 'Y-m-d H:i:s'
                    example: '2023-09-15 08:17:53'
                    description: 'Data de atualização'
                    readOnly: true
