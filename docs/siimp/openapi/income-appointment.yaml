openapi: 3.0.3
info:
    version: '1.0'
    title: Minutas de Agendamento
    description: |-
        Esta integração documenta todos os endpoints disponíveis para o módulo de **MINUTAS DE AGENDAMENTO**.

        Você deve preencher o campo `subdominio` com o nome do domínio da transportadora providenciado pela equipe da Siimp

        Além disso, selecione o `ambiente` desejado para a API, onde:
        - `lannister` significa **PRODUÇÃO**
        - `dev-lannister` significa **HOMOLOGAÇÃO**

        Caso possua dúvidas sobre a configuração e parametrização de tokens e URLs da API,
        verifique a página principal da documentação em **[API REST](https://siimp.youtrack.cloud/articles/SUP-A-383/API-REST)**
servers:
    -   url: https://{subdominio}.{ambiente}.emitir.me
        variables:
            subdominio:
                default: subdominio_da_transportadora
            ambiente:
                default: lannister
                enum:
                    - 'lannister'
                    - 'dev-lannister'
tags:
    -   name: income-appointments
        description: 'Rota para gerenciamento de minutas de agendamento.'
security:
    -   ApiKeyAuth: [ ]
paths:

    # GET
    /income-appointments/search:
        get:
            tags:
                - 'income-appointments'
            summary: 'Busca uma minuta de agendamento no sistema'
            description: 'Busca uma minuta de agendamento no sistema'
            operationId: search
            parameters:
                -   $ref: '#/components/parameters/idParam'
                -   $ref: '#/components/parameters/idsParam'
                -   $ref: '#/components/parameters/ownerIdParam'
                -   $ref: '#/components/parameters/filterAnyNameParam'
                -   $ref: '#/components/parameters/filterNumberParam'
                -   $ref: '#/components/parameters/filterNumberNfParam'
                -   $ref: '#/components/parameters/filterStatusParam'
                -   $ref: '#/components/parameters/appointmentTypeIdParam'
                -   $ref: '#/components/parameters/filterMineParam'
                -   $ref: '#/components/parameters/numberInvoiceParam'
                -   $ref: '#/components/parameters/numberNfseParam'
                -   $ref: '#/components/parameters/licensePlateParam'
                -   $ref: '#/components/parameters/filterDriverParam'
                -   $ref: '#/components/parameters/containerIdParam'
                -   $ref: '#/components/parameters/containerNumberParam'
                -   $ref: '#/components/parameters/filterRequestorParam'
                -   $ref: '#/components/parameters/filterWithdrawalParam'
                -   $ref: '#/components/parameters/filterReceiverParam'
                -   $ref: '#/components/parameters/appointmentTypeCategoryParam'
                -   $ref: '#/components/parameters/referenceParam'
                -   $ref: '#/components/parameters/localParam'
                -   $ref: '#/components/parameters/isRedexParam'
                -   $ref: '#/components/parameters/hasInvoiceParam'
                -   $ref: '#/components/parameters/operationIdParam'
                -   $ref: '#/components/parameters/reserveNumberParam'
                -   $ref: '#/components/parameters/shipNameParam'
                -   $ref: '#/components/parameters/createdParam'
                -   $ref: '#/components/parameters/createdFromParam'
                -   $ref: '#/components/parameters/createdToParam'
                -   $ref: '#/components/parameters/updatedParam'
                -   $ref: '#/components/parameters/updatedFromParam'
                -   $ref: '#/components/parameters/updatedToParam'
                -   $ref: '#/components/parameters/scheduledAtFromParam'
                -   $ref: '#/components/parameters/scheduledAtToParam'
                -   $ref: '#/components/parameters/confirmedAtFromParam'
                -   $ref: '#/components/parameters/confirmedAtToParam'
                -   $ref: '#/components/parameters/startedAtFromParam'
                -   $ref: '#/components/parameters/startedAtToParam'
                -   $ref: '#/components/parameters/finishedAtFromParam'
                -   $ref: '#/components/parameters/finishedAtToParam'
                -   $ref: '#/components/parameters/productMaturityFromParam'
                -   $ref: '#/components/parameters/productMaturityToParam'
                -   $ref: '#/components/parameters/pageParam'
            responses:
                '200':
                    $ref: '#/components/responses/SearchSuccess'

    # POST
    /income-appointments/create:
        post:
            tags:
                - 'income-appointments'
            summary: 'Cria uma minuta de agendamento no sistema'
            description: 'Cria uma minuta de agendamento no sistema'
            operationId: 'create'
            requestBody:
                $ref: '#/components/requestBodies/CreateBody'
            responses:
                '200':
                    $ref: '#/components/responses/CreateSuccess'

    /income-appointments/update:
        post:
            tags:
                - 'income-appointments'
            summary: 'Atualiza uma minuta de agendamento no sistema'
            description: 'Atualiza uma minuta de agendamento no sistema'
            operationId: 'update'
            requestBody:
                $ref: '#/components/requestBodies/UpdateBody'
            responses:
                '200':
                    $ref: '#/components/responses/UpdateSuccess'

    /income-appointments/action:
        post:
            tags:
                - 'income-appointments'
            summary: 'Executa uma ação no agendamento (confirmar, iniciar ou finalizar)'
            description: 'Altera o status de uma minuta de agendamento no sistema.'
            operationId: 'action'
            requestBody:
                $ref: '#/components/requestBodies/ActionBody'
            responses:
                '200':
                    $ref: '#/components/responses/ActionSuccess'

    /income-appointments/cancel:
        post:
            tags:
                - 'income-appointments'
            summary: 'Cancela uma minuta de agendamento no sistema'
            description: 'Realiza o cancelamento de uma minuta de agendamento mediante justificativa.'
            operationId: 'cancel'
            requestBody:
                $ref: '#/components/requestBodies/CancelBody'
            responses:
                '200':
                    $ref: '#/components/responses/CancelSuccess'

    /income-appointments/no-show:
        post:
            tags:
                - 'income-appointments'
            summary: 'Registra No Show para uma minuta de agendamento'
            description: 'Registra a ausência/não comparecimento (No-Show) do agendamento no sistema.'
            operationId: 'noshow'
            requestBody:
                $ref: '#/components/requestBodies/NoShowBody'
            responses:
                '200':
                    $ref: '#/components/responses/NoShowSuccess'

components:

    # SEGURANÇA
    securitySchemes:
        ApiKeyAuth:
            type: apiKey
            name: x-api-key
            in: header

    # PARÂMETROS
    parameters:
        idParam:
            name: id
            in: query
            description: >
                Realiza a busca pelo **ID** de uma minuta de agendamento.

                *A existência deste parâmetro funciona como um `find` para retorno de um único registro no banco de dados*
            schema:
                type: integer
                minimum: 1
        idsParam:
            name: ids
            in: query
            description: >
                Realiza a busca pelos **IDS** das minutas de agendamento, separados por vírgula.
            style: form
            explode: false
            schema:
                type: array
                items:
                    type: integer
        ownerIdParam:
            name: owner_id
            in: query
            description: Realiza a busca pela **EMPRESA** da minuta de agendamento.
            schema:
                type: integer
                minimum: 1
        filterAnyNameParam:
            name: any_name
            in: query
            description: Realiza a busca pelo **NOME, CPF E/OU CNPJ DO SOLICITANTE E/OU TOMADOR** vinculado à uma minuta de agendamento. Em caso de pesquisa pelo nome, pode ser parcial.
            schema:
                type: string
        filterNumberParam:
            name: number
            in: query
            description: Realiza a busca pelo **NÚMERO** da minuta de agendamento.
            schema:
                type: string
        filterNumberNfParam:
            name: number_nf
            in: query
            description: Realiza a busca pelo **NÚMERO DA NOTA** inserida em uma minuta de agendamento.
            schema:
                type: string
        filterStatusParam:
            name: status
            in: query
            description: >
                Realiza a busca pelo **STATUS** da minuta de agendamento.
                  - `0` = Agendada
                  - `3` = Confirmada
                  - `5` = No Show
                  - `6` = Cancelada
                  - `9` = Em Execução
                  - `10` = Finalizada
            required: false
            schema:
                enum:
                    - 0
                    - 3
                    - 5
                    - 6
                    - 9
                    - 10
        appointmentTypeIdParam:
            name: appointment_type_id
            in: query
            description: Realiza a busca pelo **TIPO** da minuta de agendamento.
            schema:
                type: integer
                minimum: 1
        filterMineParam:
            name: mine
            in: query
            description: >
                Realiza a busca apenas pelas minutas de agendamento **CRIADAS PELO USUÁRIO DA REQUISIÇÃO**:
                  - `false` = Não
                  - `true` = Sim
            schema:
                type: string
                enum:
                    - false
                    - true
        numberInvoiceParam:
            name: number_invoice
            in: query
            description: Realiza a busca pela **FATURA** vinculada à minuta de agendamento.
            schema:
                type: string
        numberNfseParam:
            name: number_nfse
            in: query
            description: Realiza a busca pela **NFS-e** vinculada à minuta de agendamento.
            schema:
                type: string
        licensePlateParam:
            name: license_plate
            in: query
            description: Realiza a busca pela **TRAÇÃO E/OU REBOQUE** vinculada à uma minuta de agendamento.
            schema:
                type: string
        filterDriverParam:
            name: driver
            in: query
            description: Realiza a busca pelo **NOME E/OU CPF DO MOTORISTA E/OU AUXILIAR** vinculado à uma minuta de agendamento. Em caso de pesquisa pelo nome, pode ser parcial.
            schema:
                type: string
        containerIdParam:
            name: container_id
            in: query
            description: Realiza a busca pelo **TIPO DE CONTAINER** vinculado à uma minuta de agendamento.
            schema:
                type: integer
                minimum: 1
        containerNumberParam:
            name: container_number
            in: query
            description: Realiza a busca pelo **NÚMERO DO CONTAINER** vinculado à uma minuta de agendamento.
            schema:
                type: string
        filterRequestorParam:
            name: requestor
            in: query
            description: Realiza a busca pelo **NOME, CPF E/OU CNPJ DO SOLICITANTE** vinculado à uma minuta de agendamento. Em caso de pesquisa pelo nome, pode ser parcial.
            schema:
                type: string
        filterWithdrawalParam:
            name: withdrawal
            in: query
            description: Realiza a busca pelo **NOME, CPF E/OU CNPJ DO TOMADOR** vinculado à uma minuta de agendamento. Em caso de pesquisa pelo nome, pode ser parcial.
            schema:
                type: string
        filterReceiverParam:
            name: receiver
            in: query
            description: Realiza a busca pelo **NOME, CPF E/OU CNPJ DO TRANSPORTADOR** vinculado à uma minuta de agendamento. Em caso de pesquisa pelo nome, pode ser parcial.
            schema:
                type: string
        appointmentTypeCategoryParam:
            name: appointment_type_category
            in: query
            description: >
                Realiza a busca pela **CATEGORIA** do tipo de agendamento:
                  - `0` = Depósito de Container Cheio
                  - `1` = Depósito de Container Vazio
                  - `2` = Depósito de Carga Solta
                  - `3` = Retirada de Container Cheio
                  - `4` = Retirada de Container Vazio
                  - `5` = Retirada de Carga Solta
                  - `6` = Execução de Serviço
                  - `7` = Transferência entre Terminais
            schema:
                type: integer
                enum:
                    - 0
                    - 1
                    - 2
                    - 3
                    - 4
                    - 5
                    - 6
                    - 7
        referenceParam:
            name: reference
            in: query
            description: Realiza a busca pela **REFERÊNCIA** da minuta de agendamento.
            schema:
                type: string
        localParam:
            name: local
            in: query
            description: Realiza a busca pela **LOCALIZAÇÃO** da minuta de agendamento.
            schema:
                type: string
        isRedexParam:
            name: is_redex
            in: query
            description: >
                Realiza a busca por minutas de agendamento **REDEX**.
                  - `0` = Não
                  - `1` = Sim
            schema:
                type: integer
                enum:
                    - 0
                    - 1
        hasInvoiceParam:
            name: has_invoice
            in: query
            description: >
                Realiza a busca por minutas de agendamento **FATURADAS**.
                  - `0` = Não
                  - `1` = Sim
            schema:
                type: integer
                enum:
                    - 0
                    - 1
        operationIdParam:
            name: operation_id
            in: query
            description: Realiza a busca pela **OPERAÇÃO** vinculada à uma minuta de agendamento.
            schema:
                type: integer
                minimum: 1
        reserveNumberParam:
            name: reserve_number
            in: query
            description: Realiza a busca pelo **NÚMERO DA RESERVA** da minuta de agendamento.
            schema:
                type: string
        shipNameParam:
            name: ship_name
            in: query
            description: Realiza a busca pelo **NAVIO** da minuta de agendamento.
            schema:
                type: string
        createdParam:
            name: created_at
            in: query
            description: Data de criação. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        createdFromParam:
            name: created_from
            in: query
            description: Data de criação inicial. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        createdToParam:
            name: created_to
            in: query
            description: Data de criação final. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        updatedParam:
            name: updated_at
            in: query
            description: Data da última atualização. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        updatedFromParam:
            name: updated_from
            in: query
            description: Data da última atualização inicial. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        updatedToParam:
            name: updated_to
            in: query
            description: Data da última atualização final. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        scheduledAtFromParam:
            name: scheduled_at_from
            in: query
            description: Data de agendamento inicial. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        scheduledAtToParam:
            name: scheduled_at_to
            in: query
            description: Data de agendamento final. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        confirmedAtFromParam:
            name: confirmed_at_from
            in: query
            description: Data de confirmação inicial. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        confirmedAtToParam:
            name: confirmed_at_to
            in: query
            description: Data de confirmação final. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        startedAtFromParam:
            name: started_at_from
            in: query
            description: Data de início inicial. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        startedAtToParam:
            name: started_at_to
            in: query
            description: Data de início final. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        finishedAtFromParam:
            name: finished_at_from
            in: query
            description: Data de término inicial. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        finishedAtToParam:
            name: finished_at_to
            in: query
            description: Data de término final. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        productMaturityFromParam:
            name: product_maturity_from
            in: query
            description: Data de vencimento inicial do produto predominante. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        productMaturityToParam:
            name: product_maturity_to
            in: query
            description: Data de vencimento final do produto predominante. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        pageParam:
            name: page
            in: query
            description: Paginação dos resultados
            required: false
            schema:
                type: integer
                minimum: 1
                default: 1

    # CORPO DE REQUISIÇÕES
    requestBodies:
        CreateBody:
            description: 'Este corpo será utilizado para criação de uma minuta de agendamento.'
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/BaseIncomeAppointmentModel'
        UpdateBody:
            description: 'Este corpo será utilizado para atualização de uma minuta de agendamento.'
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/BaseIncomeAppointmentModel'
        ActionBody:
            description: 'Corpo utilizado para executar ações no agendamento.'
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ActionRequest'
        CancelBody:
            description: 'Corpo utilizado para o cancelamento de uma minuta de agendamento.'
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CancelRequest'
        NoShowBody:
            description: 'Corpo utilizado para registrar No-Show de uma minuta de agendamento.'
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/NoShowRequest'

    # RESPOSTAS
    responses:
        SearchSuccess:
            description: 'Resposta de sucesso, para consultas de minutas de agendamento.'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/SearchResponse'
        CreateSuccess:
            description: 'Resposta de sucesso, para criação de uma minuta de agendamento.'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CreateResponse'
        UpdateSuccess:
            description: 'Resposta de sucesso, para atualização de uma minuta de agendamento.'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/UpdateResponse'
        ActionSuccess:
            description: 'Resposta de sucesso para a ação executada.'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/ActionResponse'
        CancelSuccess:
            description: 'Resposta de sucesso para o cancelamento.'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CancelResponse'
        NoShowSuccess:
            description: 'Resposta de sucesso para o registro de No-Show.'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/NoShowResponse'

    # OBJETOS
    schemas:

        # Requests
        ActionRequest:
            type: object
            required:
                - id
                - action_on
            properties:
                id:
                    type: integer
                    minimum: 1
                    example: 123
                    description: 'ID da minuta de agendamento.'
                when:
                    type: string
                    format: 'Y-m-d H:i:s'
                    example: '2026-07-30 14:00:00'
                    description: 'Data e hora de realização da ação.'
                action_on:
                    type: string
                    example: 'confirm'
                    description: >
                        Ação a ser executada:
                          - `confirm` = Confirmar
                          - `start` = Iniciar
                          - `finish` = Finalizar
                    enum:
                        - confirm
                        - start
                        - finish
        CancelRequest:
            type: object
            required:
                - id
                - reason
            properties:
                id:
                    type: integer
                    minimum: 1
                    example: 123
                    description: 'ID da minuta de agendamento.'
                reason:
                    type: string
                    minLength: 15
                    maxLength: 200
                    example: 'Cancelamento solicitado pelo cliente devido a imprevistos logísticos.'
                    description: 'Motivo do cancelamento (mínimo 15 e máximo 200 caracteres).'
        NoShowRequest:
            type: object
            required:
                - id
            properties:
                id:
                    type: integer
                    minimum: 1
                    example: 123
                    description: 'ID da minuta de agendamento.'

        # RESPONSES
        SearchResponse:
            type: object
            properties:
                data:
                    type: array
                    items:
                        oneOf:
                            -   $ref: '#/components/schemas/SimpleSearchIncomeAppointmentModel'
                            -   $ref: '#/components/schemas/FullSearchIncomeAppointmentModel'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação.'
                total:
                    type: integer
                    example: 90
                    description: 'Quantidade total de resultados'
        CreateResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/FullSearchIncomeAppointmentModel'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação.'
                message:
                    type: string
                    example: 'Item criado com sucesso'
                    description: 'Mensagem de retorno'
        UpdateResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/FullSearchIncomeAppointmentModel'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação.'
                message:
                    type: string
                    example: 'Item editado com sucesso'
                    description: 'Mensagem de retorno'
        ActionResponse:
            type: object
            properties:
                data:
                    type: object
                    properties:
                        id:
                            type: integer
                            example: 353948
                            description: 'ID da minuta de agendamento.'
                        status:
                            type: integer
                            example: 3
                            description: >
                                Status atual da Minuta:
                                  - `0` = Agendada
                                  - `3` = Confirmada
                                  - `5` = No Show
                                  - `6` = Cancelada
                                  - `9` = Em Execução
                                  - `10` = Finalizada
                            enum:
                                - 0
                                - 3
                                - 5
                                - 6
                                - 9
                                - 10
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação.'
                message:
                    type: string
                    example: 'Ação realizada com sucesso!'
                    description: 'Mensagem de retorno.'
        CancelResponse:
            type: object
            properties:
                data:
                    type: object
                    properties:
                        id:
                            type: integer
                            example: 353949
                            description: 'ID da minuta de agendamento.'
                        status:
                            type: integer
                            example: 6
                            description: >
                                Status atual da Minuta:
                                  - `0` = Agendada
                                  - `3` = Confirmada
                                  - `5` = No Show
                                  - `6` = Cancelada
                                  - `9` = Em Execução
                                  - `10` = Finalizada
                            enum:
                                - 0
                                - 3
                                - 5
                                - 6
                                - 9
                                - 10
