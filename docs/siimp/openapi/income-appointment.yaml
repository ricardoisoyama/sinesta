        # SCHEMA BUSCA GERAL
        SimpleSearchIncomeAppointmentModel:
            allOf:
                -   $ref: '#/components/schemas/BaseSearchIncomeAppointmentModel'

        # SCHEMA BUSCA POR ID
        FullSearchIncomeAppointmentModel:
            allOf:
                -   $ref: '#/components/schemas/BaseSearchIncomeAppointmentModel'
                -   type: object
                    properties:
                        histories:
                            type: array
                            description: 'Históricos da minuta de agendamento.'
                            items:
                                type: object
                                properties:
                                    id:
                                        type: integer
                                        example: 123
                                        description: 'ID do histórico.'
                                    username:
                                        type: string
                                        example: 'usuario'
                                        description: 'Usuário que lançou o histórico.'
                                    message:
                                        type: string
                                        example: 'Status da Minuta de Agendamento.'
                                        description: 'Descrição da mensagem do histórico.'
                                    created_at:
                                        type: string
                                        format: 'Y-m-d H:i:s'
                                        example: '2026-12-31 23:59:59'
                                        description: 'Data de Criação do registro do histórico.'
                        nfs:
                            type: array
                            description: 'NF-es da minuta de agendamento.'
                            items:
                                type: object
                                properties:
                                    id:
                                        type: integer
                                        example: 123
                                        description: 'ID da NF-e.'
                                    serie:
                                        type: string
                                        example: '1'
                                        description: 'Série da NF-e.'
                                    number:
                                        type: string
                                        example: '176473'
                                        description: 'Número da NF-e.'
                                    key:
                                        type: string
                                        example: '35260701943374000103550010001764731001243418'
                                        description: 'Chave da NF-e'
                                    weight:
                                        type: number
                                        example: 10.00
                                        description: 'Peso bruto da NF-e.'
                                    total:
                                        type: number
                                        example: 123.45
                                        description: 'Total da NF-e.'
                                    qtd:
                                        type: number
                                        example: 1.00
                                        description: 'Quantidade de volumes da NF-e.'
                                    qtd_products:
                                        type: number
                                        example: 1.00
                                        description: 'Quantidade de produtos da NF-e.'
                                    net_weight:
                                        type: number
                                        example: 10.00
                                        description: 'Peso líquido da NF-e.'
                        services:
                            type: array
                            description: 'Serviços da minuta de agendamento.'
                            items:
                                type: object
                                properties:
                                    id:
                                        type: integer
                                        example: 123
                                        description: 'ID do Serviço.'
                                    name:
                                        type: string
                                        example: 'Nome'
                                        description: 'Nome do Serviço.'
                                    value:
                                        type: number
                                        example: 123.45
                                        description: 'Valor do Serviço.'
                                    quantity:
                                        type: number
                                        example: 123.45
                                        description: 'Quantidade do Serviço.'
                                    total:
                                        type: number
                                        example: 123.45
                                        description: 'Total do Serviço.'
