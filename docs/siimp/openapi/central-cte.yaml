
openapi: 3.0.3
info:
    version: '2.0'
    title: 'Central de CT-es'
    description: |-
        Esta integração documenta todos os endpoints disponíveis para o módulo de **Central de CT-es**.

        Você deve preencher o campo `subdominio` com o nome do domínio da transportadora providenciado pela equipe da Siimp.

        Além disso, selecione o `ambiente` desejado para a API, onde:
        - `lannister` significa **PRODUÇÃO**
        - `dev-lannister` significa **HOMOLOGAÇÃO**

        Caso possua dúvidas sobre a configuração e parametrização de tokens e URLs da API, verifique a página principal da documentação em **[API REST](https://siimp.youtrack.cloud/articles/SUP-A-383)**
servers:
    -
        url: 'https://{subdominio}.{ambiente}.emitir.me'
        variables:
            subdominio:
                default: subdominio_da_transportadora
            ambiente:
                default: dev-lannister
                enum:
                    - lannister
                    - dev-lannister
tags:
    - name: central-ctes
      description: Rota para gerenciamento do conhecimento de transporte eletrônico  **(CT-e)**.
    - name: upload
      description: Rotas para upload de arquivos do conhecimento de transporte eletrônico **(CT-e)**.
paths:
    /central-ctes/search:
        get:
            tags:
                - central-ctes
            description: Busca os ct-es registrados na central de ct-es com base nos filtros informados
            operationId: search
            parameters:
                - name: id
                  in: query
                  description: >
                      Realiza a busca pelo **ID** de um CT-e da central. *A existência deste parâmetro funciona como um `find` para retorno de um único registro no banco de dados*
                  required: false
                  schema:
                      type: integer
                      minimum: 1

                - name: ids
                  in: query
                  description: Realiza a busca pelos **IDS** dos CT-es da central, separados por vírgula
                  required: false
                  style: form
                  explode: false
                  schema:
                      type: array
                      items:
                          type: integer

                - name: number
                  in: query
                  description: Realiza a busca pelo **NÚMERO** do CT-e da central, podendo ser separado por vírgula em caso de vários.
                  required: false
                  schema:
                      type: number

                - name: owner_id
                  in: query
                  description: Realiza a busca pelo **CÓDIGO DA EMPRESA**.
                  required: false
                  schema:
                      type: integer

                - name: key
                  in: query
                  description: Realiza a busca pela **CHAVE DE ACESSO**.
                  required: false
                  schema:
                      type: string
                      pattern: '[A-Z0-9]'
                      minLength: 44
                      maxLength: 44

                - name: taker
                  in: query
                  description: >
                      **TIPO DO TOMADOR** do CT-e:
                        - `0`        = Remetente
                        - `1`        = Expedidor
                        - `2`        = Recebedor
                        - `3`        = Destinatário
                        - `4`        = Outros
                  required: false
                  schema:
                      type: integer

                - name: participation
                  in: query
                  description: >
                      **PARTICIPAÇÃO DA EMPRESA** no CT-e:
                        - `0`        = Emitente
                        - `1`        = Remetente
                        - `2`        = Destinatário
                        - `3`        = Expedidor
                        - `4`        = Recebedor
                        - `5`        = Tomador (Outros)
                        - `6`        = Outro
                  required: false
                  schema:
                      type: integer

                - name: service_type
                  in: query
                  description: >
                      **TIPO DO SERVIÇO** do CT-e:
                        - `0`        = Normal
                        - `1`        = Subcontratação
                        - `2`        = Redespacho
                        - `3`        = Redespacho Intermediário
                        - `4`        = Serviço Multimodal
                        - `5`        = Transporte de Pessoas
                        - `6`        = Transporte de Valores
                        - `7`        = Excesso de Bagagem
                  required: false
                  schema:
                      type: integer

                - name: input_origin
                  in: query
                  description: >
                      **ORIGEM DO CADASTRO** do CT-e:
                        - `0`        = Digitada
                        - `1`        = XML
                        - `2`        = SEFAZ
                  required: false
                  schema:
                      type: integer

                - name: issued_at
                  in: query
                  description: Data de emissão. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
                  schema:
                      type: string
                      format: 'Y-m-d|relative'

                - name: issued_from
                  in: query
                  description: Data de emissão inicial. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
                  schema:
                      type: string
                      format: 'Y-m-d|relative'

                - name: issued_to
                  in: query
                  description: Data de emissão final. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
                  schema:
                      type: string
                      format: 'Y-m-d|relative'

                - name: created_at
                  in: query
                  description: Data de criação. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
                  schema:
                      type: string
                      format: 'Y-m-d|relative'

                - name: created_from
                  in: query
                  description: Data de criação inicial. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
                  schema:
                      type: string
                      format: 'Y-m-d|relative'

                - name: created_to
                  in: query
                  description: Data de criação final. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
                  schema:
                      type: string
                      format: 'Y-m-d|relative'

                - name: updated_at
                  in: query
                  description: Data da última atualização. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
                  schema:
                      type: string
                      format: 'Y-m-d|relative'

                - name: updated_from
                  in: query
                  description: Data da última atualização inicial. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
                  schema:
                      type: string
                      format: 'Y-m-d|relative'

                - name: updated_to
                  in: query
                  description: Data da última atualização final. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
                  schema:
                      type: string
                      format: 'Y-m-d|relative'

                - name: cte_number
                  in: query
                  description: Realiza a busca pelo **NÚMERO DO CT-E** vinculado a um CT-e da central, podendo ser separado por vírgula em caso de vários.
                  required: false
                  schema:
                      type: number

                - name: income_number
                  in: query
                  description: Realiza a busca pelo **NÚMERO DA MINUTA** vinculada a um CT-e da central, podendo ser separado por vírgula em caso de vários.
                  required: false
                  schema:
                      type: number

                - name: issuer_name
                  in: query
                  description: Realiza a busca pelo **EMITENTE** do CT-e da central. Pode ser pelo nome *(completo ou parcial)*, CPF ou CNPJ
                  required: false
                  schema:
                      type: string

                - name: sender_name
                  in: query
                  description: Realiza a busca pelo **REMETENTE** do CT-e da central. Pode ser pelo nome *(completo ou parcial)*, CPF ou CNPJ
                  required: false
                  schema:
                      type: string

                - name: addressee_name
                  in: query
                  description: Realiza a busca pelo **DESTINATÁRIO** do CT-e da central. Pode ser pelo nome *(completo ou parcial)*, CPF ou CNPJ
                  required: false
                  schema:
                      type: string

                - name: dispatcher_name
                  in: query
                  description: Realiza a busca pelo **EXPEDIDOR** do CT-e da central. Pode ser pelo nome *(completo ou parcial)*, CPF ou CNPJ
                  required: false
                  schema:
                      type: string

                - name: receiver_name
                  in: query
                  description: Realiza a busca pelo **RECEBEDOR** do CT-e da central. Pode ser pelo nome *(completo ou parcial)*, CPF ou CNPJ
                  required: false
                  schema:
                      type: string

                - name: other_name
                  in: query
                  description: Realiza a busca pelo **OUTROS** do CT-e da central. Pode ser pelo nome *(completo ou parcial)*, CPF ou CNPJ
                  required: false
                  schema:
                      type: string

                - name: taker_name
                  in: query
                  description: Realiza a busca pelo **TOMADOR** do CT-e da central. Pode ser pelo nome *(completo ou parcial)*, CPF ou CNPJ
                  required: false
                  schema:
                      type: string

                - name: page
                  in: query
                  description: Paginação dos resultados
                  required: false
                  schema:
                      type: integer
                      minimum: 1
                      default: 1

            responses:
                '200':
                    description: Sucesso
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/SearchResponse'
    /central-ctes/xml:
        get:
            tags:
                - central-ctes
            description: Busca o arquivo XML de um CT-e
            operationId: xml
            parameters:
                -   name: id
                    in: query
                    description: ID do CT-e que deseja buscar o arquivo XML.
                    required: true
                    schema:
                        type: integer
                        minimum: 1
            responses:
                '200':
                    description: Sucesso
                    headers:
                        Content-Type:
                            schema:
                                type: string
                                example: 'application/xml; charset=utf-8'
                    content:
                        application/xml:
                            schema:
                                type: string
                                format: binary
    /central-ctes/dacte:
        get:
            tags:
                - central-ctes
            description: Busca o arquivo DACT-e (_pdf_) de um CT-e
            operationId: dacte
            parameters:
                -   name: id
                    in: query
                    description: ID do CT-e que deseja buscar o arquivo DACT-e.
                    required: true
                    schema:
                        type: integer
                        minimum: 1
            responses:
                '200':
                    description: Sucesso
                    headers:
                        Content-Type:
                            schema:
                                type: string
                                example: 'application/pdf; charset=utf-8'
                    content:
                        application/pdf:
                            schema:
                                type: string
                                format: binary
    /central-ctes/create:
        post:
            tags:
                - central-ctes
            description: Cria um CT-e na **Central de CT-es**
            operationId: create
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CTeModel'
                required: true
            responses:
                '200':
                    description: Sucesso
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/CreateResponse'
    /central-ctes/update:
        post:
            tags:
                - central-ctes
            description: Atualiza um CT-e na **Central de CT-es**
            operationId: update
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/CTeModel'
                required: true
            responses:
                '200':
                    description: Sucesso
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UpdateResponse'
    /central-ctes/delete:
        post:
            tags:
                - central-ctes
            description: Remove um CT-e na **Central de CT-es**
            operationId: delete
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/DeleteRequest'
                required: true
            responses:
                '200':
                    description: Sucesso
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/DeleteResponse'
    /central-ctes/generate:
        post:
            tags:
                - central-ctes
            description: Gera um **CT-e 3.0** ou **Minuta Comum** com base no CT-e da central
            operationId: generate
            requestBody:
                content:
                    application/json:
                        schema:
                            $ref: '#/components/schemas/GenerateRequest'
                required: true
            responses:
                '200':
                    description: Sucesso
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/GenerateResponse'
    /cte-archive/xml:
        post:
            tags:
                - upload
            description: Realiza o upload de um arquivo XML de um CT-e autorizado
            operationId: uploadXML
            requestBody:
                content:
                    multipart/form-data:
                        schema:
                            $ref: '#/components/schemas/UploadXMLRequest'
                required: true
            responses:
                '200':
                    description: Sucesso
                    content:
                        application/json:
                            schema:
                                $ref: '#/components/schemas/UploadXMLResponse'
components:
    securitySchemes:
        x-api-key:
            type: apiKey
            name: x-api-key
            in: header
    schemas:

        # REQUESTS
        DeleteRequest:
            type: object
            properties:
                id:
                    type: integer
                    example: '123456'
                    description: 'ID do CT-e da central'
        GenerateRequest:
            type: object
            properties:
                id:
                    type: integer
                    example: 7829
                    nullable: false
                    description: 'ID do CT-e da central'
                document_type:
                    type: string
                    example: 'ct-e'
                    nullable: false
                    description: >
                        **TIPO DO DOCUMENTO** a se gerado
                         - `income` = Minuta
                         - `cte`    = CT-e
                service_type:
                    type: integer
                    example: 0
                    nullable: false
                    description: >
                        **TIPO DO SERVIÇO** que será gerado ao documento
                         - `0`  = Normal
                         - `1`  = Subcontratação
                         - `2`  = Redespacho
                         - `3`  = Redespacho Intermediário
                         - `4`  = Serviço Multimodal
                         - `5`  = Reentrega
                         - `10` = Reentrega (Redespacho)
                         - `11` = Reentrega (Red. Intermed.)
                         - `6`  = Devolução
                type_region:
                    type: integer
                    example: 2
                    nullable: true
                    description: >
                        **TIPO DA ROTA** que será aplicada
                         - `0` = Entrega
                         - `1` = Coleta
                         - `2` = Nenhuma
                costcenter_id:
                    type: integer
                    example: 323
                    nullable: true
                    description: 'ID do centro de custos'
                operation_id:
                    type: integer
                    example: 232
                    nullable: true
                    description: 'ID da operação'
                category1_id:
                    type: integer
                    example: 321
                    nullable: true
                    description: 'ID da categoria 1'
                category2_id:
                    type: integer
                    example: 321
                    nullable: true
                    description: 'ID da categoria 2'
                category3_id:
                    type: integer
                    example: 321
                    nullable: true
                    description: 'ID da categoria 3'
                driver:
                    type: object
                    nullable: true
                    description: 'Motorista'
                    properties:
                        cpf:
                            type: integer
                            example: '9999999999'
                            description: 'CPF do motorista'
                vehicles:
                    type: object
                    nullable: true
                    description: 'Veículos'
                    properties:
                        traction:
                            type: object
                            description: 'Tração'
                            properties:
                                license_plate:
                                    type: string
                                    example: 'AJX3435'
                                    maxLength: 7
                                    minLength: 7
                                    description: 'Placa da tração'
                        trailer1:
                            type: object
                            description: 'Reboque 1'
                            properties:
                                license_plate:
                                    type: string
                                    example: 'XDE3435'
                                    maxLength: 7
                                    minLength: 7
                                    description: 'Placa do Reboque 1'
                        trailer2:
                            type: object
                            description: 'Reboque 2'
                            properties:
                                license_plate:
                                    type: string
                                    example: 'XUE3435'
                                    maxLength: 7
                                    minLength: 7
                                    description: 'Placa do Reboque 2'
                        trailer3:
                            type: object
                            description: 'Reboque 3'
                            properties:
                                license_plate:
                                    type: string
                                    example: 'JDX3435'
                                    maxLength: 7
                                    minLength: 7
                                    description: 'Placa do Reboque 3'
        UploadXMLRequest:
            type: object
            properties:
                file:
                    type: string
                    format: binary
                    nullable: true
                    description: 'XML do CT-e autorizado *(somente arquivos de até 1 MB serão aceitos)*'
                type:
                    type: string
                    nullable: true
                    description: 'É necessário informar o valor `central_cte` para que o upload do XML seja realizado'
                owner_id:
                    type: integer
                    nullable: true
                    description: 'É necessário informar o `ID da empresa` para que que o upload do XML seja realizado'

        # RESPONSES
        SearchResponse:
            type: object
            properties:
                data:
                    type: array
                    items:
                        $ref: '#/components/schemas/CTeModel'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                total:
                    type: integer
                    example: 1
                    description: 'Quantidade total de resultados'
        CreateResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/CTeModel'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'Item criado com sucesso'
                    description: 'Mensagem de retorno'
        UpdateResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/CTeModel'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'Item editado com sucesso'
                    description: 'Mensagem de retorno'
        DeleteResponse:
            type: object
            properties:
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'Item removido com sucesso'
                    description: 'Mensagem de retorno'
        GenerateResponse:
            type: object
            properties:
                data:
                    type: object
                    properties:
                        income:
                            type: object
                            description: 'Tag retornada no caso da geração de uma Minuta'
                            properties:
                                id:
                                    type: integer
                                    example: 231233
                                    description: 'ID da minuta gerada'
                                number:
                                    type: integer
                                    example: 23123
                                    description: 'Número da minuta gerada'
                        cte:
                            type: object
                            description: 'Tag retornada no caso da geração de um CT-e'
                            properties:
                                id:
                                    type: integer
                                    example: 433432
                                    description: 'ID do CT-e gerado'
                                number:
                                    type: integer
                                    example: 6327
                                    description: 'Número do CT-e gerado'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'Documento gerado com sucesso!'
                    description: 'Mensagem de retorno'
        UploadXMLResponse:
            type: object
            properties:
                data:
                    type: object
                    properties:
                        id:
                            type: integer
                            example: '2329'
                            description: 'ID do CT-e'
                        serie:
                            type: string
                            pattern: '[0-9]'
                            minLength: 1
                            maxLength: 3
                            example: '1'
                            description: 'Série do CT-e'
                        number:
                            type: string
                            pattern: '[0-9]'
                            minLength: 1
                            maxLength: 9
                            example: '23993'
                            description: 'Número da nota fiscal'
                        key:
                            type: string
                            pattern: '[A-Z0-9]'
                            minLength: 44
                            maxLength: 44
                            example: '0101010101010101010101010101010101010101'
                            description: 'Chave de acesso do CT-e'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'Arquivo processado com sucesso'
                    description: 'Mensagem de retorno'

        # SCHEMA DOCUMENTS 1
        SchemaDocuments1:
            type: object
            properties:
                id:
                    type: integer
                    example: 1700137430654
                    readOnly: true
                    description: 'ID do registro do documento'
                key:
                    type: string
                    maxLength: 44
                    minLength: 44
                    example: '0101010101010101010101010101010101010101'
                    description: 'Chave de acesso do documento'
                cfop:
                    type: string
                    example: '5343'
                    description: 'CFOP do documento - disponível somente quando category for igual a 1 ou 2'
                type:
                    type: integer
                    example: 1
                    description: >
                        **TIPO DO DOCUMENTO**
                         - `0`  = Declaração
                         - `1`  = NF modelo 1
                         - `4`  = NF do Produtor
                         - `10` = Dutoviário
                         - `59` = CF-e SAT
                         - `65` = NFC-e
                         - `99` = Outros
                        disponível somente quando category for igual a 1 ou 2
                    enum:
                        - 0
                        - 1
                        - 4
                        - 10
                        - 59
                        - 65
                        - 99
                serie:
                    type: string
                    example: '1'
                    description: 'Série do documento - disponível somente quando category for igual a 1 ou 2'
                total:
                    type: number
                    example: 201.10
                    description: 'Total do documento - disponível somente quando category for igual a 1 ou 2'
                number:
                    type: string
                    example: '23123'
                    description: 'Número do documento - disponível somente quando category for igual a 1 ou 2'
                weight:
                    type: number
                    example: 40.000
                    description: 'Peso do documento (KG) - disponível somente quando category for igual a 1 ou 2'
                icms_bc:
                    type: number
                    example: 20.00
                    description: 'Base de cálculo icms do documento - disponível somente quando category for igual a 1 ou 2'
                category:
                    type: integer
                    example: 2
                    description: >
                        **CATEGORIA** do documento
                         - `0` = NF-e
                         - `1` = NF Avulsa
                         - `2` = Outras
                issued_at:
                    type: string
                    format: 'Y-m-d'
                    example: '2023-11-14'
                    description: 'Data de emissão do documento - disponível somente quando category for igual a 1 ou 2'
                icms_st_bc:
                    type: number
                    example: 5.00
                    description: 'Base de cálculo da substituição tributária do documento - disponível somente quando category for igual a 1 ou 2'
                icms_value:
                    type: number
                    example: 20.00
                    description: 'Valor de ICMS do documento - disponível somente quando category for igual a 1 ou 2'
                delivery_at:
                    type: string
                    format: 'Y-m-d'
                    example: '2023-11-14'
                    description: 'Previsão de entrega do documento - disponível somente quando category for igual a 1 ou 2'
                description:
                    type: string
                    example: 'Teste de descrição do documento'
                    description: 'Descrição do documento - disponível somente quando category for igual a 1 ou 2'
                pin_suframa:
                    type: string
                    maxLength: 9
                    minLength: 9
                    example: '999999999'
                    description: 'SUFRAMA do documento - disponível somente quando category for igual a 1 ou 2'
                order_number:
                    type: string
                    example: '312434'
                    description: 'Nº do pedido - disponível somente quando category for igual a 1 ou 2'
                icms_st_value:
                    type: number
                    example: 10.00
                    description: 'Valor do ICMS da substituição tributária do documento - disponível somente quando category for igual a 1 ou 2'
                packing_number:
                    type: string
                    example: '232838'
                    description: 'Romaneio vinculado ao documento - disponível somente quando category for igual a 1 ou 2'
                total_products:
                    type: string
                    example: '3.0000'
                    description: 'Total dos produtos do documento - disponível somente quando category for igual a 1 ou 2'

        # SCHEMA DOCUMENTS 2
        SchemaDocuments2:
            type: object
            properties:
                id:
                    type: integer
                    example: 1700137400400
                    readOnly: true
                    description: 'ID do registro do documento'
                key:
                    type: string
                    maxLength: 44
                    minLength: 44
                    example: '0101010101010101010101010101010101010101'
                    description: 'Chave de acesso do documento'
                category:
                    type: integer
                    example: 0
                    description: >
                        **CATEGORIA** do documento
                         - `0` = NF-e
                         - `1` = NF Avulsa
                         - `2` = Outras

        # MODELS
