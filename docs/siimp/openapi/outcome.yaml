openapi: 3.0.3
info:
    version: '2.0'
    title: Romaneios
    description: |-
        Esta integração documenta todos os endpoints disponíveis para o módulo de **Romaneios**.

        Você deve preencher o campo `subdominio` com o nome do domínio da transportadora providenciado pela equipe da Siimp.

        Além disso, selecione o `ambiente` desejado para a API, onde:
        - `lannister` significa **PRODUÇÃO**
        - `dev-lannister` significa **HOMOLOGAÇÃO**

        Caso possua dúvidas sobre a configuração e parametrização de tokens e URLs da API, verifique a página principal da documentação em **[API REST](https://siimp.youtrack.cloud/articles/SUP-A-383)**
servers:
    -
        url: 'https://{subdominio}.{ambiente}.emitir.me'
        variables:
            subdominio:
                default: subdominio_da_transportadora
            ambiente:
                default: dev-lannister
                enum:
                    - lannister
                    - dev-lannister
tags:
    -
        name: outcomes
        description: 'Rota para cadastramento, atualização e inserção de Romaneios'
security:
    -
        ApiKeyAuth: []
paths:
    /outcomes/search:
        get:
            tags:
                - outcomes
            description: 'Busca de Romaneios com base nos filtros informados.'
            operationId: search
            parameters:
                -
                    $ref: '#/components/parameters/IdParam'
                -
                    $ref: '#/components/parameters/IdsParam'
                -
                    $ref: '#/components/parameters/OwnerIdParam'
                -
                    $ref: '#/components/parameters/TypeParam'
                -
                    $ref: '#/components/parameters/NumberParam'
                -
                    $ref: '#/components/parameters/NumberFromParam'
                -
                    $ref: '#/components/parameters/NumberToParam'
                -
                    $ref: '#/components/parameters/ScheduledDateFromParam'
                -
                    $ref: '#/components/parameters/ScheduledDateToParam'
                -
                    $ref: '#/components/parameters/VehicleIdParam'
                -
                    $ref: '#/components/parameters/StartedFromParam'
                -
                    $ref: '#/components/parameters/StartedToParam'
                -
                    $ref: '#/components/parameters/FinishedFromParam'
                -
                    $ref: '#/components/parameters/FinishedToParam'
                -
                    $ref: '#/components/parameters/CreateUserIdParam'
                -
                    $ref: '#/components/parameters/UpdateUserIdParam'
                -
                    $ref: '#/components/parameters/CrmIdParam'
                -
                    $ref: '#/components/parameters/OperationIdParam'
                -
                    $ref: '#/components/parameters/StartBranchOfficeIdParam'
                -
                    $ref: '#/components/parameters/FinishBranchOfficeIdParam'
                -
                    $ref: '#/components/parameters/FinishBranchParam'
                -
                    $ref: '#/components/parameters/DriverIdParam'
                -
                    $ref: '#/components/parameters/DriverParam'
                -
                    $ref: '#/components/parameters/NumberCteParam'
                -
                    $ref: '#/components/parameters/NumberIncomeParam'
                -
                    $ref: '#/components/parameters/NumberCollectionParam'
                -
                    $ref: '#/components/parameters/NumberNfParam'
                -
                    $ref: '#/components/parameters/CreatedAtParam'
                -
                    $ref: '#/components/parameters/CreatedFromParam'
                -
                    $ref: '#/components/parameters/CreatedToParam'
                -
                    $ref: '#/components/parameters/UpdatedAtParam'
                -
                    $ref: '#/components/parameters/UpdatedFromParam'
                -
                    $ref: '#/components/parameters/UpdatedToParam'
                -
                    $ref: '#/components/parameters/StatusParam'
                -
                    $ref: '#/components/parameters/PageParam'
            responses:
                200:
                    $ref: '#/components/responses/SearchSuccess'
    /outcomes/create:
        post:
            tags:
                - outcomes
            description: 'Criação de um Romaneio no sistema.'
            operationId: create
            requestBody:
                $ref: '#/components/requestBodies/CreateBody'
            responses:
                200:
                    $ref: '#/components/responses/CreateSuccess'
    /outcomes/update:
        post:
            tags:
                - outcomes
            description: 'Atualização de um Romaneio no sistema.'
            operationId: update
            requestBody:
                $ref: '#/components/requestBodies/UpdateBody'
            responses:
                200:
                    $ref: '#/components/responses/UpdateSuccess'
    /outcomes/start:
        post:
            tags:
                - outcomes
            description: 'Inicialização de um Romaneio no sistema.'
            operationId: start
            requestBody:
                $ref: '#/components/requestBodies/StartBody'
            responses:
                200:
                    $ref: '#/components/responses/StartSuccess'
    /outcomes/cancel:
        post:
            tags:
                - outcomes
            description: 'Cancelamento de um Romaneio no sistema.'
            operationId: cancel
            requestBody:
                $ref: '#/components/requestBodies/CancelBody'
            responses:
                200:
                    $ref: '#/components/responses/CancelSuccess'
    /outcomes/finish:
        post:
            tags:
                - outcomes
            description: 'Finalização de um Romaneio no sistema.'
            operationId: finish
            requestBody:
                $ref: '#/components/requestBodies/FinishBody'
            responses:
                200:
                    $ref: '#/components/responses/FinishSuccess'
components:
    securitySchemes:
        ApiKeyAuth:
            type: apiKey
            name: x-api-key
            in: header
    parameters:
        IdParam:
            name: id
            in: query
            description: 'Realiza a busca por um ID específico. *A existência deste parâmetro funciona como um `find` para retorno de um único registro no banco de dados*'
            required: false
            schema:
                type: integer
        IdsParam:
            name: ids
            in: query
            description: 'Realiza a busca por IDs pré-definidos.'
            required: false
            schema:
                type: array
                items:
                    type: integer
            explode: false
            style: form
        OwnerIdParam:
            name: owner_id
            in: query
            description: 'Realiza a busca pela empresa.'
            required: false
            schema:
                type: integer
        TypeParam:
            name: type
            in: query
            description: |-
                Realiza a busca por tipo.

                - `0` = Manifesto de Entrega
                - `1` = Manifesto de Transferência
                - `2` = Outros
            required: false
            schema:
                enum:
                    - 0
                    - 1
                    - 2
        NumberParam:
            name: number
            in: query
            description: 'Realiza a busca por número.'
            required: false
            schema:
                type: integer
        NumberFromParam:
            name: number_from
            in: query
            description: 'Realiza a busca pelo número inicial.'
            required: false
            schema:
                type: integer
        NumberToParam:
            name: number_to
            in: query
            description: 'Realiza a busca pelo número final.'
            required: false
            schema:
                type: integer
        ScheduledDateFromParam:
            name: scheduled_date_from
            in: query
            description: 'Realiza a busca pela data de agendamento. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**'
            required: false
            schema:
                type: string
                format: Y-m-d|relative
        ScheduledDateToParam:
            name: scheduled_date_to
            in: query
            description: 'Realiza a busca pela data de agendamento. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**'
            required: false
            schema:
                type: string
                format: Y-m-d|relative
        VehicleIdParam:
            name: vehicle_id
            in: query
            description: 'Realiza a busca pelo veículo.'
            required: false
            schema:
                type: integer
        StartedFromParam:
            name: started_from
            in: query
            description: 'Realiza a busca pela data inicial do início da viagem. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**'
            required: false
            schema:
                type: string
                format: Y-m-d|relative
        StartedToParam:
            name: started_to
            in: query
            description: 'Realiza a busca pela data final do início da viagem. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**'
            required: false
            schema:
                type: string
                format: Y-m-d|relative
        FinishedFromParam:
            name: finished_from
            in: query
            description: 'Realiza a busca pela data inicial do fim da viagem. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**'
            required: false
            schema:
                type: string
                format: Y-m-d|relative
        FinishedToParam:
            name: finished_to
            in: query
            description: 'Realiza a busca pela data final do fim da viagem. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**'
            required: false
            schema:
                type: string
                format: Y-m-d|relative
        CreateUserIdParam:
            name: create_user_id
            in: query
            description: 'Realiza a busca pelo usuário criador do Romaneio.'
            required: false
            schema:
                type: integer
        UpdateUserIdParam:
            name: update_user_id
            in: query
            description: 'Realiza a busca pelo usuário editor do Romaneio.'
            required: false
            schema:
                type: integer
        CrmIdParam:
            name: crm_id
            in: query
            description: 'Realiza a busca pelo usuário CRM do Romaneio.'
            required: false
            schema:
                type: integer
        OperationIdParam:
            name: operation_id
            in: query
            description: 'Realiza a busca pela operação do Romaneio.'
            required: false
            schema:
                type: integer
        StartBranchOfficeIdParam:
            name: start_branch_office_id
            in: query
            description: 'Realiza a busca pela filial inicial do Romaneio.'
            required: false
            schema:
                type: integer
        FinishBranchOfficeIdParam:
            name: finish_branch_office_id
            in: query
            description: 'Realiza a busca pela filial final do Romaneio.'
            required: false
            schema:
                type: integer
        FinishBranchParam:
            name: finish_branch
            in: query
            description: 'Realiza a busca pelo nome, CPF ou CNPJ da filial final do Romaneio.'
            required: false
            schema:
                type: string
        DriverIdParam:
            name: driver_id
            in: query
            description: 'Realiza a busca pelos motoristas e ajudantes do Romaneio.'
            required: false
            schema:
                type: integer
        DriverParam:
            name: driver
            in: query
            description: 'Realiza a busca pelo nome do motorista no Romaneio.'
            required: false
            schema:
                type: string
        NumberCteParam:
            name: number_cte
            in: query
            description: 'Realiza a busca pelo número do CT-e no Romaneio.'
            required: false
            schema:
                type: integer
        NumberIncomeParam:
            name: number_income
            in: query
            description: 'Realiza a busca pelo número da Minuta no Romaneio.'
            required: false
            schema:
                type: string
        NumberCollectionParam:
            name: number_collection
            in: query
            description: 'Realiza a busca pelo número da Ordem de Coleta no Romaneio.'
            required: false
            schema:
                type: string
        NumberNfParam:
            name: number_nf
            in: query
            description: 'Realiza a busca pelo número da NF no Romaneio.'
            required: false
            schema:
                type: string
        CreatedAtParam:
            name: created_at
            in: query
            description: 'Realiza a busca por uma data de criação específica. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**'
            required: false
            schema:
                type: string
                format: Y-m-d|relative
        CreatedFromParam:
            name: created_from
            in: query
            description: 'Realiza a busca por início de data de criação. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**'
            required: false
            schema:
                type: string
                format: Y-m-d|relative
        CreatedToParam:
            name: created_to
            in: query
            description: 'Realiza a busca por fim de data de criação. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**'
            required: false
            schema:
                type: string
                format: Y-m-d|relative
        UpdatedAtParam:
            name: updated_at
            in: query
            description: 'Realiza a busca por uma data de atualização específica. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**'
            required: false
            schema:
                type: string
                format: Y-m-d|relative
        UpdatedFromParam:
            name: updated_from
            in: query
            description: 'Realiza a busca por início de data de atualização. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**'
            required: false
            schema:
                type: string
                format: Y-m-d|relative
        UpdatedToParam:
            name: updated_to
            in: query
            description: 'Realiza a busca por fim de data de atualização. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**'
            required: false
            schema:
                type: string
                format: Y-m-d|relative
        StatusParam:
            name: status
            in: query
            description: |-
                Realiza a busca por status.

                - `0` = Cadastrado
                - `1` = Em Trânsito
                - `2` = Encerrado
                - `3` = Cancelado
            required: false
            schema:
                enum:
                    - 0
                    - 1
                    - 2
                    - 3
        PageParam:
            name: page
            in: query
            description: 'Página dos resultados'
            schema:
                type: integer
    requestBodies:
        CreateBody:
            required: true
            description: 'Este corpo será utilizado para criação de um Romaneio'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Outcome'
        UpdateBody:
            required: true
            description: 'Este corpo será utilizado para atualização de um Romaneio'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Outcome'
        StartBody:
            required: true
            description: 'Este corpo será utilizado para a inicialização de um Romaneio'
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            id:
                                type: integer
                                example: 321565
                                description: 'ID de um romaneio'
                            start:
                                type: object
                                properties:
                                    date:
                                        type: string
                                        format: 'Y-m-d'
                                        example: '2023-06-21'
                                        description: 'Data de inicialização do Romaneio'
                                    time:
                                        type: string
                                        format: 'H:i:s'
                                        example: '15:15:00'
                                        description: 'Hora de inicialização do romaneio'

        CancelBody:
            required: true
            description: 'Este corpo será utilizado para o cancelamento de um Romaneio'
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            id:
                                type: integer
                                example: 456766
                                description: 'ID do romaneio'
                            reason:
                                type: string
                                example: 'teste de cancelamento'
                                minLength: 15
                                maxLength: 250
                                description: 'Motivo do cancelamento do romaneio'
        FinishBody:
            required: true
            description: 'Este corpo será utilizado para a finalização de um romaneio'
            content:
                application/json:
                    schema:
                        type: object
                        properties:
                            id:
                                type: integer
                                example: 321565
                                description: 'ID de um romaneio'
                            finish:
                                type: object
                                properties:
                                    date:
                                        type: string
                                        format: 'Y-m-d'
                                        example: '2023-06-21'
                                        description: 'Data de inicialização do Romaneio'
                                    time:
                                        type: string
                                        format: 'H:i:s'
                                        example: '15:15:00'
                                        description: 'Hora de inicialização do romaneio'
    responses:
        SearchSuccess:
            description: 'Resposta de sucesso para a busca de Romaneios com base nos filtros informados.'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/SearchResponse'
        CreateSuccess:
            description: 'Resposta de sucesso para a criação de um Romaneio no sistema.'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CreateResponse'
        UpdateSuccess:
            description: 'Resposta de sucesso para a atualização de um Romaneio no sistema.'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/UpdateResponse'
        StartSuccess:
            description: 'Resposta de sucesso para a inicialização de um Romaneio no sistema.'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/StartResponse'
        CancelSuccess:
            description: 'Resposta de sucesso para o cancelamento de um Romaneio no sistema.'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CancelResponse'
        FinishSuccess:
            description: 'Resposta de sucesso para a finalização de um Romaneio no sistema.'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/FinishResponse'
    schemas:
        SearchResponse:
            type: object
            properties:
                data:
                    type: array
                    items:
                        oneOf:
                            -
                                $ref: '#/components/schemas/OutcomeSimple'
                            -
                                $ref: '#/components/schemas/OutcomeAll'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                total:
                    type: integer
                    example: 90
                    description: 'Quantidade total de resultados'
        CreateResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/Outcome'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'Item criado com sucesso'
                    description: 'Mensagem de retorno'
        UpdateResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/Outcome'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'Item editado com sucesso'
                    description: 'Mensagem de retorno'
        StartResponse:
            type: object
            properties:
                status:
                    type: integer
                    example: 1
                    description: 'Status de romaneio em trânsito'
                start_date:
                    type: string
                    format: 'Y-m-d H:i:s'
                    example: '2023-06-25 10:00:00'
                    description: 'Data de inicialização do romaneio'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'Romaneio modificado para EM TRÂNSITO'
                    description: 'Mensagem de retorno'
        CancelResponse:
            type: object
            properties:
                status:
                    type: integer
                    example: 3
                    description: 'Status de cancelamento do romaneio'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'Romaneio cancelado com sucesso'
                    description: 'Mensagem de retorno'
        FinishResponse:
            type: object
            properties:
                status:
                    type: integer
                    example: 1
                    description: 'Status de romaneio finalizado'
                start_date:
                    type: string
                    format: 'Y-m-d H:i:s'
                    example: '2023-06-30 12:00:00'
                    description: 'Data de inicialização do romaneio'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'Romaneio modificado para ENCERRADO'
                    description: 'Mensagem de retorno'
        OutcomeBase:
            type: object
            properties:
                id:
                    type: integer
                    example: 3
                    description: 'ID *(não informá-lo durante a criação)*.'
                status:
                    type: integer
                    readOnly: true
                    example: 2
                    description: |-
                        Status do romaneio .

                        - `0` = Cadastrado
                        - `1` = Em Trânsito
                        - `2` = Encerrado
                        - `3` = Cancelado
                    enum:
                        - 0
                        - 1
                        - 2
                        - 3
                type:
                    type: integer
                    example: 5
                    description: |-
                        Tipo de Romaneio.

                        - `0` = Manifesto Entrega
                        - `1` = Manifesto transferência
                        - `2` = Outros
                    enum:
                        - 0
                        - 1
                        - 2
                number:
                    type: integer
                    readOnly: true
                    example: 456317
                    description: 'Número do romaneio'
                ciot:
                    type: object
                    nullable: true
                    readOnly: true
                    properties:
                        id:
                            type: integer
                            example: 156347
                            description: 'ID do CIOT vinculado ao romaneio'
                        number:
                            type: integer
                            example: 21451
                            description: 'Número do CIOT vinculado ao romaneio'
                total:
                    type: number
                    example: '1452.47'
                    description: 'Valor total do romaneio'
                vehicle:
                    type: object
                    properties:
                        traction:
                            allOf:
                                -
                                    $ref: '#/components/schemas/OutcomeVehicle'
                        trailer1:
                            allOf:
                                -
                                    $ref: '#/components/schemas/OutcomeVehicle'
                        trailer2:
                            allOf:
                                -
                                    $ref: '#/components/schemas/OutcomeVehicle'
                        trailer3:
                            allOf:
                                -
                                    $ref: '#/components/schemas/OutcomeVehicle'
                operation:
                    type: object
                    nullable: true
                    properties:
                        id:
                            type: integer
                            example: 126
                            description: 'ID da operação do romaneio'
                        name:
                            type: string
                            example: 'LOTAÇÃO'
                            readOnly: true
                            maxLength: 15
                            description: 'Descrição da operação feita pelo romaneio'
                crm:
                    type: object
                    properties:
                        id:
                            type: integer
                            example: 25416
                            description: 'ID do usuário'
                        username:
                            type: string
                            maxLength: 50
                            readOnly: true
                            example: 'suporte.siimp'
                            description: 'Nome do usuário responsável pelo CRM'
                total_docs:
                    type: integer
                    readOnly: true
                    example: 12
                    description: 'Total de documentos no romaneio'
                created_at:
                    type: string
                    readOnly: true
                    format: 'Y-m-d H:i:s'
                    example: '2023-06-19 09:22:37'
                    description: 'Data de criação do Romaneio'
                updated_at:
                    type: string
                    readOnly: true
                    format: 'Y-m-d H:i:s'
                    example: '2023-06-19 09:22:37'
                    description: 'Data de atualização do Romaneio'
        Outcome:
            allOf:
                -
                    $ref: '#/components/schemas/OutcomeBase'
                -
                    type: object
                    properties:
                        owner_id:
                            type: integer
                            example: 145885
                            description: 'ID da empresa emissora do romaneio'
                        scheduling:
                            allOf:
                                -
                                    $ref: '#/components/schemas/OutcomeScheduling'
                        obs:
                            type: string
                            maxLength: 255
                            example: 'Romaneio iniciado'
                            description: 'Observação do romaneio'
                        documents:
                            allOf:
                                -
                                    $ref: '#/components/schemas/OutcomeDocs'
                        drivers:
                            allOf:
                                -
                                    $ref: '#/components/schemas/OutcomeGroupingDriver'
                        scheduled:
                                allOf:
                                    - $ref: '#/components/schemas/OutcomeScheduled'
                        options:
                            allOf:
                                - $ref: '#/components/schemas/OutcomeOptions'
                        baits:
                            type: array
                            items:
                                allOf:
                                    - $ref: '#/components/schemas/OutcomeBaits'
        OutcomeSimple:
            allOf:
                -
                    $ref: '#/components/schemas/OutcomeBase'
                -
                    type: object
                    properties:
                        owner:
                            type: object
                            properties:
                                id:
                                    type: integer
                                    example: 447945
                                    description: 'Código da empresa emissora do romaneio'
