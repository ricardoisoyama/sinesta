openapi: 3.0.3
info:
    version: '2.0'
    title: Serviços
    description: |-
        Esta integração documenta todos os endpoints disponíveis para o módulo de **Serviços**.

        Você deve preencher o campo `subdominio` com o nome do domínio da transportadora providenciado pela equipe da Siimp

        Além disso, selecione o `ambiente` desejado para a API, onde:
        - `lannister` significa **PRODUÇÃO**
        - `dev-lannister` significa **HOMOLOGAÇÃO**

        Caso possua dúvidas sobre a configuração e parametrização de tokens e URLs da API,
        verifique a página principal da documentação em **[API REST](https://siimp.youtrack.cloud/articles/SUP-A-383)**

servers:
    - url: https://{subdominio}.{ambiente}.emitir.me
      variables:
          subdominio:
              default: subdominio_da_transportadora
          ambiente:
              default: lannister
              enum:
                  - 'lannister'
                  - 'dev-lannister'
tags:
    - name: service
      description: Rota para cadastramento, atualização e inserção de Serviços
security:
    - ApiKeyAuth: []
paths:
    # CRUD
    /services/search:
        get:
            tags:
                - service
            description: 'Busca Serviços com base nos filtros informados'
            operationId: 'search'
            parameters:
                - $ref: '#/components/parameters/idParam'
                - $ref: '#/components/parameters/idsParam'
                - $ref: '#/components/parameters/nameParam'
                - $ref: '#/components/parameters/abbreviationParam'
                - $ref: '#/components/parameters/serviceCategoryNameParam'
                - $ref: '#/components/parameters/clientNameParam'
                - $ref: '#/components/parameters/createdAtParam'
                - $ref: '#/components/parameters/createdFromParam'
                - $ref: '#/components/parameters/createdToParam'
                - $ref: '#/components/parameters/updatedFromParam'
                - $ref: '#/components/parameters/updatedToParam'
                - $ref: '#/components/parameters/updatedAtParam'
                - $ref: '#/components/parameters/pageParam'
            responses:
                '200':
                    $ref: '#/components/responses/SearchSuccess'
    /services/create:
        post:
            tags:
                - service
            description: 'Cria Serviço no sistema'
            operationId: 'create'
            requestBody:
                $ref: '#/components/requestBodies/CreateBody'
            responses:
                '200':
                    $ref: '#/components/responses/CreateSuccess'
    /services/update:
        post:
            tags:
                - service
            description: 'Atualiza Serviço no sistema'
            operationId: 'update'
            requestBody:
                $ref: '#/components/requestBodies/CreateBody'
            responses:
                '200':
                    $ref: '#/components/responses/UpdateSuccess'
components:
    # SEGURANCA
    securitySchemes:
        ApiKeyAuth:
            type: apiKey
            name: x-api-key
            in: header

    # PARAMETROS
    parameters:
        idParam:
            name: id
            in: query
            description: Realiza a busca pelo **ID** de Serviço. *A existência deste parâmetro funciona como um `find` para retorno de um único registro no banco de dados*
            schema:
                type: integer
        idsParam:
            name: ids
            in: query
            description: Realiza a busca pelos **IDS** de Serviços, separados por vírgula
            schema:
                type: integer
        nameParam:
            name: name
            in: query
            description: 'Realiza a busca pelo **NOME** do Serviço'
            schema:
                type: string
        abbreviationParam:
            name: abbreviation
            in: query
            description: 'Realiza a busca pela **ABREVIAÇÃO** do Serviço'
            schema:
                type: string
        createdAtParam:
            name: created_at
            in: query
            description: Realiza a busca pela **DATA DE CRIAÇÃO** do Serviço. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d H:i:s|relative'
        updatedAtParam:
            name: updated_at
            in: query
            description: Realiza a busca pela **DATA DE ATUALIZAÇÃO** do Serviço. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d H:i:s|relative'
        clientNameParam:
            name: client_name
            in: query
            description: 'Realiza a busca pelo **NOME DO CLIENTE** do Serviço'
            schema:
                type: string
        serviceCategoryNameParam:
            name: service_category_name
            in: query
            description: 'Realiza a busca pelo **NOME DA CATEGORIA** do Serviço'
            schema:
                type: string
        createdFromParam:
            name: created_from
            in: query
            description: Realiza a busca pela **DATA INICIAL DE CRIAÇÃO** do Serviço. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d H:i:s|relative'
        createdToParam:
            name: created_to
            in: query
            description: Realiza a busca pela **DATA FINAL DE CRIAÇÃO** do Serviço. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d H:i:s|relative'
        updatedFromParam:
            name: updated_from
            in: query
            description: Realiza a busca pela **DATA INICIAL DE ATUALIZAÇÃO** do Serviço. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d H:i:s|relative'
        updatedToParam:
            name: updated_to
            in: query
            description: Realiza a busca pela **DATA FINAL DE ATUALIZAÇÃO** do Serviço. Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d H:i:s|relative'
        pageParam:
            name: page
            in: query
            description: Paginação dos resultados
            schema:
                type: integer

    # CORPO DE REQUISICOES
    requestBodies:
        CreateBody:
            description: 'Este corpo será utilizado para criação ou atualização de Serviço'
            required: true
            content:
              application/json:
                  schema:
                      $ref: '#/components/schemas/Service'

    # RESPOSTAS
    responses:
        SearchSuccess:
            description: 'Resposta de sucesso, para consultas de Serviço'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/SearchResponse'
        CreateSuccess:
            description: 'Resposta de sucesso, para criação de Serviço'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CreateResponse'
        UpdateSuccess:
            description: 'Resposta de sucesso, para atualização de Serviço'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/UpdateResponse'

    # OBJETOS
    schemas:
        # RESPONSES
        SearchResponse:
            type: object
            properties:
                data:
                    type: array
                    items:
                        oneOf:
                            - $ref: '#/components/schemas/ServiceSimple'
                            - $ref: '#/components/schemas/ServiceAll'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                total:
                    type: integer
                    example: 90
                    description: 'Quantidade total de resultados'
        CreateResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/ServiceAll'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'Item criado com sucesso'
                    description: 'Mensagem de retorno'
        UpdateResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/Service'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'Item editado com sucesso'
                    description: 'Mensagem de retorno'

        # MODELS
        ## MODEL BASE
        ServiceBase:
            type: object
            properties:
                id:
                    type: integer
                    example: '3'
                    description: 'ID do Serviço'
                name:
                    type: string
                    example: 'Serviço de Borracharia'
                    description: 'Nome do Serviço'
                abbreviation:
                    type: string
                    example: 'BORR'
                    description: 'Abreviação do Serviço'
                value:
                    type: number
                    example: '120.59'
                    description: 'Valor do Serviço'
                obs:
                    type: string
                    example: ''
                    description: 'Observação do Serviço'
                created_at:
                    type: string
                    format: 'Y-m-d H:i:s'
                    example: '2023-03-30 11:00:00'
                    description: 'Data de Criação do Serviço'
                    readOnly: true
                updated_at:
                    type: string
                    format: 'Y-m-d H:i:s'
                    example: '2023-03-30 11:00:00'
                    description: 'Data de Atualização do Serviço'
                    readOnly: true

        ## MODEL PARA CRIAÇÃO E ATUALIZAÇÃO
        Service:
            allOf:
                - $ref: '#/components/schemas/ServiceBase'
                - type: object
                  properties:
                      client:
                          type: object
                          description: 'Cliente do Serviço'
                          properties:
                            id:
                                type: integer
                                example: '123'
                                description: 'ID do Cliente do Serviço'
                            name:
                                type: string
                                example: 'JOSE DA SILVA'
                                description: 'Nome do Cliente do Serviço'
                                readOnly: true
                      categorization:
                          type: object
                          description: 'Categorização do Serviço'
                          properties:
                              id:
                                  type: integer
                                  example: '274'
                                  description: 'ID da Categorização do Serviço'
                              name:
                                  type: string
                                  example: 'Serviço de Mecânica Geral'
                                  description: 'Nome da Categorização do Serviço'
                                  readOnly: true
                      department:
                          type: object
                          description: 'Departamento do Serviço'
                          properties:
                              id:
                                  type: integer
                                  example: '5'
                                  description: 'ID do Departamento do Serviço'
                              name:
                                  type: string
                                  example: 'MECANICA'
                                  description: 'Nome do Departamento do Serviço'
                                  readOnly: true

        ## MODEL RETORNADA NA PESQUISA DE VARIOS ITEMS
        ServiceSimple:
            allOf:
                - $ref: '#/components/schemas/ServiceBase'
                - type: object
                  properties:
                      client:
                          type: object
                          description: 'Cliente do Serviço'
                          properties:
                              id:
                                  type: integer
                                  example: '123'
                                  description: 'ID do Cliente do Serviço'
                              name:
                                  type: string
                                  example: 'JOSE DA SILVA'
                                  description: 'Nome do Cliente do Serviço'
                                  readOnly: true
                      categorization:
                          type: object
                          description: 'Categorização do Serviço'
                          properties:
                              id:
                                  type: integer
                                  example: '274'
                                  description: 'ID da Categorização do Serviço'
                              name:
                                  type: string
                                  example: 'Serviço de Mecânica Geral'
                                  description: 'Nome da Categorização do Serviço'
                                  readOnly: true
                      department:
                          type: object
                          description: 'Departamento do Serviço'
                          properties:
                              id:
                                  type: integer
                                  example: '5'
                                  description: 'ID do Departamento do Serviço'
                              name:
                                  type: string
                                  example: 'MECANICA'
                                  description: 'Nome do Departamento do Serviço'
                                  readOnly: true

        ## MODEL RETORNADA NA PESQUISA DE SOMENTE 1 ITEMS
        ServiceAll:
            allOf:
                - $ref: '#/components/schemas/Service'
                - type: object
                  properties:
                      client:
                          type: object
                          description: 'Cliente do Serviço'
                          properties:
                              id:
                                  type: integer
                                  example: '123'
                                  description: 'ID do Cliente do Serviço'
                      categorization:
                          type: object
                          description: 'Categorização do Serviço'
                          properties:
                              id:
                                  type: integer
                                  example: '274'
                                  description: 'ID da Categorização do Serviço'
                      department:
                          type: object
                          description: 'Departamento do Serviço'
                          properties:
                              id:
                                  type: integer
                                  example: '5'
                                  description: 'ID do Departamento do Serviço'
