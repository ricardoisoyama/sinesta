                      references:
                          type: array
                          nullable: true
                          description: 'Notas de referência atreladas à NF-e (aba Notas de Referência).'
                          items:
                              type: object
                              properties:
                                  id:
                                      type: integer
                                      readOnly: true
                                      example: 4524
                                      description: 'ID da NF-e de referência (retornado pela API). Não é validado como campo de entrada em CreateForApiRequest.'
                                  key:
                                      type: string
                                      nullable: true
                                      maxLength: 100
                                      example: '35221243256171000199550010002713451756413099'
                                      description: 'Chave da NF-e de referência.'

                      histories:
                          type: array
                          nullable: true
                          readOnly: true
                          description: 'Histórico de eventos da NF-e.'
                          items:
                              type: object
                              properties:
                                  id:
                                      type: integer
                                      example: 1
                                      description: 'ID do evento.'
                                  message:
                                      type: string
                                      example: 'NF-e emitida com sucesso'
                                      description: 'Mensagem do histórico.'
                                  username:
                                      type: string
                                      nullable: true
                                      example: 'usuario_exemplo'
                                      description: 'Nome do usuário que registrou o histórico.'
                                  created_at:
                                      type: string
                                      format: 'Y-m-d H:i:s'
                                      example: '2026-07-23 14:16:00'
                                      description: 'Data do evento.'

        ## MODEL DE ATUALIZAÇÃO
        NfeUpdate:
            allOf:
                - $ref: '#/components/schemas/Nfe'
                - type: object
                  required:
                      - id
                  properties:
                      id:
                          type: integer
                          example: 5835909
                          description: 'ID da NF-e a ser atualizada. *(obrigatório)*'

        ## MODEL RETORNADA NA PESQUISA DE VÁRIOS ITEMS
        NfeSimple:
            allOf:
                - $ref: '#/components/schemas/Nfe'
                - type: object
                  properties:
                      qtd:
                          type: number
                          readOnly: true
                          example: 14625.37
                          description: 'Quantidade total de produtos da NF-e.'
                      weight:
                          type: number
                          readOnly: true
                          example: 1000.00
                          description: 'Peso bruto total da NF-e.'
                      issuer_name:
                          type: string
                          readOnly: true
                          example: 'SANTOS - ESTRELA LOGISTICA E TRANSPORTES'
                          description: 'Nome do emitente da NF-e.'
                      addressee_name:
                          type: string
                          readOnly: true
                          example: 'METSO BRASIL INDUSTRIA E COMERCIO LTDA'
                          description: 'Nome do destinatário da NF-e.'
                      transporter_name:
                          type: string
                          nullable: true
                          readOnly: true
                          example: 'Transportadora Exemplo LTDA'
                          description: 'Nome do transportador da NF-e.'

        ## MODEL RETORNADA NA PESQUISA DE UM ITEM
        NfeAll:
            allOf:
                - $ref: '#/components/schemas/NfeSimple'

        ## MODEL RETORNADA NA RESPOSTA DE CRIAÇÃO E ATUALIZAÇÃO
        NfeResponseCreateUpdate:
            allOf:
                - $ref: '#/components/schemas/Nfe'

        ## MODEL RETORNADA NA RESPOSTA DA EMISSÃO DA NF-E
        NfeResponseSend:
            allOf:
                - $ref: '#/components/schemas/Nfe'

        ## MODEL RETORNADA NA RESPOSTA DE CANCELAMENTO DA NF-E
        NfeResponseCancel:
            allOf:
                - $ref: '#/components/schemas/Nfe'
