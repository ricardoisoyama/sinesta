openapi: 3.0.3
info:
    version: '2.0'
    title: NF-e
    description: |-
        Esta integração documenta todos os endpoints disponíveis para o módulo de **NF-e**.

        Você deve preencher o campo `subdominio` com o nome do domínio da transportadora providenciado pela equipe da Siimp

        Além disso, selecione o `ambiente` desejado para a API, onde:
        - `lannister` significa **PRODUÇÃO**
        - `dev-lannister` significa **HOMOLOGAÇÃO**

        Caso possua dúvidas sobre a configuração e parametrização de tokens e URLs da API,
        verifique a página principal da documentação em **[API REST](https://siimp.youtrack.cloud/articles/SUP-A-383)**
servers:
    - url: https://{subdominio}.{ambiente}.emitir.me
      variables:
          subdominio:
              default: subdominio_da_transportadora
          ambiente:
              default: lannister
              enum:
                  - 'lannister'
                  - 'dev-lannister'
tags:
    - name: nf-emission
      description: Rota para gerenciamento de notas fiscais eletrônicas.
security:
    - ApiKeyAuth: []
paths:

    # GET
    /nf-emission/search:
        get:
            tags:
                - 'nf-emission'
            summary: Filtros de pesquisa para NF-es
            description: Busca NF-es com base nos filtros informados
            operationId: search
            parameters:
                - $ref: '#/components/parameters/idParam'
                - $ref: '#/components/parameters/idsParam'
                - $ref: '#/components/parameters/ownerIdParam'
                - $ref: '#/components/parameters/numberParam'
                - $ref: '#/components/parameters/keyParam'
                - $ref: '#/components/parameters/serieParam'
                - $ref: '#/components/parameters/addresseeIdParam'
                - $ref: '#/components/parameters/transporterIdParam'
                - $ref: '#/components/parameters/statusParam'
                - $ref: '#/components/parameters/issuePurposeParam'
                - $ref: '#/components/parameters/issuedAtParam'
                - $ref: '#/components/parameters/issuedFromParam'
                - $ref: '#/components/parameters/issuedToParam'
                - $ref: '#/components/parameters/createdAtParam'
                - $ref: '#/components/parameters/createdFromParam'
                - $ref: '#/components/parameters/createdToParam'
                - $ref: '#/components/parameters/updatedAtParam'
                - $ref: '#/components/parameters/updatedFromParam'
                - $ref: '#/components/parameters/updatedToParam'
                - $ref: '#/components/parameters/pageParam'
            responses:
                '200':
                    $ref: '#/components/responses/SearchSuccess'

    #POST
    /nf-emission/create:
        post:
            tags:
                - 'nf-emission'
            description: 'Cria uma NF-e no sistema'
            operationId: 'create'
            requestBody:
                $ref: '#/components/requestBodies/CreateBody'
            responses:
                '200':
                    $ref: '#/components/responses/CreateSuccess'

    /nf-emission/duplicate:
        post:
            tags:
                - 'nf-emission'
            description: 'Duplica uma NF-e no sistema'
            operationId: 'duplicate'
            requestBody:
                $ref: '#/components/requestBodies/duplicateBody'
            responses:
                '200':
                    $ref: '#/components/responses/DuplicateSuccess'

    /nf-emission/incapacitate:
        post:
            tags:
                - 'nf-emission'
            description: 'Inutiliza uma NF-e no sistema'
            operationId: 'incapacitate'
            requestBody:
                $ref: '#/components/requestBodies/IncapacitateBody'
            responses:
                '200':
                    $ref: '#/components/responses/IncapacitateSuccess'

    /nf-emission/update:
        post:
            tags:
                - 'nf-emission'
            description: 'Atualiza uma NF-e no sistema'
            operationId: 'update'
            requestBody:
                $ref: '#/components/requestBodies/UpdateBody'
            responses:
                '200':
                    $ref: '#/components/responses/UpdateSuccess'

    /nf-emission/send:
        post:
            tags:
                - 'nf-emission'
            description: 'Emite uma NF-e'
            operationId: 'send'
            requestBody:
                $ref: '#/components/requestBodies/SendBody'
            responses:
                '200':
                    $ref: '#/components/responses/SendSuccess'

    /nf-emission/cancel:
        post:
            tags:
                - 'nf-emission'
            description: 'Cancela uma NF-e'
            operationId: 'cancel'
            requestBody:
                $ref: '#/components/requestBodies/CancelBody'
            responses:
                '200':
                    $ref: '#/components/responses/CancelSuccess'

components:
    # SEGURANÇA
    securitySchemes:
        ApiKeyAuth:
            type: apiKey
            name: x-api-key
            in: header

    # PARÂMETROS
    parameters:
        idParam:
            name: id
            in: query
            description: >
                Realiza a busca pelo **ID** de uma NF-e.
                  *A existência deste parâmetro funciona como um `find` para retorno de um único registro no banco de dados*
            schema:
                type: integer
                minimum: 1
        idRequiredParam:
            name: id
            in: query
            required: true
            description: >
                Realiza a busca pelo **ID** de uma NF-e.
                  *A existência deste parâmetro funciona como um `find` para retorno de um único registro no banco de dados*
            schema:
                type: integer
                minimum: 1
        idsParam:
            name: ids
            in: query
            description: >
                Realiza a busca pelos **IDS** das NF-es, separados por vírgula.
            style: form
            explode: false
            schema:
                type: array
                items:
                    type: integer
        ownerIdParam:
            name: owner_id
            in: query
            description: >
                Realiza a busca pelo **CÓDIGO DA EMPRESA**.
            schema:
                type: integer
        numberParam:
            name: number
            in: query
            description: >
                Realiza a busca pelo **NÚMERO**.
            schema:
                type: integer
        keyParam:
            name: key
            in: query
            description: Realiza a busca pela **CHAVE DE ACESSO**.
            required: false
            schema:
                type: string
                pattern: '[A-Z0-9]'
                minLength: 44
                maxLength: 44
        serieParam:
            name: serie
            in: query
            description: Realiza a busca pela **SÉRIE** da NF-e.
            required: false
            schema:
                type: integer
        addresseeIdParam:
            name: addressee_id
            in: query
            description: Realiza a busca pelo **ID DO DESTINATÁRIO** da NF-e.
            required: false
            schema:
                type: integer
        transporterIdParam:
            name: transporter_id
            in: query
            description: Realiza a busca pelo **ID DO TRANSPORTADOR** da NF-e.
            required: false
            schema:
                type: integer
        statusParam:
            name: status
            in: query
            description: >
                Realiza a busca pelo **STATUS** da NF-e:
                  - `0` = Cadastrado
                  - `1` = Emitido
                  - `2` = Cancelado
                  - `3` = Processando
                  - `4` = Inutilizado
            required: false
            schema:
                type: integer
                enum:
                    - 0
                    - 1
                    - 2
                    - 3
                    - 4
        issuePurposeParam:
            name: issue_purpose
            in: query
            required: false
            description: >
                Realiza a busca pela **FINALIDADE** da NF-e:
                  - `1` = Normal
                  - `2` = Complementar
                  - `3` = Nota de Ajuste
                  - `4` = Devolução
                  - `5` = Nota de Débito
                  - `6` = Nota de Crédito
            schema:
                type: integer
                enum:
                    - 1
                    - 2
                    - 3
                    - 4
                    - 5
                    - 6
        issuedAtParam:
            name: issued_at
            in: query
            description: Realiza a busca pela **DATA DE EMISSÃO** da NF-e.
                Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        issuedFromParam:
            name: issued_from
            in: query
            description: Realiza a busca pela **DATA DE EMISSÃO INICIAL** da NF-e.
                Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        issuedToParam:
            name: issued_to
            in: query
            description: Realiza a busca pela **DATA DE EMISSÃO FINAL** da NF-e.
                Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        createdAtParam:
            name: created_at
            in: query
            description: Realiza a busca pela **DATA DE CRIAÇÃO** da NF-e.
                Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        createdFromParam:
            name: created_from
            in: query
            description: Realiza a busca pela **DATA DE CRIAÇÃO INICIAL** da NF-e.
                Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        createdToParam:
            name: created_to
            in: query
            description: Realiza a busca pela **DATA DE CRIAÇÃO FINAL** da NF-e.
                Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        updatedAtParam:
            name: updated_at
            in: query
            description: Realiza a busca pela **DATA DA ÚLTIMA ATUALIZAÇÃO** da NF-e.
                Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        updatedFromParam:
            name: updated_from
            in: query
            description: Realiza a busca pela **DATA DA ÚLTIMA ATUALIZAÇÃO INICIAL** da NF-e.
                Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        updatedToParam:
            name: updated_to
            in: query
            description: Realiza a busca pela **DATA DA ÚLTIMA ATUALIZAÇÃO FINAL** da NF-e.
                Aceita **[formatos de datas relativas](https://siimp.youtrack.cloud/articles/SUP-A-382#parametros-de-datas-de-formatos-relativos)**
            schema:
                type: string
                format: 'Y-m-d|relative'
        pageParam:
            name: page
            in: query
            description: Paginação dos resultados.
            required: false
            schema:
                type: integer
                minimum: 1
                default: 1
        danfeLayoutParam:
            name: layout
            in: query
            description: >
                Especifica o **TIPO DE LAYOUT** do arquivo PDF.
                Valores possíveis:
                  - `0`: DANFE Retrato
                  - `1`: DANFE Paisagem
                  - `2`: DANFE Simplificado
            required: true
            schema:
                type: integer
                enum:
                    - 0
                    - 1
                    - 2

    # CORPO DE REQUISIÇÕES
    requestBodies:
        CreateBody:
            description: 'Este corpo será utilizado para criação de uma NF-e.'
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/Nfe'
        UpdateBody:
            description: 'Este corpo será utilizado para atualização de uma NF-e. O campo "id" é obrigatório.'
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/NfeUpdate'
        SendBody:
            description: 'Este corpo será utilizado para emissão de uma NF-e.'
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/SendRequest'
        duplicateBody:
            description: 'Este corpo será utilizado para a duplicação de uma NF-e.'
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/DuplicateRequest'
        IncapacitateBody:
            description: 'Este corpo será utilizado para inutilização'
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/IncapacitateRequest'
        CancelBody:
            description: 'Este corpo será utilizado para o cancelamento de uma NF-e.'
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CancelRequest'

    # RESPOSTAS
    responses:
        SearchSuccess:
            description: 'Resposta de sucesso, para consultas de NF-es.'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/SearchResponse'
        CreateSuccess:
            description: 'Resposta de sucesso, para criação de NF-es.'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CreateResponse'
        IncapacitateSuccess:
            description: 'Resposta de sucesso, para inutilização de NF-es.'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/IncapacitateResponse'
        DuplicateSuccess:
            description: 'Resposta de sucesso, para duplicação de NF-es.'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CreateResponse'
        UpdateSuccess:
            description: 'Resposta de sucesso, para atualização de NF-es.'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/UpdateResponse'
        SendSuccess:
            description: 'Resposta de sucesso, para emissão de NF-es.'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/SendResponse'
        CancelSuccess:
            description: 'Resposta de sucesso, para cancelamento de NF-es.'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CancelResponse'

    # OBJETOS
    schemas:

        # REQUESTS
        SendRequest:
            type: object
            properties:
                id:
                    type: integer
                    example: '123456'
                    description: 'ID da NF-e.'
        IncapacitateRequest:
            type: object
            properties:
                id:
                    type: integer
                    example: '123456'
                    description: 'ID da NF-e.'
                reason:
                    type: string
                    example: 'Cancelando por motivos XYZ.'
                    description: 'Justificativa do cancelamento da NF-e.'
        DuplicateRequest:
            type: object
            properties:
                id:
                    type: integer
                    example: '123456'
                    description: 'ID da NF-e.'
        CancelRequest:
            type: object
            properties:
                id:
                    type: integer
                    example: '123456'
                    description: 'ID da NF-e.'
                reason:
                    type: string
                    nullable: false
                    minLength: 20
                    example: 'Cancelando por motivos XYZ.'
                    description: 'Justificativa do cancelamento da NF-e.'

        # RESPONSES
        SearchResponse:
            type: object
            properties:
                data:
                    type: array
                    items:
                        oneOf:
                            - $ref: '#/components/schemas/NfeSimple'
                            - $ref: '#/components/schemas/NfeAll'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                total:
                    type: integer
                    example: 90
                    description: 'Quantidade total de resultados'
        CreateResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/NfeResponseCreateUpdate'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'Item criado com sucesso'
                    description: 'Mensagem de retorno'
        IncapacitateResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/NfeResponseCreateUpdate'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'NF-e inutilizada com sucesso'
                    description: 'Mensagem de retorno'
        UpdateResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/NfeResponseCreateUpdate'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação'
                message:
                    type: string
                    example: 'Item editado com sucesso'
                    description: 'Mensagem de retorno'
        SendResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/NfeResponseSend'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação.'
                message:
                    type: string
                    example: 'NF-e emitida com sucesso!'
                    description: 'Mensagem de retorno.'
        CancelResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/NfeResponseCancel'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação.'
                message:
                    type: string
                    example: 'NF-e cancelada com sucesso!'
                    description: 'Mensagem de retorno.'

        # MODELS
        ## MODEL BASE
        NfeBase:
            type: object
            properties:
                id:
                    type: integer
                    example: 2
                    description: 'ID. *(somente informá-lo em caso de atualização de dados)*'
                owner_id:
                    type: integer
                    nullable: false
                    example: 192734
                    description: 'Código da empresa (Empresa).'
                serie:
                    type: integer
                    example: 1
                    default: 1
                    description: 'Série da NF-e.'
                number:
                    type: integer
                    readOnly: true
                    example: 123456789
                    description: 'Número da NF-e'
                ncfop:
                    type: string
                    example: '2222'
                    nullable: true
                    description: 'CFOP predominante da NF-e.'
                document_type:
                    type: integer
                    example: 1
                    description: >
                        **TIPO** da NF-e:
                          - `0` = Entrada
                          - `1` = Saída
                    enum:
                        - 0
                        - 1
                status:
                    type: integer
                    format: small
                    readOnly: true
                    example: 0
                    description: >
                        Tipo do Status:
                          - `0` = Cadastrado
                          - `1` = Emitido
                          - `2` = Em Trânsito
                          - `3` = Entregue
                          - `4` = Cancelado
                          - `5` = Não Entregue
                          - `6` = Inutilizado
                    enum:
                        - 0
                        - 1
                        - 2
                        - 3
                        - 4
                        - 5
                        - 6
                key:
                    type: string
                    minLength: 44
                    maxLength: 44
                    pattern: '[A-Z0-9]'
                    example: '35221243256171000199550010002713451756413099'
                    readOnly: true
                    description: 'Chave de acesso da NF-e.'
                description_operation:
                    type: string
                    maxLength: 60
                    example: 'Venda de mercadoria'
                    description: 'Natureza da Operação.'
                issue_purpose:
                    type: integer
                    example: 1
                    description: >
                        **FINALIDADE** da NF-e:
                          - `1` = Normal
                          - `2` = Complementar
                          - `3` = Nota de Ajuste
                          - `4` = Devolução
                          - `5` = Nota de Crédito
                          - `6` = Nota de Débito
                    enum:
                        - 1
                        - 2
                        - 3
                        - 4
                        - 5
                        - 6
                freight:
                    type: integer
                    example: 0
                    description: >
                        **FRETE** (modalidade de frete) da NF-e:
                          - `0` = Por conta do emitente (CIF)
                          - `1` = Por conta do destinatário (FOB)
                          - `2` = Por conta de terceiros
                          - `3` = Transporte próprio por conta do remetente
                          - `4` = Transporte próprio por conta do destinatário
                          - `9` = Sem transporte
                    enum:
                        - 0
                        - 1
                        - 2
                        - 3
                        - 4
                        - 9
                payment_form:
                    type: integer
                    example: 1
                    description: >
                        **FORMA DE PAGAMENTO** da NF-e:
                          - `1` = Dinheiro
                          - `2` = Cheque
                          - `3` = Cartão de Crédito
                          - `4` = Cartão de Débito
                          - `5` = Crédito Loja
                          - `10` = Vale Alimentação
                          - `11` = Vale Refeição
                          - `12` = Vale Presente
                          - `13` = Vale Combustível
                          - `14` = Duplicata Mercantil
                          - `15` = Boleto Bancário
                          - `90` = Sem Pagamento
                          - `99` = Outros
                location_type:
                    type: integer
                    nullable: true
                    example: 1
                    description: >
                        **INDICADOR DE DESTINO** da operação (Ind. Dest):
                          - `1` = Operação interna
                          - `2` = Operação interestadual
                          - `3` = Operação com exterior
                    enum:
                        - 1
                        - 2
                        - 3
                icms_free:
                    type: integer
                    default: 0
                    example: 0
                    description: >
                        ICMS Isento/Livre:
                          - `0` = Não
                          - `1` = Sim
                    enum:
                        - 0
                        - 1
                warehouse_allocate:
                    type: integer
                    default: 1
                    example: 1
                    description: >
                        Alocar em Depósito:
                          - `0` = Não
                          - `1` = Sim
                    enum:
                        - 0
                        - 1
                debt_type:
                    type: integer
                    nullable: true
                    example: 1
                    description: 'Tipo de Débito (Reforma Tributária).'
                credit_type:
                    type: integer
                    nullable: true
                    example: 1
                    description: 'Tipo de Crédito (Reforma Tributária).'
                government_type:
                    type: integer
                    nullable: true
                    example: 1
                    description: 'Ente Governamental (Reforma Tributária).'
                government_operation_type:
                    type: integer
                    nullable: true
                    example: 1
                    description: 'Operação Governamental (Reforma Tributária).'
                government_reductor:
                    type: number
                    nullable: true
                    example: 0.00
                    description: 'Redutor (percentual) aplicado à operação governamental.'
                vehicle_traction_license_plate:
                    type: string
                    nullable: true
                    minLength: 7
                    maxLength: 7
                    example: 'AMD0X12'
                    description: 'Placa do veículo de tração vinculado à NF-e.'
                vehicle_traction_uf:
                    type: string
                    nullable: true
                    minLength: 2
                    maxLength: 2
                    example: 'SP'
                    description: 'UF da placa do veículo de tração vinculado à NF-e.'
                obs:
                    type: string
                    nullable: true
                    example: 'Observação da NF-e'
                    description: 'Observações da NF-e.'
                addressee:
                    type: object
                    description: 'Dados do destinatário da NF-e.'
                    properties:
                        name:
                            type: string
                            readOnly: true
                            example: 'METSO BRASIL INDUSTRIA E COMERCIO LTDA'
                            description: 'Nome do destinatário da NF-e.'
                        cpf:
                            type: string
                            pattern: '[0-9]'
                            minLength: 11
                            maxLength: 11
                            description: 'CPF do destinatário da NF-e *(informar este ou o campo CNPJ)*'
                        cnpj:
                            type: string
                            pattern: '[A-Z0-9]'
                            minLength: 14
                            maxLength: 14
                            description: 'CNPJ do destinatário da NF-e *(informar este ou o campo CPF)*'
                transporter:
                    type: object
                    nullable: true
                    description: 'Dados do transportador da NF-e *(dados opcionais)*'
                    properties:
                        cpf:
                            type: string
                            pattern: '[0-9]'
                            minLength: 11
                            maxLength: 11
                            description: 'CPF do transportador da NF-e *(informar este ou o campo CNPJ)*'
                        cnpj:
                            type: string
                            pattern: '[A-Z0-9]'
                            minLength: 14
                            maxLength: 14
                            description: 'CNPJ do transportador da NF-e *(informar este ou o campo CPF)*'
                issued_at:
                    type: string
                    format: 'Y-m-d'
                    example: '2026-07-23'
                    description: 'Data de emissão da NF-e.'
                expected_delivery:
                    type: string
                    format: 'Y-m-d'
                    nullable: true
