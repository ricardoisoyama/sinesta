                    example: '2023-04-25'
                    description: 'Data para a retirada da coleta'
                available:
                    type: object
                    nullable: true
                    description: 'Dados do horário'
                    properties:
                        from:
                            type: string
                            format: 'H:i'
                            example: '11:30'
                            description: 'Horário de início da retirada'
                        to:
                            type: string
                            format: 'H:i'
                            example: '21:30'
                            description: 'Horário final da retirada'
                lunch:
                    type: object
                    nullable: true
                    description: 'Dados do horário do almoço'
                    properties:
                        from:
                            type: string
                            format: 'H:i'
                            example: '12:00'
                            description: 'Horário de início do almoço'
                        to:
                            type: string
                            format: 'H:i'
                            example: '13:00'
                            description: 'Horário final do almoço'
                diary_obs:
                    type: string
                    maxLength: 255
                    example: 'Observação diária'
                    description: 'Observação diária'
