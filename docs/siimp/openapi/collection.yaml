                    type: string
                    maxLength: 20
                    example: 'Arapongas'
                    description: 'Cidade do local retirada/destinatário'
                name:
                    type: integer
                    example: 'TESTE MOVEIS LTDA'
                    description: 'Descrição do Nome da empresa para retirada/destinatário'
        CollectionCategoryBase:
            type: object
            properties:
                id: 
                    type: integer
                    example: 4
                    description: 'ID da categoria'
        CollectionGoods:
            type: object
            properties:
