                        driver_name:
                            type: string
                            maxLength: 50
                            example: 'Andre Souza'
                            description: 'Nome do Motorista'
                        print:
                            type: object
                            nullable: true
                            description: 'Impressão da Ordem de Coleta'
                            properties:
                                last:
                                    type: string
                                    format: 'Y-m-d H:i:s'
                                    example: '2023-04-20 15:00:00'
                                    description: 'Horário da última impressão da ordem de coleta'
                                user:
                                    type: string
                                    maxLength: 50
                                    example: 'suportesiimp'
                                    description: 'Usuário que fez a última impressão'
                        trailer:
                            type: object
                            nullable: true
                            description: 'Placas dos reboques da ordem de coleta'
                            properties:
                                plate1:
                                    type: string
                                    maxLength: 7
                                    example: 'ACB4578'
                                    description: 'Placa do reboque 1 da ordem de coleta'
                                plate2:
                                    type: string
                                    maxLength: 7
                                    example: 'PFD9630'
                                    description: 'Placa do reboque 2 da ordem de coleta'
                                plate3:
                                    type: string
                                    maxLength: 7
                                    example: 'AQR7801'
                                    description: 'Placa do reboque 3 da ordem de coleta'       
        CollectionAll:
            allOf:
                -
                    $ref: '#/components/schemas/CollectionBase'
                -
                    $ref: '#/components/schemas/CollectionPersons'
                -
                    $ref: '#/components/schemas/CollectionAggregates'
                -
                    $ref: '#/components/schemas/CollectionCategory'

        CollectionAggregates:    
            type: object
            properties:
                histories:
                    type: array
                    description: 'Histórico de alterações dos dados da Ordem de Coleta'
                    nullable: true
                    items:
                        type: object
                        properties:
                            id:
                                type: integer
                                example: 1425
                                description: 'ID do histórico'
                            message:
                                type: string
                                maxLength: 255
                                example: 'Status da Ordem de Coleta modificado'
                                description: 'Mensagem relacionada com a ação na ordem de coleta'
                            collection_id:
                                type: integer
                                example: 2536
                                description: 'ID da ordem de coleta'
                            username:
                                type: string
                                maxLength: 20
                                example: 'suportesiimp'
                                description: 'Nome do usuário que realizou a alteração na ordem de coleta'
                            created_at:
                                type: string
                                format: 'Y-m-d H:i:s'
                                example: '2023-04-16 19:21:01'
                                description: 'Data de criação do histórico da Ordem de Coleta'
                                readOnly: true
                            updated_at:
                                type: string
                                format: 'Y-m-d H:i:s'
                                example: '2023-04-16 19:21:01'
                                description: 'Data de atualização do histórico da Ordem de Coleta'
                                readOnly: true
                items:
                    type: array
                    nullable: true
                    description: 'Items da Ordem de Coleta'
                    items:
                        allOf:
                          - 
                                $ref: '#/components/schemas/CollectionGoods'
                          -  
                            type: object
                            properties:
                                id:
                                    type: integer
                                    example: 152
                                    description: 'ID do item da Ordem de Coleta'
                                length: 
                                    type: number
                                    example: '0.0'
                                    description: 'Profundidade do item da ordem de coleta'
                                description:
                                    type: string
                                    example: 'Item'
                                    description: 'Descrição do item da ordem de coleta'
                                nf_number:
                                    type: integer
                                    example: 4125
                                    description: 'Número da nota fiscal do item'
                                collection_id:
                                    type: integer
                                    example: 15
                                    description: 'ID da ordem de coleta vinculada ao item'
                                created_at:
                                    type: string
                                    format: 'Y-m-d H:i:s'
                                    example: '2023-05-19 18:30:01'
                                    description: 'Data de criação do item.'
                                    readOnly: true
                                updated_at:
                                    type: string
                                    format: 'Y-m-d H:i:s'
                                    example: '2023-05-19 18:30:01'
                                    description: 'Data de atualização do item'
                                    readOnly: true
                driver:
                    allOf:
                        -     
                            $ref: '#/components/schemas/CollectionPersons'
                requestor:
                    allOf:
                        -
                            $ref: '#/components/schemas/CollectionPersons'
                retired:
                    allOf:  
                        - 
                            $ref: '#/components/schemas/CollectionPersons'
                        -
                            $ref: '#/components/schemas/CollectionScheduling'      
                addressee:
                    allOf:
                        -   
                            $ref: '#/components/schemas/CollectionPersons'
        
        # COMPONENTES DUPLICADOS
        CollectionFieldsRetiredAddressee:
            type: object
