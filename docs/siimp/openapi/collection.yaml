                    maxLength: 15
                    minLength: 15
                    description: 'Latitude'
                longitude:
                    type: string
                    example: '-11.11111111111'
                    maxLength: 15
                    minLength: 15
                    description: 'Longitude'
        CollectionScheduling:
            type: object
            properties:
                limit_date:
                    type: string
