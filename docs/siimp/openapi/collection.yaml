                              - 
                                    $ref: '#/components/schemas/CollectionFieldsRetiredAddressee'
                              -     
                                    type: object
                                    properties:
                                        limit_date:
                                            type: string
                                            format: 'Y-m-d'
                                            example: '2023-04-20'
                                            description: 'Data limite para a retirada da coleta'
                        addressee:
                            type: object
                            description: 'Destinatário da Ordem de Coleta'
                            allOf:
                              - 
                                    $ref: '#/components/schemas/CollectionFieldsRetiredAddressee'
                        category:
                            type: object
                            nullable: true
                            description: 'Categoria da Ordem de Coleta'
                            properties:
                                id_1: 
                                    type: integer
                                    example: 4
                                    description: 'ID da Categoria 1'
                                name_1:
                                    type: string
                                    example: 'espuma'
                                    description: 'Nome da Categoria 1'
                                id_2: 
                                    type: integer
                                    example: 4
                                    description: 'ID da Categoria 2'
                                name_2:
                                    type: string
                                    example: 'vaículo'
                                    description: 'Nome da Categoria 2'
                                id_3: 
                                    type: integer
                                    example: 4
                                    description: 'ID da Categoria 3'
                                name_3:
                                    type: string
                                    example: 'redespacho'
                                    description: 'Nome da Categoria 3'
                                id_4: 
                                    type: integer
                                    example: 4
                                    description: 'ID da Categoria 4'
                                name_4:
                                    type: string
                                    example: 'borracha'
                                    description: 'Nome da Categoria 4'
                        outcome:
                            type: object
                            description: 'Romaneio vinculado a Ordem de Coleta'
                            properties:
                                id:
                                    type: integer
                                    example: 5
                                    description: 'ID do Romaneio vinculado à Ordem de Coleta'
                                number:
                                    type: integer
                                    example: 12598
                                    description: 'Número do Romaneio Vinculado à Ordem de Coleta'
                                type:
                                    type: integer
                                    example: 1
                                    description: 'Tipo do Romaneio vinculado à Ordem de Coleta'
                        quotation:
                            type: object
                            description: 'Cotação da Ordem de Coleta *(informar a cotação quando quiser preencher os campos com base na cotação)*'
                            properties:
                                id:
                                    type: integer
                                    example: 51236
                                    description: 'ID da Cotação'
                                number:
                                    type: integer
                                    example: 5
                                    description: 'Número da Cotação'
                        email:
                            type: string
                            format: email
                            nullable: true
                            maxLength: 255
