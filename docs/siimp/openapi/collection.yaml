                    example: '14879852236547893103249799520365789485059526'
                    description: 'Chave de uma Nota Fiscal'
                number:
                    type: integer
                    example: 125634
                    description: 'Número de uma Nota Fiscal'
                total:
                    type: number
                    example: '150.88'
                    description: 'Valor total de uma Nota Fiscal'
        CollectionCategory:
            type: object
            description: 'Dados relacionados a categoria'
            properties:
                category1:
