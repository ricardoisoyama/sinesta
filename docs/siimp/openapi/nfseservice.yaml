openapi: 3.0.3
info:
    version: '2.0'
    title: Serviços de NFS-e
    description: |-
        Esta integração documenta todos os endpoints disponíveis para o módulo de **Serviços de NFS-e**.

        Você deve preencher o campo `subdominio` com o nome do domínio da transportadora providenciado pela equipe da Siimp

        Além disso, selecione o `ambiente` desejado para a API, onde:
        - `lannister` significa **PRODUÇÃO**
        - `dev-lannister` significa **HOMOLOGAÇÃO**

        Caso possua dúvidas sobre a configuração e parametrização de tokens e URLs da API,
        verifique a página principal da documentação em **[API REST](https://siimp.youtrack.cloud/articles/SUP-A-383)**

servers:
    - url: https://{subdominio}.{ambiente}.emitir.me
      variables:
          subdominio:
              default: subdominio_da_transportadora
          ambiente:
              default: lannister
              enum:
                  - 'lannister'
                  - 'dev-lannister'
tags:
    - name: nfs-services
      description: Rotas para buscas, inserções e atualizações de Serviços de NFS-e.
security:
    - ApiKeyAuth: []
paths:

    # CRUD
    /nfse-services/search:
        get:
            tags:
                - 'nfs-services'
            description: 'Busca os serviços de NFS-e com base nos filtros informados.'
            operationId: 'search'
            parameters:
                -   $ref: '#/components/parameters/idParam'
                -   $ref: '#/components/parameters/idsParam'
                -   $ref: '#/components/parameters/ownerIdParam'
                -   $ref: '#/components/parameters/serviceDescriptionParam'
                -   $ref: '#/components/parameters/isActiveParam'
            responses:
                '200':
                    $ref: '#/components/responses/SearchSuccess'

    /nfse-services/create:
        post:
            tags:
                - 'nfs-services'
            description: 'Cria um serviço de NFS-e no sistema'
            operationId: 'create'
            requestBody:
                $ref: '#/components/requestBodies/CreateBody'
            responses:
                '200':
                    $ref: '#/components/responses/CreateSuccess'

    /nfse-services/update:
        post:
            tags:
                - 'nfs-services'
            description: 'Atualiza um serviço de NFS-e no sistema'
            operationId: 'update'
            requestBody:
                $ref: '#/components/requestBodies/CreateBody'
            responses:
                '200':
                    $ref: '#/components/responses/UpdateSuccess'

components:

    # SEGURANCA
    securitySchemes:
        ApiKeyAuth:
            type: apiKey
            name: x-api-key
            in: header

    # PARAMETROS
    parameters:
        idParam:
            name: id
            in: query
            description: >
                Realiza a busca pelo **ID** de um serviço de NFS-e.
                  *A existência deste parâmetro funciona como um `find` para retorno de um único registro no banco de dados*
            schema:
                type: integer
                minimum: 1
        idsParam:
            name: ids
            in: query
            description: >
                Realiza a busca pelos **IDS** dos serviços das NFS-es, separados por vírgula.
            style: form
            explode: false
            schema:
                type: array
                items:
                    type: integer
        ownerIdParam:
            name: owner_id
            in: query
            description: >
                Realiza a busca pela **EMPRESA** de um serviço de NFS-e.
            schema:
                type: integer
        serviceDescriptionParam:
            name: service_description
            in: query
            description: >
                Realiza a busca pela **DESCRIÇÃO** de um serviço de NFS-e.
            schema:
                type: string
        isActiveParam:
            name: is_active
            in: query
            description: >
                Realiza a busca pela **STATUS** de um serviço de NFS-e.
                  - `0` = Não
                  - `1` = Sim
            schema:
                type: integer
                enum:
                    - 0
                    - 1

    # CORPO DE REQUISICOES
    requestBodies:
        CreateBody:
            description: 'Este corpo será utilizado para criação ou atualização de um serviço de NFS-e.'
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/NFSeService'

    responses:
        SearchSuccess:
            description: 'Resposta de sucesso, para consultas de serviços de NFS-e.'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/SearchResponse'
        CreateSuccess:
            description: 'Resposta de sucesso, para criação de um serviço de NFS-e.'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CreateResponse'
        UpdateSuccess:
            description: 'Resposta de sucesso, para atualização de um serviço de NFS-e.'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/UpdateResponse'

    # OBJETOS
    schemas:

        # RESPONSES
        SearchResponse:
            type: object
            properties:
                data:
                    type: array
                    items:
                        oneOf:
                            - $ref: '#/components/schemas/NFSeService'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação.'
                total:
                    type: integer
                    example: 90
                    description: 'Quantidade total de resultados.'
        CreateResponse:
            type: object
            properties:
                data:
                    type: array
                    items:
                        oneOf:
                            - $ref: '#/components/schemas/NFSeService'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação.'
                message:
                    type: string
                    example: 'Item inserido com sucesso'
                    description: 'Mensagem de retorno'
        UpdateResponse:
            type: object
            properties:
                data:
                    type: array
                    items:
                        oneOf:
                            - $ref: '#/components/schemas/NFSeService'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação.'
                message:
                    type: string
                    example: 'Item editado com sucesso'
                    description: 'Mensagem de retorno'

        # MODELS
        ## MODEL BASE
        NFSeServiceBase:
            type: object
            properties:
                id:
                    type: integer
                    example: 2
                    description: 'ID. *(somente informá-lo em caso de atualização de dados)*'
                owner_id:
                    type: integer
                    nullable: false
                    example: 192734
                    description: 'Código da empresa.'
                discount_on_net_total:
                    type: integer
                    nullable: false
                    example: 1
                    description: >
                        Descontar Imposto do Total:
                         - `0` = Não
                         - `1` = Sim
                is_active:
                    type: integer
                    nullable: false
                    example: 1
                    description: >
                        Ativo?:
                         - `0` = Não
                         - `1` = Sim
                created_at:
                    type: string
                    format: 'Y-m-d H:i:s'
                    readOnly: true
                    example: '2023-12-27 18:58:09'
                    description: 'Data de criação do serviço.'
                updated_at:
                    type: string
                    format: 'Y-m-d H:i:s'
                    readOnly: true
                    example: '2023-12-27 18:58:09'
                    description: 'Data de criação do serviço.'

        NFSeService:
            allOf:
                -   $ref: '#/components/schemas/NFSeServiceBase'
                -   type: object
                    properties:
                        transparency_law:
                            type: object
                            description: 'Lei da Transparência.'
                            properties:
                                taxes_rate:
                                    type: number
                                    nullable: true
                                    example: "16.06"
                                    description: 'Alíquota.'
                                taxes_source:
                                    type: string
                                    nullable: true
                                    example: "CONFORME LEI Nº 12.741/2012--FONTE TABELA IBPT 16,06%"
                                    description: 'Fonte.'
                        taxe_rates_and_deductions:
                            type: object
                            description: 'Alíquotas e Retenções.'
                            properties:
                                iss_rate:
                                    type: number
                                    nullable: false
                                    example: "3.000"
                                    description: '% ISS.'
                                cofins_rate:
                                    type: number
                                    nullable: true
                                    example: "4.000"
                                    description: '% CONFIS.'
                                pis_rate:
                                    type: number
                                    nullable: true
                                    example: "5.000"
                                    description: '% PIS.'
                                csll_rate:
                                    type: number
                                    nullable: true
                                    example: "3.000"
                                    description: '% CSLL.'
                                ir_rate:
                                    type: number
                                    nullable: true
                                    example: "2.000"
                                    description: '% IR.'
                                inss_rate:
                                    type: number
                                    nullable: true
                                    example: "1.000"
                                    description: '% INSS.'
                        tax_information:
                            type: object
                            description: 'Informações Fiscais do Serviço.'
                            properties:
                                service_code:
                                    type: string
                                    nullable: false
                                    example: '16.01'
                                    description: 'Cód. Item do Serviço.'
                                service_description:
                                    type: string
                                    nullable: false
                                    example: 'SERVIÇOS DE TRANSPORTE DE NATUREZA MUNICIPAL'
                                    description: 'Descrição da Atividade.'
                                city_tax_code:
                                    type: string
                                    nullable: true
                                    example: "4930201"
                                    description: 'Cód. Tributação Municipal.'
                                cnae_code:
                                    type: string
                                    nullable: true
                                    example: '1359600'
                                    description: 'CNAE de Atividade.'
                                nbs_code:
                                    type: string
                                    nullable: true
                                    example: '101011100'
                                    description: 'Código NBS.'







