openapi: 3.0.3
info:
    version: '1.0'
    title: Tipos de Agendamento
    description: |-
        Esta integração documenta todos os endpoints disponíveis para o módulo de **TIPOS DE AGENDAMENTO**.

        Você deve preencher o campo `subdominio` com o nome do domínio da transportadora providenciado pela equipe da Siimp

        Além disso, selecione o `ambiente` desejado para a API, onde:
        - `lannister` significa **PRODUÇÃO**
        - `dev-lannister` significa **HOMOLOGAÇÃO**

        Caso possua dúvidas sobre a configuração e parametrização de tokens e URLs da API,
        verifique a página principal da documentação em **[API REST](https://siimp.youtrack.cloud/articles/SUP-A-383/API-REST)**
servers:
    - url: https://{subdominio}.{ambiente}.emitir.me
      variables:
          subdominio:
              default: subdominio_da_transportadora
          ambiente:
              default: lannister
              enum:
                  - 'lannister'
                  - 'dev-lannister'
tags:
    - name: appointment-types
      description: 'Rota para gerenciamento de Tipos de Agendamento.'
security:
    - ApiKeyAuth: []
paths:

    # GET
    /appointment-types/search:
        get:
            tags:
                - 'appointment-types'
            summary: 'Busca um Tipo de Agendamento no sistema'
            description: 'Busca um Tipo de Agendamento no sistema'
            operationId: search
            parameters:
                - $ref: '#/components/parameters/idParam'
                - $ref: '#/components/parameters/idsParam'
                - $ref: '#/components/parameters/nameParam'
                - $ref: '#/components/parameters/pageParam'
            responses:
                '200':
                    $ref: '#/components/responses/SearchSuccess'

    # POST
    /appointment-types/create:
        post:
            tags:
                - 'appointment-types'
            summary: 'Cria um Tipo de Agendamento no sistema'
            description: 'Cria um Tipo de Agendamento no sistema'
            operationId: 'create'
            requestBody:
                $ref: '#/components/requestBodies/CreateBody'
            responses:
                '200':
                    $ref: '#/components/responses/CreateSuccess'

    /appointment-types/update:
        post:
            tags:
                - 'appointment-types'
            summary: 'Atualiza um Tipo de Agendamento no sistema'
            description: 'Atualiza um Tipo de Agendamento no sistema'
            operationId: 'update'
            requestBody:
                $ref: '#/components/requestBodies/UpdateBody'
            responses:
                '200':
                    $ref: '#/components/responses/UpdateSuccess'

    /appointment-types/delete:
        post:
            tags:
                - 'appointment-types'
            summary: 'Exclui um Tipo de Agendamento no sistema'
            description: 'Exclui um Tipo de Agendamento no sistema'
            operationId: 'delete'
            requestBody:
                $ref: '#/components/requestBodies/DeleteBody'
            responses:
                '200':
                    $ref: '#/components/responses/DeleteSuccess'

components:

    # SEGURANÇA
    securitySchemes:
        ApiKeyAuth:
            type: apiKey
            name: x-api-key
            in: header

    # PARÂMETROS
    parameters:
        idParam:
            name: id
            in: query
            description: >
                Realiza a busca pelo **ID** de um Tipo de Agendamento.

                *A existência deste parâmetro funciona como um `find` para retorno de um único registro no banco de dados*
            schema:
                type: integer
                minimum: 1
        idsParam:
            name: ids
            in: query
            description: >
                Realiza a busca pelos **IDS** dos Tipos de Agendamento, separados por vírgula.
            style: form
            explode: false
            schema:
                type: array
                items:
                    type: integer
        nameParam:
            name: name
            in: query
            description: >
                Realiza a busca pelo **NOME** de um Tipo de Agendamento.
            schema:
                type: string
        pageParam:
            name: page
            in: query
            description: Paginação dos resultados
            required: false
            schema:
                type: integer
                minimum: 1
                default: 1

    # CORPO DE REQUISIÇÕES
    requestBodies:
        CreateBody:
            description: 'Este corpo será utilizado para criação de um Tipo de Agendamento.'
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/BaseAppointmentTypeModel'
        UpdateBody:
            description: 'Este corpo será utilizado para atualização de um Tipo de Agendamento.'
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/BaseAppointmentTypeModel'
        DeleteBody:
            description: 'Este corpo será utilizado para exclusão de um Tipo de Agendamento.'
            required: true
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/DeleteRequest'

    # RESPOSTAS
    responses:
        SearchSuccess:
            description: 'Resposta de sucesso, para consultas de Tipos de Agendamento.'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/SearchResponse'
        CreateSuccess:
            description: 'Resposta de sucesso, para criação de um Tipo de Agendamento.'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/CreateResponse'
        UpdateSuccess:
            description: 'Resposta de sucesso, para atualização de um Tipo de Agendamento.'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/UpdateResponse'
        DeleteSuccess:
            description: 'Resposta de sucesso, para exclusão de um Tipo de Agendamento.'
            content:
                application/json:
                    schema:
                        $ref: '#/components/schemas/DeleteResponse'

    # OBJETOS
    schemas:

        # REQUESTS
        DeleteRequest:
            type: object
            properties:
                id:
                    type: integer
                    example: 123
                    description: 'Código do Tipo de Agendamento.'

        # RESPONSES
        SearchResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/AppointmentTypeResponse'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação.'
                total:
                    type: integer
                    example: 90
                    description: 'Quantidade total de resultados'
        CreateResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/AppointmentTypeResponse'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação.'
                message:
                    type: string
                    example: 'Item criado com sucesso'
                    description: 'Mensagem de retorno'
        UpdateResponse:
            type: object
            properties:
                data:
                    $ref: '#/components/schemas/AppointmentTypeResponse'
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação.'
                message:
                    type: string
                    example: 'Item editado com sucesso'
                    description: 'Mensagem de retorno'
        DeleteResponse:
            type: object
            properties:
                success:
                    type: boolean
                    example: true
                    description: 'Flag de sucesso na operação.'
                message:
                    type: string
                    example: 'Item excluído com sucesso!'
                    description: 'Mensagem de retorno'

        # MODEL PARA CRIAÇÃO E ATUALIZAÇÃO
        BaseAppointmentTypeModel:
            type: object
            properties:
                id:
                    type: integer
                    minimum: 1
                    example: 123
                    description: 'ID *(somente informá-lo em caso de atualização de dados)*.'
                name:
                    type: string
                    maxLength: 255
                    example: 'Nome'
                    description: 'Nome do Tipo de Agendamento.'
                category:
                    type: integer
                    example: 0
                    default: 0
                    description: >
                        Categoria:
                          - `0` = Depósito de Container Cheio
                          - `1` = Depósito de Container Vazio
                          - `2` = Depósito de Carga Solta
                          - `3` = Retirada de Container Cheio
                          - `4` = Retirada de Container Vazio
                          - `5` = Retirada de Carga Solta
                          - `6` = Execução de Serviço
                          - `7` = Transferência entre Terminais
                    enum:
                        - 0
                        - 1
                        - 2
                        - 3
                        - 4
                        - 5
                        - 6
                        - 7
                obs:
                    type: string
                    maxLength: 2000
                    nullable: true
                    example: 'Observações Gerais'
                    description: 'Observações gerais do Tipo de Agendamento.'
                parameters:
                    type: object
                    nullable: true
                    description: 'Parâmetros de configuração do Tipo de Agendamento.'
                    properties:
                        start_appointment_on_confirm:
                            type: integer
                            example: 0
                            nullable: true
                            description: 'Inicia automaticamente a Minuta ao confirmar o agendamento.'
                            enum:
                                - 0
                                - 1
                        modal:
                            type: integer
                            example: 0
                            nullable: true
                            description: 'Modal utilizado pelo Tipo de Agendamento: 0 = Rodoviário; 1 = Ferroviário.'
                            enum:
                                - 0
                                - 1
                        create_process_or_trip:
                            type: array
                            nullable: true
                            description: 'Tratativas automáticas: 1 = Programação de Carga; 2 = Programação de Viagem; 3 = Minuta Comum.'
                            items:
                                type: integer
                                enum:
                                    - 1
                                    - 2
                                    - 3
                        operation_id:
                            type: integer
                            minimum: 1
                            nullable: true
                            description: 'ID da operação utilizada nas criações automáticas.'
                        default_owner_id:
                            type: integer
                            minimum: 1
                            nullable: true
                            description: 'ID da empresa de viagem padrão utilizada nas criações automáticas.'
                services:
                    type: array
                    nullable: true
                    items:
                        type: object
                        properties:
                            service_id:
                                type: integer
                                minimum: 1
                                example: 123
                                description: 'ID do Tipo do Serviço.'
                            value:
                                type: number
                                example: 123.45
                                description: 'Valor do Serviço.'
                            quantity:
                                type: number
                                example: 123.45
                                description: 'Quantidade do Serviço.'
                            total:
                                type: number
                                example: 123.45
                                description: 'Total do Serviço.'

        # RESPONSE
        AppointmentTypeResponse:
            type: array
            items:
                type: object
                properties:
                    id:
                        type: integer
                        example: 123
                        description: 'Código do Tipo de Agendamento.'
                    name:
                        type: string
                        maxLength: 255
                        example: 'Nome'
                        description: 'Nome do Tipo de Agendamento.'
                    category:
                        type: integer
                        example: 0
                        description: >
                            Categoria:
                              - `0` = Depósito de Container Cheio
                              - `1` = Depósito de Container Vazio
                              - `2` = Depósito de Carga Solta
                              - `3` = Retirada de Container Cheio
                              - `4` = Retirada de Container Vazio
                              - `5` = Retirada de Carga Solta
                              - `6` = Execução de Serviço
                              - `7` = Transferência entre Terminais
                    obs:
                        type: string
                        maxLength: 2000
                        example: 'Observações Gerais'
                        description: 'Observações gerais do Tipo de Agendamento.'
                    parameters:
                        type: object
                        nullable: true
                        description: 'Parâmetros de configuração do Tipo de Agendamento.'
                        properties:
                            start_appointment_on_confirm:
                                type: integer
                                example: 0
                                nullable: true
                                description: 'Inicia automaticamente a Minuta ao confirmar o agendamento.'
                            modal:
                                type: integer
                                example: 0
                                nullable: true
                                description: 'Modal utilizado pelo Tipo de Agendamento: 0 = Rodoviário; 1 = Ferroviário.'
                            create_process_or_trip:
                                type: array
                                nullable: true
                                description: 'Tratativas automáticas: 1 = Programação de Carga; 2 = Programação de Viagem; 3 = Minuta Comum.'
                                items:
                                    type: integer
                            operation_id:
                                type: integer
                                nullable: true
                                description: 'ID da operação utilizada nas criações automáticas.'
                            default_owner_id:
                                type: integer
                                nullable: true
                                description: 'ID da empresa de viagem padrão utilizada nas criações automáticas.'
                    created_at:
                        type: string
                        format: 'Y-m-d H:i:s'
                        example: '2026-12-31 23:59:59'
                        description: 'Data de Criação do Tipo de Agendamento.'
                    updated_at:
                        type: string
                        format: 'Y-m-d H:i:s'
                        example: '2026-12-31 23:59:59'
                        description: 'Data de Atualização do Tipo de Agendamento.'
                    services:
                        type: array
                        items:
                            type: object
                            properties:
                                service_id:
                                    type: integer
                                    minimum: 1
                                    example: 123
                                    description: 'ID do Tipo do Serviço.'
                                value:
                                    type: number
                                    example: 123.45
                                    description: 'Valor do Serviço.'
                                quantity:
                                    type: number
                                    example: 123.45
                                    description: 'Quantidade do Serviço.'
                                total:
                                    type: number
                                    example: 123.45
                                    description: 'Total do Serviço.'
                    conditions:
                        type: array
                        items:
                            type: object
                            properties:
                                field:
                                    type: string
                                    maxLength: 255
                                    example: 'Campo'
                                    description: 'Campo.'
                                condition:
                                    type: string
                                    maxLength: 100
                                    example: 'Condição'
                                    description: 'Condição.'
                                value:
                                    type: string
                                    example: 'Valores'
                                    description: 'Valores Selecionados.'
                                error_message:
                                    type: string
                                    example: 'Mensagem de Erro'
                                    description: 'Mensagem de Erro.'
                                when:
                                    type: integer
                                    example: 0
                                    default: 0
                                    description: >
                                        Quando:
                                          - `0` = Em qualquer situação
                                          - `1` = Ao Agendar via Sistema
                                          - `2` = Ao Agendar via Minha Carga
                                          - `3` = Ao Confirmar
                                          - `4` = Ao Iniciar
                                          - `5` = Ao Encerrar
                                          - `6` = Ao Cancelar
                                          - `7` = Ao No Show
                                    enum:
                                        - 0
                                        - 1
                                        - 2
                                        - 3
                                        - 4
                                        - 5
                                        - 6
                                        - 7
                                action:
                                    type: integer
                                    example: 0
                                    default: 0
                                    description: >
                                        Ação:
                                          - `0` = Bloquear se
                                          - `1` = Validar se
                                    enum:
                                        - 0
                                        - 1
