                                         - `3`  = Exportação de Serviços
                                         - `4`  = Isenção
                                         - `5`  = Imune
                                         - `6`  = Exigibilidade suspensa por decisão judicial
                                         - `7`  = Exigibilidade suspensa por procedimento administrativo
                                         - `8`  = Tributação fora do município, porém isento
                                         - `9`  = Tributação fora do município, porém imune
                                         - `10` = Tributação fora do município, porém suspensa
