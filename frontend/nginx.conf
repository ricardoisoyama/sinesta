server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Não anunciar a versão do nginx.
    server_tokens off;

    # Cabeçalhos de segurança (valem para o SPA e para as respostas da API que passam pelo proxy).
    # "always" = também em respostas de erro. Atenção: add_header dentro de um "location"
    # descarta os do "server", por isso os locations abaixo não usam add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Câmera só no próprio site: a leitura do código de barras do boleto pelo celular (/leitura-boleto) usa.
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=()" always;
    # Só faz efeito quando servido por HTTPS (o Apache do cPanel termina o TLS e repassa o cabeçalho).
    add_header Strict-Transport-Security "max-age=31536000" always;
    # CSP: scripts só do próprio site; estilos inline liberados (React/recharts/dnd-kit usam style="");
    # fontes do Google Fonts (index.html); imagens em data:/blob: (logo em base64, anexos);
    # blob: em frame/worker para abrir anexos e planilhas geradas no navegador.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; frame-src 'self' blob:; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # JSON dos cadastros pode carregar imagens em base64 (ex.: logo da empresa); anexos até 12 MB.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 256;

    # SPA — todas as rotas caem no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy das chamadas de API para o backend
    location /api/ {
        proxy_pass         http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade          $http_upgrade;
        proxy_set_header   Connection       'upgrade';
        proxy_set_header   Host             $host;
        proxy_set_header   X-Real-IP        $remote_addr;
        proxy_set_header   X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_cache_bypass $http_upgrade;
    }

    # Worker do leitor de PDF (pdf.js) é .mjs: precisa ir como JavaScript, senão o navegador recusa o módulo.
    location ~* \.mjs$ {
        types { application/javascript mjs; }
        expires 1y;
    }

    # Cache estático: "expires" já emite Cache-Control: max-age=1 ano; os arquivos do Vite têm hash no nome.
    # (sem add_header aqui, para não descartar os cabeçalhos de segurança do bloco server)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
    }
}
